name: R67 Aura live Deploy Preview QA
on:
  push:
    branches: ['aura/r67-integrated-recovery-20260929']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_BASE_URL: https://deploy-preview-337--irisgreen-home.netlify.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare Chromium
        run: |
          python -m venv /tmp/ig-r67-live
          /tmp/ig-r67-live/bin/pip -q install playwright==1.55.0
          /tmp/ig-r67-live/bin/python -m playwright install --with-deps chromium >/tmp/ig-r67-live-install.log 2>&1
      - name: Wait for preview and run live browser QA
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$IG_BASE_URL/" >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS "$IG_BASE_URL/" >/dev/null
          /tmp/ig-r67-live/bin/python scripts/test_r67_aura_recovery_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r67-aura-live-preview-qa
          path: reports/r67-aura-recovery
          retention-days: 14
