name: Prisma #369 · QA directo sobre main

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'es/**'
      - 'en/**'
      - 'scripts/build_site.py'
      - 'scripts/prerender_remaining_nojs.py'
      - 'scripts/test_home_child_safe_r42.py'
      - 'scripts/test_r69_unified_interface.py'
      - 'scripts/apply_*.py'
      - 'scripts/reorganize_activity_hubs.py'
      - 'scripts/fix_369_collection_headers.py'
      - 'scripts/test_prisma_369_p28_p37.py'
      - 'scripts/test_prisma_369_p29_p35.py'
      - 'scripts/test_prisma_369_card_system_p47.py'
      - 'scripts/test_prisma_369_theme_p48.py'
      - 'scripts/test_prisma_369_data_p30_p33.py'
      - 'scripts/test_prisma_369_books_p39_p44.py'
      - 'scripts/test_prisma_369_first_paint_p14_p15_p36.py'
      - 'scripts/test_prisma_369_p45_redundant_copy.py'
      - 'scripts/test_prisma_369_home_p4_p7_p10.py'
      - 'assets/ig-first-paint.css'
      - '.github/workflows/prisma-369-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canónico
        run: python scripts/build_site.py

      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium

      - id: p28_p37
        name: '#369 P28 P37'
        continue-on-error: true
        run: python scripts/test_prisma_369_p28_p37.py

      - id: p29_p35
        name: '#369 P29 P35'
        continue-on-error: true
        run: python scripts/test_prisma_369_p29_p35.py

      - id: p47
        name: '#369 P47'
        continue-on-error: true
        run: python scripts/test_prisma_369_card_system_p47.py

      - id: p48
        name: '#369 P48'
        continue-on-error: true
        run: python scripts/test_prisma_369_theme_p48.py

      - id: p30_p33
        name: '#369 P30 P33'
        continue-on-error: true
        run: python scripts/test_prisma_369_data_p30_p33.py --root dist

      - id: p39_p44
        name: '#369 P39 P44'
        continue-on-error: true
        run: python scripts/test_prisma_369_books_p39_p44.py --root dist

      - id: p14_p15_p36
        name: '#369 P14 P15 P36'
        continue-on-error: true
        run: python scripts/test_prisma_369_first_paint_p14_p15_p36.py --root dist

      - id: p45
        name: '#369 P45'
        continue-on-error: true
        run: python scripts/test_prisma_369_p45_redundant_copy.py --root dist

      - id: p4_p7_p10
        name: '#369 P4 P7 P10'
        continue-on-error: true
        run: python scripts/test_prisma_369_home_p4_p7_p10.py --root dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prisma-369-main-qa
          path: reports/prisma-369-*
          retention-days: 14

      - name: Resumen de gates
        if: always()
        env:
          P28_P37: ${{ steps.p28_p37.outcome }}
          P29_P35: ${{ steps.p29_p35.outcome }}
          P47: ${{ steps.p47.outcome }}
          P48: ${{ steps.p48.outcome }}
          P30_P33: ${{ steps.p30_p33.outcome }}
          P39_P44: ${{ steps.p39_p44.outcome }}
          P14_P15_P36: ${{ steps.p14_p15_p36.outcome }}
          P45: ${{ steps.p45.outcome }}
          P4_P7_P10: ${{ steps.p4_p7_p10.outcome }}
        run: |
          echo "P28_P37=$P28_P37"
          echo "P29_P35=$P29_P35"
          echo "P47=$P47"
          echo "P48=$P48"
          echo "P30_P33=$P30_P33"
          echo "P39_P44=$P39_P44"
          echo "P14_P15_P36=$P14_P15_P36"
          echo "P45=$P45"
          echo "P4_P7_P10=$P4_P7_P10"
          test "$P28_P37" = success
          test "$P29_P35" = success
          test "$P47" = success
          test "$P48" = success
          test "$P30_P33" = success
          test "$P39_P44" = success
          test "$P14_P15_P36" = success
          test "$P45" = success
          test "$P4_P7_P10" = success
