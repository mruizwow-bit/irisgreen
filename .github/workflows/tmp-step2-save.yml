name: Temporal · guardar Paso 2
on:
  push:
    branches: ['integracion/20260912-paso2-accesibilidad']
    paths: ['.github/workflows/tmp-step2-save.yml']
permissions:
  contents: write
jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-paso2-accesibilidad
      - name: Incorporar tipografías locales
        run: |
          mkdir -p /tmp/ig-font-pkg assets/fonts
          cd /tmp/ig-font-pkg
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @fontsource/atkinson-hyperlegible @fontsource-variable/newsreader >/dev/null
          cd "$GITHUB_WORKSPACE"
          cp /tmp/ig-font-pkg/node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-italic.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource/atkinson-hyperlegible/LICENSE assets/fonts/LICENSE-Atkinson-Hyperlegible.txt
          cp /tmp/ig-font-pkg/node_modules/@fontsource-variable/newsreader/LICENSE assets/fonts/LICENSE-Newsreader.txt
      - name: Aplicar cambios de fuente
        run: python3 scripts/tmp_step2_apply_source.py
      - name: Preparar Chromium y generar informe
        run: |
          python3 -m venv /tmp/ig-step2
          /tmp/ig-step2/bin/pip -q install playwright==1.55.0
          /tmp/ig-step2/bin/python -m playwright install --with-deps chromium >/tmp/ig-step2-browser.log 2>&1
          python3 scripts/build_site.py
          python3 scripts/audit_accesibilidad.py --root dist
          python3 scripts/audit_sin_js.py --root dist
          python3 scripts/audit_sin_portugues.py --root dist
          /tmp/ig-step2/bin/python scripts/test_zoom_keyboard_focus.py --root dist --out reports/accessibility/zoom-keyboard-focus.json
      - name: Verificar contrato y fuentes remotas
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('dist');pages=list(root.rglob('*.html'))
          counts={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}; remote=[]
          for p in pages:
              text=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\']([^"\']*)["\']',text,re.I) or re.search(r'<meta[^>]*content=["\']([^"\']*)["\'][^>]*name=["\']robots["\']',text,re.I))
              v=m.group(1).strip().lower() if m else None
              counts[v if v in counts else 'otro_o_ninguno']+=1
              if 'fonts.googleapis.com' in text or 'fonts.gstatic.com' in text: remote.append(str(p))
          got={'html':len(pages),**counts,'sitemap_urls':len(re.findall(r'<url(?:\s|>)',Path('dist/sitemap.xml').read_text(encoding='utf-8')))}
          exp={'html':998,'index,follow':982,'noindex,follow':2,'otro_o_ninguno':14,'sitemap_urls':995}
          assert got==exp,(got,exp); assert not remote,remote[:10]
          print(got); print('Google Fonts en dist: 0')
          PY
      - name: Guardar archivos no-workflow
        run: |
          rm -f scripts/tmp_step2_apply_source.py
          git checkout -- .github/workflows/comprobar-publicacion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _headers assets scripts/build_site.py scripts/apply_accessibility_release.py scripts/audit_accesibilidad.py scripts/test_zoom_keyboard_focus.py es/intereses/imprimir/index.html es/recursos/juegos/index.html reports/accessibility/zoom-keyboard-focus.json
          git add -u -- scripts/tmp_step2_apply_source.py
          git commit -m 'Paso 2: accesibilidad, fuentes locales, impresión y seguridad'
          git push origin HEAD:integracion/20260912-paso2-accesibilidad
