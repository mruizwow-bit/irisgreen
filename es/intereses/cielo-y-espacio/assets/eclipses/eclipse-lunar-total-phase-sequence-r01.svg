<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="lt-title lt-desc">
<title id="lt-title">Generic phase sequence around a total lunar eclipse</title>
<desc id="lt-desc">Five generic states show the Moon passing through Earth's shadow: penumbral dimming, partial umbral eclipse, totality with illustrative copper coloration, partial umbral eclipse, and penumbral dimming. No timing or exact color is implied.</desc>
<defs>
 <radialGradient id="sun" cx="48%" cy="45%" r="55%"><stop offset="0%" stop-color="#fffce5"/><stop offset="64%" stop-color="#ffe27a"/><stop offset="100%" stop-color="#eeb13a"/></radialGradient>
 <radialGradient id="moon" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#deded9"/><stop offset="78%" stop-color="#9d9e9b"/><stop offset="100%" stop-color="#70716f"/></radialGradient>
 <radialGradient id="copper" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#df9774"/><stop offset="72%" stop-color="#b25b43"/><stop offset="100%" stop-color="#713128"/></radialGradient>
 </defs>
<g transform="translate(180 260)"><circle r="92" fill="url(#moon)"/><circle r="92" fill="#566173" opacity=".18"/></g>
<g transform="translate(540 260)"><circle r="92" fill="url(#moon)"/><path d="M-92 -34 A92 92 0 0 0 72 55 A92 92 0 0 0 -92 -34Z" fill="#5e302c" opacity=".82"/></g>
<g transform="translate(900 260)"><circle r="92" fill="url(#copper)"/></g>
<g transform="translate(1260 260)"><circle r="92" fill="url(#moon)"/><path d="M92 -34 A92 92 0 0 1 -72 55 A92 92 0 0 1 92 -34Z" fill="#5e302c" opacity=".82"/></g>
<g transform="translate(1620 260)"><circle r="92" fill="url(#moon)"/><circle r="92" fill="#566173" opacity=".18"/></g>
</svg>