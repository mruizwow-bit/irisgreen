name: Verificar transferencia aislada
on:
  push:
    branches: ['rescate/publicacion-20260909']
    paths: ['.github/workflows/rescate-publicacion-20260909.yml']
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          mkdir -p /tmp/iris-transfer
          cp .rescue-data/transfer-*.txt /tmp/iris-transfer/
          sha256sum /tmp/iris-transfer/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iris-transfer-verificar
          path: /tmp/iris-transfer
          retention-days: 1
