<g transform="translate(1332 650)"><circle r="48" fill="url(#moon)"/><circle r="48" fill="#566173" opacity=".19"/></g>
<g transform="translate(1380 175)"><circle r="62" fill="url(#moon)"/><circle r="62" fill="#566173" opacity=".19"/></g>

