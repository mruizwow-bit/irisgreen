          git commit -m 'Situaciones · Sentidos 01-21 ES/EN [skip netlify]'

      - name: Ejecutar build completo sin publicar
        shell: bash
        run: python3 scripts/build_site.py

      - name: Verificar 21 pares y estado VALIDADA oculto
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
