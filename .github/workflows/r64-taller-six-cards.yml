name: R64 Taller six cards QA
on:
  push:
    branches: [agent2/sabik-iris-r08-20260924]
    paths:
      - 'es/taller/index.html'
      - 'en/workshop/index.html'
      - 'assets/r64-taller-six-cards.js'
      - 'assets/r64-taller-six-cards.css'
      - 'scripts/test_r64_taller_six_cards.py'
      - '.github/workflows/r64-taller-six-cards.yml'
  workflow_dispatch:
jobs:
  r64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 pillow playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py
      - run: python scripts/test_r64_taller_six_cards.py
