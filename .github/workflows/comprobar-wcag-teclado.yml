name: Comprobar WCAG flujos de teclado
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teclado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-keyboard
          /tmp/ig-keyboard/bin/pip -q install playwright==1.55.0
          /tmp/ig-keyboard/bin/python -m playwright install --with-deps chromium >/tmp/ig-keyboard-install.log 2>&1
      - name: Construir salida pública
        run: python3 scripts/build_site.py
      - name: Probar interacciones por teclado
        run: |
          cd dist
          /tmp/ig-keyboard/bin/python ../scripts/test_keyboard_flows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wcag-keyboard-flows
          path: dist/reports/wcag-keyboard-flows
          retention-days: 14
