name: Preparar cambio del taller

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplicar-hojas-taller-temporal.yml

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar los dos archivos del taller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          
          path = Path("es/taller/index.html")
          s = path.read_text(encoding="utf-8")
          
          def once(old, new, label):
              global s
              n = s.count(old)
              if n == 1:
                  s = s.replace(old, new, 1)
              elif new in s:
                  return
              else:
                  raise SystemExit(f"{label}: no se encontró el estado esperado")
          
          once('soon: "Lista para imprimir", openSheets:', 'sheetAction: "Abrir e imprimir", openSheets:', "texto español")
          once('soon: "Ready to print", openSheets:', 'sheetAction: "Open and print", openSheets:', "texto inglés")
          once('<a href="/es/taller/" style="display: inline-flex; align-items: center; gap: 9px; background: #17395c; color: #fff; border-radius: 999px; padding: 12px 20px; font-size: 16px; margin-bottom: 18px; text-decoration: none;">', '<a href="/es/taller/hojas/" style="display: inline-flex; align-items: center; gap: 9px; background: #17395c; color: #fff; border-radius: 999px; padding: 12px 20px; font-size: 16px; margin-bottom: 18px; text-decoration: none;">', "botón principal")
          once('      sheets: T.sheets.map((name) => ({ name, state: T.soon })),', '      sheets: T.sheets.map((name, n) => ({ name, state: T.sheetAction, href: "/es/taller/hojas/#ta-" + String(n + 1).padStart(2, "0") })),', "datos de tarjetas")
          
          old_cards = """        <sc-for list="{{ sheets }}" as="s" hint-placeholder-count="12">
                    <div style="background: rgba(255,255,255,0.8); border: 1px solid rgba(23,57,92,0.1); border-radius: 14px; padding: 14px 16px;">
                      <div style="font-size: 16.5px;">{{ s.name }}</div>
                      <div style="font-size: 14px; color: #5d6779;">{{ s.state }}</div>
                    </div>
                  </sc-for>"""
          new_cards = """        <sc-for list="{{ sheets }}" as="s" hint-placeholder-count="12">
                    <a href="{{ s.href }}" style="display: flex; flex-direction: column; gap: 5px; background: rgba(255,255,255,0.8); border: 1px solid rgba(23,57,92,0.1); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: #17395c;">
                      <span style="font-size: 16.5px;">{{ s.name }}</span>
                      <span style="display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: #1f5f8b;">
                        <svg width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"></path></svg>
                        {{ s.state }}
                      </span>
                    </a>
                  </sc-for>"""
          once(old_cards, new_cards, "tarjetas dinámicas")
          
          start = s.find("<!-- ig-sin-js:start -->")
          end = s.find("<!-- ig-sin-js:end -->")
          if start == -1 or end == -1 or end <= start:
              raise SystemExit("No se encontró el bloque sin JavaScript")
          nos = s[start:end]
          if 'data-dc-tpl="123" href="/es/taller/"' in nos:
              nos = nos.replace('data-dc-tpl="123" href="/es/taller/"', 'data-dc-tpl="123" href="/es/taller/hojas/"', 1)
          elif 'data-dc-tpl="123" href="/es/taller/hojas/"' not in nos:
              raise SystemExit("Botón sin JS inesperado")
          
          old_status = '<span class="sc-interp">Lista para imprimir</span>'
          if nos.count(old_status) == 12:
              nos = nos.replace(old_status, '<span class="sc-interp">Abrir e imprimir</span>')
          elif nos.count('<span class="sc-interp">Abrir e imprimir</span>') < 12:
              raise SystemExit("Estados sin JS inesperados")
          
          sheet_names = ["La cuadrícula de nueve casillas", "Las cuatro viñetas", "El cuaderno de campo", "El mapa en blanco", "El tablero de seis casillas", "La ficha de criatura", "La hoja de colección", "La hoja de instrucciones", "La ficha de invento", "La hoja de ritmo", "La ficha de personaje", "La hoja libre"]
          if '/es/taller/hojas/#ta-12' not in nos:
              for i, name in enumerate(sheet_names, 1):
                  needle = f'<span class="sc-interp">{name}</span>'
                  pos = nos.find(needle)
                  if pos == -1:
                      raise SystemExit(f"Falta tarjeta sin JS: {name}")
                  card_start = nos.rfind('<div data-dc-tpl="128"', 0, pos)
                  if card_start == -1:
                      raise SystemExit(f"Falta inicio de tarjeta: {name}")
                  depth = 0
                  card_end = None
                  for match in re.finditer(r'<div\b|</div>', nos[card_start:]):
                      if match.group(0).startswith("<div"):
                          depth += 1
                      else:
                          depth -= 1
                          if depth == 0:
                              card_end = card_start + match.end()
                              break
                  if card_end is None:
                      raise SystemExit(f"Falta cierre de tarjeta: {name}")
                  card = nos[card_start:card_end]
                  href = f"/es/taller/hojas/#ta-{i:02d}"
                  nos = nos[:card_start] + f'<a href="{href}" style="display:block; color:inherit; text-decoration:none">{card}</a>' + nos[card_end:]
          
          s = s[:start] + nos + s[end:]
          path.write_text(s, encoding="utf-8")
          
          payload = ""
          out = gzip.decompress(base64.b64decode(payload))
          Path("es/taller/hojas").mkdir(parents=True, exist_ok=True)
          Path("es/taller/hojas/index.html").write_bytes(out)
          
          if Path("es/taller/hojas/index.html").stat().st_size != 30230:
              raise SystemExit("La página de hojas no coincide con el ZIP")
          if '/es/taller/hojas/#ta-12' not in path.read_text(encoding="utf-8"):
              raise SystemExit("No quedó enlazada la hoja 12")
          PY
      - name: Guardar en una rama para revisión
        run: |
          git config user.name "Iris Green Web"
          git config user.email "actions@users.noreply.github.com"
          git add es/taller/index.html es/taller/hojas/index.html
          git commit -m "Publicar las hojas imprimibles del taller"
          git push origin HEAD:refs/heads/taller-hojas-20260913
