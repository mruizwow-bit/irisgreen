name: Prisma · Interest asset cards
on:
  push:
    branches: [main, 'prisma/interest-asset-cards-foundation-*']
    paths:
      - 'assets/ig-interest-asset-cards.css'
      - 'assets/ig-interest-asset-cards.js'
      - 'tools/prisma/interest-asset-cards-fixture.html'
      - 'tools/prisma/fixtures/lazy-probe.svg'
      - 'scripts/test_prisma_interest_asset_cards.py'
      - '.github/workflows/prisma-interest-asset-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: node --check assets/ig-interest-asset-cards.js
      - run: python -m py_compile scripts/test_prisma_interest_asset_cards.py
      - run: python scripts/test_prisma_interest_asset_cards.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prisma-interest-asset-cards
          path: reports/prisma-interest-asset-cards/
          retention-days: 14
