name: Aplicar EN Investigacion real
on:
  push:
    branches: [recuperacion-estable-20260908]
    paths:
      - .github/workflows/aplicar-investigacion-en-real-20260908.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: feat/investigacion-en-real-20260908
          fetch-depth: 0
      - name: Incorporar traducciones EN sin tocar ES
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re, subprocess, sys

          ROOT = Path.cwd()
          data_path = ROOT / "es/investigacion/estudios-textos.json"
          page_path = ROOT / "es/investigacion/index.html"

          translations = json.loads(r'''{"e1":{"heading_en":"Unmasking in autistic university students","sample_en":"14 interviews + 214 surveys with autistic university students","text_en":["Autistic masking or camouflaging describes the efforts some autistic people make to hide, modify or compensate for autistic traits in order to fit social expectations. It can include deliberately controlling eye contact, imitating other people's behaviour, following social scripts, filtering what one wants to say, or suppressing movements and responses related to sensory needs.","This study analysed a related but different phenomenon: **unmasking**, understood as the deliberate effort to reduce or abandon masking strategies after using them for a long period of time. The research combined interviews with 14 autistic university students and a survey of 214 students.","Most participants knew the concept of unmasking, and about half had tried to put it into practice. Experiences differed greatly between people. For some, it was relatively possible to stop hiding certain behaviours or needs. For others, masking was so internalised that it was difficult to distinguish which behaviours were spontaneous and which had been learned in order to fit in.","Participants described benefits linked to a greater sense of authenticity and relief from the constant effort of monitoring their own behaviour. However, unmasking also created uncertainty and fear of possible social consequences, such as rejection, misunderstanding or loss of acceptance. Context mattered: people tended to feel more able to show themselves authentically with trusted friends, with other autistic people, or in settings where they perceived acceptance.","In the survey, greater difficulty unmasking was related to higher anxiety. Unmasking with family was associated with fewer symptoms of anxiety and depression, although other associations were less consistent.","The study suggests that reducing masking may be linked to authenticity and stress relief for some people, but it is not a simple process and is not necessarily safe in every setting. Social acceptance and support from other people appear to have an important influence.","It does not show that all autistic people should stop masking, that doing so always reduces anxiety or depression, or that it is safe in every social, educational or work context.","---"],"notProven_en":"It does not show that all autistic people should stop masking, that doing so always reduces anxiety or depression, or that it is safe in every context."},"e2":{"heading_en":"GGOC-AD and OCD-related beliefs in adolescents","sample_en":"94 adolescents; 48 intervention and 46 active comparator; 14 days + one-month follow-up","text_en":["Maladaptive beliefs related to obsessive-compulsive disorder — for example, excessive responsibility, overestimation of threat, perfectionism, intolerance of uncertainty or the need to control thoughts — are part of the cognitive models used to explain how some obsessive experiences may be maintained or intensified.","The study evaluated GGOC-AD, an unguided mobile intervention designed to work on these beliefs in adolescents from the Spanish general population. Ninety-four students took part. Forty-eight used GGOC-AD and 46 used a comparison app with neutral content for 14 days. The groups were assessed before the intervention, immediately afterwards and one month later.","Compared with the control group, those who used GGOC-AD showed significantly lower scores in several dimensions of obsessive-compulsive beliefs: responsibility and threat estimation, perfectionism and intolerance of uncertainty, and the importance of thoughts and the need to control them. Lower scores also appeared in obsessive-compulsive symptoms.","Effect sizes were small to moderate. The largest effect among the beliefs analysed corresponded to the importance attributed to thoughts and the need to control them. The effect on OCD symptoms was also small to moderate.","No significant differences were found between groups in anxiety, depression or self-esteem.","The results indicate that a brief mobile intervention can modify certain OCD-related beliefs in the short term and reduce obsessive-compulsive symptom scores in community adolescents.","It does not show that the app prevents OCD in the long term, replaces clinical treatment, or produces general improvements in anxiety, depression or self-esteem. The sample was relatively small and follow-up was brief.","---"],"notProven_en":"It does not show long-term prevention of OCD, it does not replace clinical treatment, and follow-up was brief."},"e3":{"heading_en":"Sleep and anxiety in adolescents","sample_en":"129 independent samples; 416,426 adolescents","text_en":["This meta-analysis examined how different aspects of sleep relate to anxiety during adolescence. It brought together cross-sectional studies, longitudinal research and randomised controlled trials, making it possible to analyse not only whether sleep and anxiety appear associated at one point in time, but also whether sleep problems precede later changes in anxiety and whether changing sleep can influence it.","In cross-sectional analyses, poorer overall sleep quality showed a moderate association with higher anxiety. The overall correlation was approximately **r = 0.34**. Sleep disturbances and impaired daytime functioning showed associations of similar or slightly greater magnitude. Difficulty initiating sleep showed a smaller relationship. Short sleep duration and a more evening-type circadian preference were also related to anxiety, although with weaker associations.","Longitudinal studies indicated that poorer sleep quality at baseline could predict higher anxiety later on. This predictive capacity was clearer within follow-up periods of up to about 12 months. Short sleep duration showed less consistent results than sleep quality.","Randomised trials provided another relevant finding: manipulations that worsened sleep increased anxiety levels, while interventions aimed at improving sleep — including interventions for insomnia — were associated with reductions in anxiety.","Taken together, the evidence indicates that **sleep quality is one of the factors most consistently related to adolescent anxiety within this meta-analysis**. The longitudinal and experimental results make the evidence more informative than a simple cross-sectional correlation.","Not all sleep problems produce anxiety and not all anxiety is explained by sleep. The studies used different measures and designs, and an important part of the literature remains observational.","---"],"notProven_en":"Not all sleep problems produce anxiety and not all anxiety is explained by sleep. An important part of the literature remains observational."},"e4":{"heading_en":"Receiving an ADHD diagnosis in adulthood","sample_en":"21 studies; 397 participants","text_en":["This systematic review brought together research on how people experience receiving an ADHD diagnosis in adulthood. Its aim was not to determine the effectiveness of a treatment or measure the prevalence of ADHD, but to synthesise personal experiences linked to the diagnostic process.","The authors identified three broad areas: **the relationship with oneself, the relationship with other people, and the relationship with care systems**.","In the relationship with oneself, many people described diagnosis as an important event that helped them reinterpret their own biography. Behaviours, difficulties and past experiences could take on a new meaning. For some people this supported self-understanding and a more compassionate attitude towards themselves. At the same time, grief, anger, frustration at not having been identified earlier, or confusion about identity could also appear.","In social relationships, the diagnosis could help relatives, partners or friends better understand certain needs or behaviours. However, it also introduced concerns related to stigma and to the decision of whether or not to disclose the diagnosis.","In the relationship with health systems, many studies described delays, barriers and complex routes to assessment. Support after diagnosis was very uneven: some people received treatment, information or follow-up support, while others felt that the process ended almost at the moment they received the diagnostic label.","Receiving an ADHD diagnosis in adulthood can be both **validating and destabilising**. Its impact depends on personal history, relationships, the social environment, stigma and the resources available after diagnosis.","It does not indicate what proportion of adults experiences each reaction and it cannot predict how a specific person will experience their diagnosis.","---"],"notProven_en":"It does not indicate what proportion of adults experiences each reaction and it cannot predict how a specific person will experience their diagnosis."},"e5":{"heading_en":"ARFID compared with anorexia and bulimia in young people","sample_en":"22 studies","text_en":["ARFID is an eating disorder characterised by insufficient or highly restricted intake that is not explained by a central concern about weight or body shape, as is usually the case in anorexia nervosa. Avoidance may be related, among other reasons, to sensitivity to flavours or textures, low interest in food, or fear of negative consequences such as choking or vomiting.","This review compared the clinical profile of children and adolescents with ARFID with that of young people with anorexia nervosa and bulimia nervosa.","Compared with anorexia nervosa, the ARFID group showed a higher probability of anxiety and a lower probability of depressive disorders. In addition, ARFID samples included a considerably higher proportion of boys, had a lower mean age and recorded fewer hospitalisations.","A similar pattern appeared in several respects in the comparison with bulimia nervosa. Depressive disorders were less frequent in ARFID and the proportion of boys was clearly higher. People with ARFID were also younger. Anxiety tended to be more frequent in ARFID than in bulimia, although this difference did not reach statistical significance in the relevant analysis.","The data support the view that ARFID has a different clinical profile from anorexia and bulimia in young populations. This distinction is important to avoid interpreting every form of food restriction through the same model.","This does not mean that all people with ARFID are young, male or anxious, or that hospitalisation can never be necessary. The results come from clinical studies with different criteria and samples.","---"],"notProven_en":"This does not mean that all people with ARFID are young, male or anxious, or that hospitalisation is never necessary."},"e6":{"heading_en":"Stigma in adults with ADHD","sample_en":"17 studies","text_en":["The review examined the different forms of stigma described by adults with ADHD and their possible relationship with quality of life. The included studies addressed **self-stigma or internalised stigma, perceived stigma, public stigma and structural stigma**.","Internalised stigma appeared to be related to negative self-evaluations and to taking in disparaging social messages about ADHD. Greater ADHD symptomatology was associated with more internalised stigma, which in turn was related to greater functional impairment, lower self-esteem and poorer quality of life.","Perceived stigma — the expectation or perception of being judged by other people — appeared linked to difficulties seeking help, following pharmacological treatments or deciding whether to disclose the diagnosis.","Public stigma was the most frequently studied type. The studies described negative social attitudes, stereotypes and judgements about people with ADHD, with a particular presence of research in academic contexts.","Structural stigma was much less studied. The few available studies described barriers to access to care, but the review found very little research directly measuring how these barriers affect quality of life.","There is a consistent body of evidence documenting different forms of stigma towards adults with ADHD. The evidence is especially clear for self-stigma, perceived stigma and public stigma.","The review does not establish a causal relationship between stigma and poorer quality of life, and it notes that structural stigma remains under-researched.","---"],"notProven_en":"It does not establish causality between stigma and quality of life, and shows that evidence on structural barriers remains scarce."},"e7":{"heading_en":"Developmental dyslexia and DLD together","sample_en":"18 studies","text_en":["The study analysed reading when developmental dyslexia and developmental language disorder occur together.","The co-occurring group showed broader and more severe reading difficulties, affecting decoding, fluency and comprehension. Isolated dyslexia tended to affect decoding more, while isolated DLD affected linguistic comprehension more."],"notProven_en":"It does not determine the frequency of co-occurrence in the general population, and the studies used different criteria and measures."},"e8":{"heading_en":"Obsessions and compulsions in adolescents with OCD","sample_en":"40 adolescents with OCD + 40 controls","text_en":["OCD includes obsessions and compulsions, but the two components are not exactly the same. This study investigated whether the severity of obsessions and the severity of compulsions were related to distinct patterns of brain connectivity in adolescents.","Forty adolescents with OCD and 40 matched controls without OCD took part. The researchers used functional magnetic resonance imaging and whole-brain connectivity analyses. They also compared the maps obtained with information on neurotransmitter receptor distribution and gene expression.","In the OCD group, obsessions and compulsions were related to each other, but only moderately, supporting their analysis as partially differentiated dimensions.","The severity of obsessions was related to connectivity patterns involving, among other regions, the left dorsolateral prefrontal cortex and posterior areas of the cerebellum. Some of these patterns included connections with the default mode network, the visual network and the sensorimotor network.","Analyses of compulsions showed different associations, leading the authors to propose that obsessions and compulsions may be partly supported by different neural circuits.","The work provides exploratory evidence that separating obsessions and compulsions as dimensions may help study the heterogeneity of adolescent OCD more precisely.","It does not identify a diagnostic biomarker. A brain scan cannot be used on the basis of this study to diagnose OCD, predict the right treatment or determine the severity of a specific person. The sample was small and the study is exploratory.","---"],"notProven_en":"It does not identify a diagnostic biomarker. A brain scan cannot be used on the basis of this study to diagnose OCD or choose individual treatment."},"e9":{"heading_en":"Body representations in autistic people","sample_en":"54 studies; 2,982 participants","text_en":["Body representation is not a single process. It includes, among other dimensions, the **body schema**, which is involved in movement and sensorimotor regulation, and **body image**, which includes the conscious, perceptual, emotional and cognitive experience of one's own body.","The review analysed how these dimensions have been studied in autistic people between 2000 and 2025. One of the most important conclusions was the strong imbalance in the literature: approximately 81% of studies focused on body schema and sensorimotor aspects, while body image was much less studied.","The topics studied included interoception, proprioception, multisensory integration and other processes related to how the brain integrates signals from the body and the environment.","The review did not find a single alteration that would support talking about a general “autistic body deficit”. Results varied depending on the dimension assessed, the task used, age and the characteristics of the samples.","The authors suggest that studying body representations in a more organised way may help understand aspects related to sensory perception, motor coordination, autonomy, self-perception and identity.","The available research suggests that body representations in autism are **multidimensional** and cannot be reduced to a single ability.","There is no single bodily alteration present in all autistic people. The literature is very imbalanced and some dimensions have barely been studied.","---"],"notProven_en":"There is no single 'autistic body deficit' or alteration present in all autistic people."},"e10":{"heading_en":"Mental imagery, sensory sensitivity and autistic traits","sample_en":"595 adults","text_en":["The study examined three variables: the intensity or vividness of mental imagery, sensory sensitivity and autistic traits. The sample included autistic and non-autistic adults, and standardised questionnaires were used to assess visual and tactile mental imagery, sensory sensitivity and autistic traits.","As expected from previous research, autistic traits showed a strong association with sensory sensitivity: higher autistic-trait scores were linked to higher sensory-sensitivity scores.","Higher autistic traits were also associated with somewhat less vivid mental imagery, in both visual and tactile modalities. However, these associations were small.","The central finding was that the relationship between mental imagery and sensory sensitivity was minimal. The association between visual imagery and sensory sensitivity was very small and would cease to be statistically significant with a strict correction for multiple comparisons. No significant association appeared between tactile imagery and sensory sensitivity.","In addition, autistic people in the sample more often showed scores compatible with aphantasia — very low or absent visual mental imagery — than non-autistic people.","The data support a clear relationship between autistic traits and sensory sensitivity, but do not support the idea that the vividness of mental imagery explains that sensitivity in any substantial way.","It is a cross-sectional study with self-reported measures. It cannot establish causes or apply the results to a specific person.","---"],"notProven_en":"It is cross-sectional and self-reported; it does not establish causality or explain the sensory sensitivity of a specific person."},"e11":{"heading_en":"Food insecurity in families with autistic children and young people","sample_en":"11 studies; 9 included in meta-analysis","text_en":["Food insecurity occurs when a household does not have stable access to sufficient, adequate and nutritious food. This review analysed the literature on food insecurity in families with autistic children and young people.","The meta-analysis of nine studies calculated an approximate pooled prevalence of **29%**. After an adjustment related to publication bias, the estimate was around **31%**.","However, this figure must be interpreted with great caution. Heterogeneity between studies was extraordinarily high, above 99%. This means that results differed greatly between studies and that there is no single figure that can simply be transferred to all families with autistic children.","The review also found that food insecurity worsened during the COVID-19 pandemic in some studies and could be related to higher caregiver stress and additional difficulties in feeding patterns.","The authors emphasise that policies addressing food insecurity should not be limited only to financial support. In households with autistic people, specific sensory, nutritional and behavioural needs may also be relevant.","The literature suggests that food insecurity is a relevant problem for some families with autistic children and young people.","It is not correct to turn the result into the statement “one in three autistic families has food insecurity”. The enormous heterogeneity and possible publication bias prevent the percentage from being interpreted as a universal prevalence.","---"],"notProven_en":"It is not correct to turn 29–31% into a universal prevalence for all autistic families in every country."},"e12":{"heading_en":"Executive function and emotional regulation in autism, ADHD and co-occurrence","sample_en":"22 articles","text_en":["Executive function includes processes such as planning, inhibition, working memory, cognitive flexibility and behavioural control. Emotional regulation refers to the processes through which a person identifies, modulates and responds to their emotional states.","The review examined how these two dimensions are related in autism, ADHD and co-occurring autism and ADHD.","Of the 22 articles included, **16 studied ADHD, 4 studied autism and only 2 studied the co-occurrence of autism and ADHD**. This distribution matters because it shows that much of what we know comes from ADHD research and that specific evidence on co-occurrence is still scarce.","Overall, the studies supported an association between greater executive difficulties and greater emotional dysregulation in the conditions analysed. However, the magnitude and shape of this relationship varied according to participants' age and the type of measure used. Results were not identical when executive functions were assessed through performance tasks and when questionnaires or reports of everyday behaviour were used.","Executive function and emotional regulation appear to be meaningfully related in autism and ADHD, and may be useful transdiagnostic dimensions for research.","With only two studies focused on co-occurrence, the review cannot define a specific or distinctive “AuDHD” profile or determine with certainty how it differs from autism or ADHD separately.","---"],"notProven_en":"It cannot define a specific AuDHD profile or reliably distinguish co-occurrence from autism or ADHD separately."},"e13":{"heading_en":"Belonging and unbelonging in transgender and gender-diverse autistic adults","sample_en":"13 transgender and gender-diverse autistic adults","text_en":["The study explored how transgender and gender-diverse autistic adults experience belonging and exclusion across different areas of their lives. The researchers used narrative interviews and reflexive thematic analysis.","Results were organised across several levels. In the workplace, participants described difficulties accessing suitable jobs, obtaining adjustments and remaining in environments that could be socially or sensorially difficult. Some people turned to self-employment or frequent job changes to gain more control over their environment.","In education, communities and social spaces, some people found places where they could feel understood, especially in certain autistic or queer communities. However, these spaces were not automatically accessible either: sensory, social or other barriers could still exist.","In healthcare, experiences of **gatekeeping**, lack of professional knowledge, costs, bureaucracy and situations of ableism or transphobia appeared. Some participants perceived that being autistic negatively influenced how professionals interpreted their decisions related to gender identity.","At the closest level of relationships, chosen families, supportive relationships and certain forms of community living appeared as important sources of recognition and belonging.","Belonging does not depend only on individual identity. It is influenced by work, educational and healthcare structures, by the accessibility of spaces and by interpersonal relationships.","With 13 participants, the study cannot calculate frequencies or represent all experiences of transgender and gender-diverse autistic people.","---"],"notProven_en":"With 13 participants, it cannot calculate frequencies or represent all experiences."},"e14":{"heading_en":"Autistic burnout","sample_en":"48 studies; approximately 4,000 autistic people","text_en":["The review synthesised qualitative, quantitative and mixed-methods research on how autistic people describe and experience what is known as **autistic burnout**.","Across the studies reviewed, an experience of intense exhaustion appeared repeatedly, accompanied by a reduction in the ability to carry out activities that had previously been possible. In some people it could last for long periods and alternate with moments of more acute crisis.","Factors associated with burnout included sensory and social overload, continuous masking, stigma, lack of adjustments, the demands of everyday life, and difficulties identifying or communicating internal states.","Described consequences included poorer wellbeing, reduced participation in community activities, difficulties maintaining responsibilities and a reduction in positive expectations about the future.","Elements related to recovery or protection included greater understanding of one's own needs, access to support, rest, time alone and sensory relief. The authors note, however, that individual strategies alone do not solve the problem when environmental demands remain incompatible with the person's needs.","The review also highlights an important limitation: most participants in the available literature were white adults, women, late-diagnosed and with at least average verbal or intellectual abilities.","There is a growing and relatively coherent body of research describing autistic burnout as a disabling experience of exhaustion and loss of capacity associated with sustained demands and poorly adjusted environments.","“Autistic burnout” remains a research concept and is not, by itself, an established diagnosis in the main diagnostic manuals.","---"],"notProven_en":"Autistic burnout remains a research concept and is not, by itself, an established diagnosis in the main diagnostic manuals."},"e15":{"heading_en":"Healthcare access in young people with intellectual disability","sample_en":"33 studies","text_en":["This review examined how children and adolescents with intellectual disability use healthcare services and what factors make access to care harder or easier.","The included studies analysed hospital admissions, emergency services, mental health care and other healthcare resources.","Compared with young people without intellectual disability, young people with intellectual disability generally had more hospital admissions, more emergency department visits, longer hospital stays, greater use of some outpatient mental-health services, more 30-day readmissions and more care-related complications. Some studies also recorded higher mortality.","Factors that facilitated access included having healthcare coverage and using visual supports or other tools adapted to the person's communication and understanding.","Barriers included low socioeconomic status, communication difficulties with professionals and lack of knowledge about intellectual disability among healthcare providers.","The review notes that results came from very different health systems, including Australia, the United States, England and other countries, so barriers are not necessarily identical in every context.","The evidence shows important inequalities in healthcare use and outcomes for young people with intellectual disability.","The review does not identify a single intervention that resolves these inequalities and does not allow us to assume that all barriers are present in every country or health system.","---"],"notProven_en":"It does not identify a single intervention that resolves these inequalities, and the health systems studied were very different."},"e16":{"heading_en":"Behavioural interventions in FASD","sample_en":"7 systematic reviews","text_en":["It brought together reviews on non-pharmacological interventions for children and adolescents with FASD.","Positive signals appeared in executive functions, social problem-solving and emotional regulation, among other areas."],"notProven_en":"Overall quality was uneven: only two reviews were high quality; two were low and three critically low according to AMSTAR-2."},"e17":{"heading_en":"Autism, gender diversity, health and healthcare","sample_en":"1,094 cis autistic people + 174 transgender/gender-diverse autistic people + 1,295 non-autistic cis people","text_en":["The study compared health and healthcare experiences across three groups of adults: cisgender autistic people, transgender or gender-diverse autistic people, and non-autistic cisgender people.","The two autistic groups reported more health problems and considerably worse healthcare experiences than the non-autistic group.","Compared with the non-autistic cisgender group, transgender or gender-diverse autistic people were 2.3 times more likely to report a physical health condition, 10.9 times more likely to report a mental health condition and 5.8 times more likely to report self-harm.","Differences in healthcare experience were very large. The two autistic groups reported worse experiences on 50 of the 51 items assessed, including communication with professionals, healthcare-related anxiety, access, ability to advocate for one's own needs, health-system problems, sensory experiences and situations related to shutdowns or meltdowns.","When the two autistic groups were compared directly, transgender or gender-diverse people had even worse results on a smaller set of indicators related to communication, access, advocating for needs and shutdowns.","The research documents important healthcare inequalities in autistic people and points to additional risks in part of the transgender or gender-diverse autistic population.","The study is cross-sectional and self-reported. The sample was not representative of the whole population and overrepresented white people, UK residents, people with university education and people assigned female at birth.","---"],"notProven_en":"It is cross-sectional and self-reported; the sample did not represent the whole population and was biased on several demographic characteristics."},"e18":{"heading_en":"ARFID prevalence and methodological quality","sample_en":"26 studies; 122,861 participants","text_en":["The study estimated the prevalence of ARFID and examined how much the estimate changes when methodological quality is weighted.","The conventional estimate was 11.14%, but it fell to 4.51% when study quality was weighted. Heterogeneity was close to 99.6%."],"notProven_en":"It is not rigorous to present 11.14% or 4.51% as the universal prevalence of ARFID."},"e19":{"heading_en":"Family-school collaboration in selective mutism","sample_en":"4 parents + 3 teachers","text_en":["The study explored how families and teachers experience the collaboration needed to support children and young people with selective mutism.","Selective mutism means that a person can speak in certain contexts but cannot manage to do so in others. In school, this can create important difficulties and may be misunderstood if it is seen simply as shyness, opposition or lack of willingness.","The researchers conducted semi-structured interviews with four parents and three teachers. The experiences reported by families were predominantly negative, whereas teachers more often described positive experiences.","Despite that difference, the analysis identified common elements that supported useful collaboration: **actively listening to families, involving them in decisions, recognising their knowledge of the child, sharing priorities and building mutual trust**.","The authors also emphasise the need for schools to understand selective mutism better and to have specific training in order to collaborate effectively with families.","The study provides qualitative information about the features families and teachers value in a good collaborative relationship.","The sample includes only seven participants and comes from a limited context. It cannot establish universal recommendations or measure which strategy produces better outcomes.","---"],"notProven_en":"The sample includes only seven participants and cannot support universal recommendations or estimate the effectiveness of strategies."},"e20":{"heading_en":"European guidelines on psychological interventions for tics and Tourette syndrome","sample_en":"Review of the clinical evidence available up to 2021","text_en":["These guidelines review the available evidence on psychological interventions for Tourette syndrome and other tic disorders.","**Psychoeducation** is considered an important first step. It involves providing clear and understandable information about tics, their course, management options, treatments and impact on everyday life. By itself, it is not the intervention with the strongest evidence for reducing tic severity, but it can improve knowledge and attitudes among relatives, teachers and peers.","The largest amount of experimental evidence was found for **habit reversal training (HRT)** and, especially, for the expanded programme **CBIT — Comprehensive Behavioral Intervention for Tics**. HRT teaches the person to recognise the tic and the sensations that may precede it and to use a response that is incompatible with performing the tic.","There is also evidence for **exposure and response prevention (ERP)**. In this approach, the person practises tolerating premonitory sensations and delaying or resisting tics for progressively longer periods. The evidence base is smaller than for HRT/CBIT because fewer studies exist.","The guidelines indicate that, when psychoeducation is not sufficient and intervention is considered necessary, HRT/CBIT and ERP can be considered first-line psychological treatments. The availability of trained professionals remains an important limitation.","The strongest evidence within psychological interventions for tics corresponds to HRT/CBIT. ERP also has scientific support, although with a smaller evidence base.","Not all tics require treatment. The decision depends on the impact they have on the person, their functioning and their preferences. The guidelines also do not imply that one intervention produces the same result in every person.","---","1. Autistic unmasking: authenticity and reduced masking load, but social risks and great individual variability.","2. GGOC-AD: small to moderate short-term effects on OCD-related beliefs and symptoms; no general effect on anxiety, depression or self-esteem.","3. Sleep and anxiety: poor sleep quality is consistently related to adolescent anxiety; trials add further evidence.","4. Adult ADHD diagnosis: it can be validating and help reinterpret one's own life, but it can also bring grief, stigma and difficulties accessing support."],"notProven_en":"Not all tics require treatment, and a guideline does not imply that an intervention produces the same result in every person."},"e21":{"heading_en":"Autism Spectrum Disorder: A Review","sample_en":"Clinical synthesis of diagnosis and treatment","text_en":["The study summarises the heterogeneity of autism, multidisciplinary assessment and the absence of a single biomarker with clinical diagnostic utility."],"notProven_en":"It does not replace local guidelines; a narrative review does not, by itself, quantify the effectiveness of each intervention."},"e22":{"heading_en":"A systematic review of social camouflaging in autistic adults and youth","sample_en":"Studies of autistic adults and young people","text_en":["The study identifies compensation, masking and assimilation strategies, with motivations related to self-protection and social connection; the relationship with mental health appears complex and possibly bidirectional."],"notProven_en":"The literature does not allow us to state that camouflaging by itself causes mental-health problems or that all autistic people camouflage."},"e23":{"heading_en":"Interoception in autistic people","sample_en":"31 studies; meta-analysis of 5 comparable adult studies","text_en":["The study found no uniform alteration in cardiac interoceptive accuracy in adults and found heterogeneous results in other dimensions."],"notProven_en":"It does not support the claim that autistic people universally have an 'interoceptive deficit'."},"e24":{"heading_en":"Auditory processing and the autistic profile","sample_en":"Experiential, behavioural and neurological evidence","text_en":["The study brings together differences in auditory processing and phenomena such as hyperacusis, misophonia and phonophobia, as well as their relationships with overload, anxiety and sleep."],"notProven_en":"It is an integrative review; it does not show that a specific auditory difficulty is present in every autistic person."},"e25":{"heading_en":"Autism Spectrum Disorder and sleep","sample_en":"Paediatric literature on autism and sleep","text_en":["The study reviews insomnia, assessment, co-occurring factors and behavioural and pharmacological options in autistic populations."],"notProven_en":"It does not turn every sleep problem into a 'symptom of autism'; specific causes need to be assessed."},"e26":{"heading_en":"Melatonin for sleep disorders in autistic people","sample_en":"15 studies","text_en":["The study found favourable effects on total sleep time, sleep latency and sleep efficiency compared with control/placebo."],"notProven_en":"Heterogeneity was very high and not all sleep parameters improved; it does not justify self-medication."},"e27":{"heading_en":"Therapies and sleep in autistic children","sample_en":"35 randomised trials","text_en":["The study compared melatonin, sleep education for families, behavioural interventions, physical activity and complementary therapies; several showed signals of benefit."],"notProven_en":"The indirect rankings from a network meta-analysis depend on the comparability of studies and are not the same as an individual recommendation."},"e28":{"heading_en":"Sensory processing differences and internalising/externalising problems in autism","sample_en":"Literature on sensory processing and mental health/behaviour","text_en":["The study supports associations between sensory differences and internalising/externalising problems in autistic samples."],"notProven_en":"Associations do not prove causality, and sensory and psychological measures vary between studies."},"e29":{"heading_en":"Alexithymia in autism","sample_en":"15 articles comparing autistic and non-autistic groups","text_en":["The study found higher frequency and higher alexithymia scores in autistic groups."],"notProven_en":"It does not show that alexithymia is a core or universal characteristic of autism."},"e30":{"heading_en":"Pathological demand avoidance in children and adolescents","sample_en":"Available literature in children and adolescents","text_en":["The study concluded that PDA remained a controversial concept, with methodological problems and heterogeneity in its identification."],"notProven_en":"It does not validate PDA as an independent diagnosis or as an established subtype of autism."},"e31":{"heading_en":"Pathological demand avoidance: diagnosis or circular logic?","sample_en":"Studies on PDA instruments and construct","text_en":["The study reassesses the available evidence on PDA and the validity of its identification tools."],"notProven_en":"It should be labelled as literature on methodological debate, not as confirmation of an official diagnosis."},"e32":{"heading_en":"Verbal fluency and autism through the lens of monotropism","sample_en":"17 articles on verbal fluency","text_en":["The study shows great variability between and within groups and proposes a neurodiversity-affirming reinterpretation from the perspective of monotropism."],"notProven_en":"It does not constitute a diagnostic validation of monotropism or show that it explains all autistic attentional differences."},"e33":{"heading_en":"Late diagnosis in autism","sample_en":"420 articles","text_en":["The study sh