name: R40 Rincon R04 rendered assets
on:
  push:
    branches:
      - agent7/r40-rincon-r04-20260926
    paths:
      - tools/r40-rincon-r04/**
      - .github/workflows/r40-rincon-r04-build.yml
permissions:
  contents: write
jobs:
  render-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent7/r40-rincon-r04-20260926
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3
      - name: Ensure ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render first-party audio
        run: python tools/r40-rincon-r04/render_audio.py
      - name: Static contract
        run: node tools/test-r40-rincon-r04.js
      - name: Local server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/r04-http.log 2>&1 &
          sleep 2
      - name: Browser DOM contract
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p docs/r40-a7-build/r04-evidence/dom
          for mode in videos sounds ball; do
            "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=1800 --dump-dom "http://127.0.0.1:8765/es/sitio-tranquilo/?r40mode=${mode}" > "docs/r40-a7-build/r04-evidence/dom/${mode}.html"
            grep -q 'data-r40-r04-ready="true"' "docs/r40-a7-build/r04-evidence/dom/${mode}.html"
            grep -q "data-r40-active-mode=\"${mode}\"" "docs/r40-a7-build/r04-evidence/dom/${mode}.html"
            grep -q 'data-r40-video-first="true"' "docs/r40-a7-build/r04-evidence/dom/${mode}.html"
            grep -q 'data-r40-sound-first="true"' "docs/r40-a7-build/r04-evidence/dom/${mode}.html"
            grep -q 'data-r40-ball-first="true"' "docs/r40-a7-build/r04-evidence/dom/${mode}.html"
          done
      - name: Capture layouts
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p docs/r40-a7-build/r04-evidence/screenshots
          for mode in videos sounds ball; do
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=1440,900 --screenshot="docs/r40-a7-build/r04-evidence/screenshots/${mode}-1440x900.png" "http://127.0.0.1:8765/es/sitio-tranquilo/?r40mode=${mode}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=1800 --window-size=390,844 --screenshot="docs/r40-a7-build/r04-evidence/screenshots/${mode}-390x844.png" "http://127.0.0.1:8765/es/sitio-tranquilo/?r40mode=${mode}"
          done
          test "$(sha256sum docs/r40-a7-build/r04-evidence/screenshots/*-1440x900.png | awk '{print $1}' | sort -u | wc -l)" -eq 3
          test "$(sha256sum docs/r40-a7-build/r04-evidence/screenshots/*-390x844.png | awk '{print $1}' | sort -u | wc -l)" -eq 3
      - name: Hash evidence
        run: |
          mkdir -p docs/r40-a7-build/r04-evidence
          sha256sum audio/rincon/r04/*.m4a audio/rincon/r04/AUDIO_MANIFEST.json docs/r40-a7-build/r04-evidence/screenshots/*.png > docs/r40-a7-build/r04-evidence/SHA256SUMS.txt
          echo "R40_RINCON_R04_GENERATED_EVIDENCE" > docs/r40-a7-build/r04-evidence/WORKFLOW_RESULTS.txt
          node tools/test-r40-rincon-r04.js >> docs/r40-a7-build/r04-evidence/WORKFLOW_RESULTS.txt
          echo "python=$(python --version 2>&1)" >> docs/r40-a7-build/r04-evidence/WORKFLOW_RESULTS.txt
          echo "node=$(node --version)" >> docs/r40-a7-build/r04-evidence/WORKFLOW_RESULTS.txt
          echo "ffmpeg=$(ffmpeg -version | head -1)" >> docs/r40-a7-build/r04-evidence/WORKFLOW_RESULTS.txt
      - name: Commit generated assets
        run: |
          git config user.name "irisgreen-r40-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio/rincon/r04 docs/r40-a7-build/r04-evidence
          git diff --cached --quiet && exit 0
          git commit -m "R40-RINCON-R04: add rendered audio assets and layout evidence"
          git push origin HEAD:agent7/r40-rincon-r04-20260926
