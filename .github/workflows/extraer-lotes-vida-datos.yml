name: Extraer lotes de traducción Vida diaria y Datos
on:
  push:
    branches: [recuperacion-estable-20260908]
    paths: ['.github/workflows/extraer-lotes-vida-datos.yml']
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Crear lotes sin duplicaciones de HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          out=Path('/tmp/translation-batches'); shutil.rmtree(out,ignore_errors=True); out.mkdir()
          vida=json.loads(Path('es/biblioteca/vida-diaria.json').read_text(encoding='utf-8'))
          vh={k:vida[k] for k in ('aviso','criterio','categorias')}
          (out/'vida-header.json').write_text(json.dumps(vh,ensure_ascii=False,indent=2),encoding='utf-8')
          fichas=vida['fichas']
          for start in range(0,len(fichas),8):
              rows=[]
              for i,x in enumerate(fichas[start:start+8],start):
                  keep={k:x[k] for k in ('cat','title','lede','sections') if k in x}
                  for k in ('revisarAntesDe','notaFuente','plazo','plazoDesde','plazoHasta','plazoCerrado','avisoFuente'):
                      if x.get(k): keep[k]=x[k]
                  keep['_index']=i
                  rows.append(keep)
              (out/f'vida-{start//8+1:02d}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          data=json.loads(Path('es/datos/datos.json').read_text(encoding='utf-8'))
          dh={'cover':data['cover'],'territorios':data['territorios']}
          (out/'datos-header.json').write_text(json.dumps(dh,ensure_ascii=False,indent=2),encoding='utf-8')
          pages=data['paginas']
          for start in range(0,len(pages),7):
              rows=[]
              for i,x in enumerate(pages[start:start+7],start):
                  y={k:v for k,v in x.items() if k!='sources'}
                  y['_index']=i
                  rows.append(y)
              (out/f'datos-{start//7+1:02d}.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print('vida',len(fichas),'datos',len(pages),'lotes',len(list(out.glob('*.json'))))
          PY
          git checkout recuperacion-estable-20260908
          rm -rf reports/translation-source
          mkdir -p reports/translation-source
          cp /tmp/translation-batches/*.json reports/translation-source/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/translation-source
          git commit -m 'Guardar lotes fuente para traducción de Vida diaria y Datos'
          git push origin HEAD:recuperacion-estable-20260908
