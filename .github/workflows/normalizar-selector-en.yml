name: Idiomas · normalizar selector EN

on:
  push:
    branches: [feat/en-datos-20260908]
    paths:
      - .github/workflows/normalizar-selector-en.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/en-datos-20260908
          fetch-depth: 0
      - name: Reordenar selectores estáticos EN a ES · EN
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>{const p=path.join(dir,e.name);return e.isDirectory()?walk(p):[p]});}
          let changed = 0;
          for (const fp of walk('en').filter(f => f.endsWith('.html'))) {
            let html = fs.readFileSync(fp,'utf8');
            const before = html;
            html = html.replace(/<nav aria-label="Language" class="langs">([\s\S]*?)<\/nav>/g, (nav, inner) => {
              const es = inner.match(/<a\b[^>]*lang="es"[^>]*>\s*ES\s*<\/a>/i)?.[0];
              const en = inner.match(/<span\b[^>]*class="[^"]*\blang\b[^"]*\bon\b[^"]*"[^>]*>\s*EN\s*<\/span>|<span\b[^>]*class="[^"]*\bon\b[^"]*\blang\b[^"]*"[^>]*>\s*EN\s*<\/span>/i)?.[0];
              if (!es || !en) return nav;
              return `<nav aria-label="Language" class="langs">\n${es}\n${en}\n</nav>`;
            });
            if (html !== before) { fs.writeFileSync(fp, html); changed++; }
          }
          console.log('selectors_reordered='+changed);
          if (changed < 300) throw new Error('Se esperaban más de 300 selectores EN reordenados; encontrados '+changed);
          NODE
          rm -f .github/workflows/normalizar-selector-en.yml
      - name: Validar y commit
        shell: bash
        run: |
          grep -R "<span[^>]*>EN</span>" -n en/situations en/neurodiversity/conditions | head -20 && exit 1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m "Normalizar selector ES EN en páginas inglesas" || true
          git push origin HEAD:feat/en-datos-20260908
