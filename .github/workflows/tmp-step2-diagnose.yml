name: Temporal · diagnosticar Paso 2
on:
  push:
    branches: ['integracion/20260912-paso2-accesibilidad']
    paths: ['.github/workflows/tmp-step2-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-paso2-accesibilidad
      - name: Construir salida pública
        run: python3 scripts/build_site.py
      - name: Auditar estructura visible real
        run: |
          python3 scripts/audit_accesibilidad.py --root dist --informe-solo
          cat dist/reports/publicacion/accesibilidad.json
      - name: Contar Google Fonts y estilos Atkinson inline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('dist')
          google=[]; inline=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.css','.js'}: continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'fonts.googleapis.com' in s or 'fonts.gstatic.com' in s: google.append(p.relative_to(root).as_posix())
              if "font-family: 'Atkinson Hyperlegible'" in s or 'font-family:"Atkinson Hyperlegible"' in s: inline.append(p.relative_to(root).as_posix())
          print('GOOGLE_FONTS',len(google)); print('\n'.join(google[:80]))
          print('ATKINSON_INLINE',len(inline)); print('\n'.join(inline[:80]))
          PY
