name: Integrar Situaciones Sentidos 01-21

on:
  push:
    branches:
      - integracion/situaciones-sentidos-01-21-20260910
    paths:
      - .github/workflows/situaciones-sentidos-01-21.yml

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion/situaciones-sentidos-01-21-20260910
          fetch-depth: 0

      - name: Aplicar tanda
        run: python3 scripts/apply_situaciones_sentidos_01_21.py

      - name: Comprobar fuente protegida de Sentidos
        run: |
          python3 scripts/sentidos_author.py
          git diff --check

      - name: Guardar tanda en la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            editorial/reviews/situaciones_sentidos_ES_EN.md \
            editorial/reviews/situaciones-sentidos-manifest.json \
            scripts/sentidos_author.py \
            scripts/run_accessibility_descriptions_part1.py \
            scripts/hide_internal_validation_labels.py \
            scripts/build_site.py \
            buscador.json \
            es/situaciones \
            en/situations
          git diff --cached --check
          git diff --cached --quiet && { echo 'No hay cambios que guardar'; exit 1; } || true
          git commit -m 'Situaciones Sentidos 01-21 ES-EN [skip netlify]'

      - name: Probar build completo sin publicar
        run: python3 scripts/build_site.py

      - name: Verificar resultado público local
        run: python3 scripts/apply_situaciones_sentidos_01_21.py --verify-dist

      - name: Subir solo a rama de integración
        run: git push origin HEAD:integracion/situaciones-sentidos-01-21-20260910
