name: Main canónico · superficie de revisión

on:
  push:
    branches: [main]
    paths-ignore:
      - 'COORDINACION_IRIS_GREEN/**'
      - 'MAINTENANCE_ACTIVE.txt'
      - 'assets/maintenance.html'
      - 'scripts/build_maintenance.py'
      - '.github/workflows/publicar-mantenimiento-netlify.yml'
      - '.github/workflows/publicar-produccion-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irisgreen-main-review
  cancel-in-progress: false

jobs:
  main-review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Identificar commit de main
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Desactivar builds Git duplicados y conservar mantenimiento
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          SITE_ID: 40042464-343c-4587-b6b7-f6159836e291
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          site_id = os.environ["SITE_ID"]
          token = next((os.environ.get(key) for key in ("NETLIFY_AUTH_TOKEN", "NETLIFY_TOKEN", "NETLIFY_ACCESS_TOKEN") if os.environ.get(key)), None)
          if not token:
              raise SystemExit("Falta credencial Netlify")
          url = "https://api.netlify.com/api/v1/sites/" + site_id
          def request(method="GET", payload=None):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"}, data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Netlify {method}: HTTP {error.code}") from None
          before = request()
          if before.get("id") != site_id:
              raise SystemExit("Site inesperado")
          published = before.get("published_deploy") or {}
          if not published.get("locked") or "maintenance" not in published.get("title", "").lower():
              raise SystemExit("Producción no está bloqueada en mantenimiento; no modificar configuración")
          if (before.get("build_settings") or {}).get("stop_builds") is not True:
              request("PATCH", {"build_settings": {"stop_builds": True}})
          after = request()
          if (after.get("build_settings") or {}).get("stop_builds") is not True:
              raise SystemExit("No se pudo verificar stop_builds=true")
          current = after.get("published_deploy") or {}
          if current.get("id") != published.get("id") or current.get("locked") is not True:
              raise SystemExit("Producción cambió durante la operación; revisar")
          for key in ("password", "password_context", "sso_login", "sso_login_context"):
              if before.get(key) != after.get(key):
                  raise SystemExit("Cambió una protección de acceso; revisar")
          before_build = dict(before.get("build_settings") or {})
          after_build = dict(after.get("build_settings") or {})
          for metadata_key in ("stop_builds", "updated_at"):
              before_build.pop(metadata_key, None)
              after_build.pop(metadata_key, None)
          if before_build != after_build:
              changed_keys = sorted(key for key in before_build.keys() | after_build.keys() if before_build.get(key) != after_build.get(key))
              raise SystemExit("Cambió otra configuración de build; revisar campos: " + ", ".join(changed_keys))
          Path("/tmp/irisgreen-production-before-review.txt").write_text(published["id"])
          print("NETLIFY_GIT_BUILDS_STOPPED=true")
          print("PUBLIC_MAINTENANCE_PRESERVED=" + published["id"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Flujo único de revisión\n\nNetlify Git builds: detenidos. GitHub Actions construye main y actualiza el alias existente main-review. Producción bloqueada en mantenimiento.\n")
          PY

      - name: Construir main canónico
        run: python3 scripts/build_site.py

      - name: Publicar única superficie estable de revisión
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          SITE_ID: 40042464-343c-4587-b6b7-f6159836e291
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          TOKEN="${NETLIFY_AUTH_TOKEN:-${NETLIFY_TOKEN:-$NETLIFY_ACCESS_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No hay token de Netlify configurado"
            exit 1
          fi

          npx -y netlify-cli@27.11.1 deploy \
            --no-build \
            --dir=dist \
            --site="$SITE_ID" \
            --auth="$TOKEN" \
            --alias=main-review \
            --message="Iris Green canonical main review ${SOURCE_SHA}" \
            --json > /tmp/irisgreen-main-review-deploy.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path("/tmp/irisgreen-main-review-deploy.json").read_text())
          deploy_id = result.get("deploy_id")
          if not deploy_id:
              raise SystemExit("Netlify no devolvió un deploy_id: no declarar publicación verificada")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Revisión de main\n\n")
              summary.write(f"- Rama fuente: main\n- Commit construido: {os.environ['SOURCE_SHA']}\n")
              summary.write(f"- Deploy Netlify: {deploy_id}\n")
              summary.write("- URL: https://main-review--irisgreen-home.netlify.app\n")
              summary.write("- Destino: revisión protegida; producción continúa en mantenimiento.\n")
          print(f"MAIN_REVIEW_DEPLOY_ID={deploy_id}")
          print(f"MAIN_REVIEW_SOURCE_SHA={os.environ['SOURCE_SHA']}")
          PY
