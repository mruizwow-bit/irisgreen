"Example. NICE guideline NG69, from 2017, covers anorexia, bulimia, binge-eating disorder and OSFED. It does not cover ARFID or pica, so those two pages do not cite it."},{"id":"MET-0013","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section > p[2]","texto":"Ver las fichas de condiciones","contexto":"enlace regla 1","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"View the condition pages"},{"id":"MET-0014","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[2] > h3","texto":"2 · Las fichas sin fuente lo dicen en su propia página","contexto":"regla 2","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"2 · Pages without a source say so on the page itself"},{"id":"MET-0015","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[2] > p","texto":"Ejemplo. La de amnesia disociativa dice que la evidencia de tratamiento es escasa: no se nombra documento porque no lo hay, no por descuido.","contexto":"ejemplo regla 2","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Example. The dissociative amnesia page says that treatment evidence is scarce: no document is named because there is none, not because it was overlooked."},{"id":"MET-0016","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[2] > p[2]","texto":"Ver una ficha con el aviso","contexto":"enlace regla 2","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"View a page with the notice"},{"id":"MET-0017","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[3] > h3","texto":"3 · Las cifras con su denominador: a quién se preguntó, cuántas personas y con qué método","contexto":"regla 3","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"3 · Figures with their denominator: who was asked, how many people and by which method"},{"id":"MET-0018","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[3] > p","texto":"Ejemplo. Las cuatro cifras de autismo de la colección de datos no miden lo mismo, y cada una lleva su población y su método en la misma frase.","contexto":"ejemplo regla 3","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Example. The four autism figures in the data collection do not measure the same thing, and each one gives its population and method in the same sentence."},{"id":"MET-0019","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[3] > p[2]","texto":"Ver las páginas de datos","contexto":"enlace regla 3","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"View the data pages"},{"id":"MET-0020","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[4] > h3","texto":"4 · Los grados de certeza separan qué existe de qué ayuda","contexto":"regla 4","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"4 · Certainty grades separate what exists from what helps"},{"id":"MET-0021","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[4] > p","texto":"Son dos preguntas distintas y se responden aparte. Una ficha puede tener el cuadro en grado A y el tratamiento en grado C.","contexto":"explicación regla 4","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"They are two different questions and are answered separately. A page may have the main box at grade A and the treatment at grade C."},{"id":"MET-0022","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[4] > ul > li","texto":"Grado A. Lo respalda una guía clínica o una revisión sistemática, nombrada y con año.","contexto":"lista grado A","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Grade A. It is supported by a clinical guideline or a systematic review, named and dated."},{"id":"MET-0023","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[4] > ul > li[2]","texto":"Grado B. Lo respalda un documento institucional o estudios sueltos, con sus límites dichos.","contexto":"lista grado B","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Grade B. It is supported by an institutional document or individual studies, with their limits stated."},{"id":"MET-0024","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[4] > ul > li[3]","texto":"Grado C. Es práctica razonable, no resultado de investigación. La ficha lo dice con esas palabras.","contexto":"lista grado C","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Grade C. It is reasonable practice, not a research finding. The page says so in those words."},{"id":"MET-0025","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[4] > p[2]","texto":"Ver los grados en las fichas","contexto":"enlace regla 4","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"View the grades in the pages"},{"id":"MET-0026","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[5] > h3","texto":"5 · La fecha de revisión, a la vista, y el aviso cuando una guía tiene sustituta prevista","contexto":"regla 5","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"5 · The review date is visible, and there is a notice when a guideline is due to be replaced"},{"id":"MET-0027","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[5] > p","texto":"Ejemplo. La CG31 está vigente y en actualización. La ficha lo dice y lleva la fecha en la que hay que volver a mirarla.","contexto":"ejemplo regla 5","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Example. CG31 is current and under update. The page says so and includes the date when it needs to be checked again."},{"id":"MET-0028","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"section[5] > p[2]","texto":"Ver el trabajo de revisión","contexto":"enlace regla 5","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"View the review work"},{"id":"MET-0029","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"h2[2]","texto":"Cómo se escribe","contexto":"título de sección","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"How it is written"},{"id":"MET-0030","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul > li","texto":"No se señala a nadie y no se etiqueta. Los nombres oficiales de un diagnóstico o de un trámite se mantienen porque hacen falta para pedirlos, nunca como definición de una persona.","contexto":"lista de escritura","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"No one is singled out and no one is labelled. The official names of a diagnosis or a procedure are kept because they are needed to request them, never as the definition of a person."},{"id":"MET-0031","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul > li[2]","texto":"No hay palabras despectivas, ni para rebatirlas: escribirlas ya las mete en la cabeza de quien lee.","contexto":"lista de escritura","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"There are no derogatory words, not even to challenge them: writing them already puts them into the reader’s head."},{"id":"MET-0032","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul > li[3]","texto":"No hay consejos disfrazados de evidencia. Cuando algo es práctica razonable y no un resultado de investigación, la ficha lo dice.","contexto":"lista de escritura","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"There is no advice disguised as evidence. When something is reasonable practice and not a research finding, the page says so."},{"id":"MET-0033","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul > li[4]","texto":"Frases cortas, una idea por frase, y panel de lectura accesible en todas las páginas.","contexto":"lista de escritura","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Short sentences, one idea per sentence, and an accessible reading panel on every page."},{"id":"MET-0034","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"h2[3]","texto":"Qué es y qué no es cada cosa","contexto":"título de sección","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"What each thing is and is not"},{"id":"MET-0035","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul[2] > li","texto":"Una situación cotidiana no es un diagnóstico. Toda ficha de situación lo dice de forma visible.","contexto":"lista de aclaraciones","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"An everyday situation is not a diagnosis. Every situation page says this visibly."},{"id":"MET-0036","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul[2] > li[2]","texto":"Una escala de cribado no diagnostica.","contexto":"lista de aclaraciones","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"A screening scale does not diagnose."},{"id":"MET-0037","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul[2] > li[3]","texto":"Una correlación no demuestra causa.","contexto":"lista de aclaraciones","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"A correlation does not prove causation."},{"id":"MET-0038","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"ul[2] > li[4]","texto":"Una experiencia vivida no es una prevalencia.","contexto":"lista de aclaraciones","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"A lived experience is not a prevalence figure."},{"id":"MET-0039","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"h2[4]","texto":"Quién hace qué","contexto":"título de sección","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Who does what"},{"id":"MET-0040","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"p[5]","texto":"Los libros los escribe Iris Green, desde lo que ocurre en su casa, y los adapta ella misma a lectura fácil. La corrección profesional es de Natalia. Las ilustraciones, de Mary. Las traducciones, de Patricia, Wataru e Iris.","contexto":"créditos","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"The books are written by Iris Green, from what happens in her home, and she adapts them herself into easy reading. Professional proofreading is by Natalia. The illustrations are by Mary. Translations are by Patricia, Wataru and Iris."},{"id":"MET-0041","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"p[6]","texto":"Cada ficha lleva la fecha de su última revisión y un enlace a esta página. Si una cifra o un documento no cuadra, escribe a informacion@irisgreen.eu: llega a quien lo escribió.","contexto":"contacto y revisión","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Each page carries the date of its last review and a link to this page. If a figure or document does not add up, write to informacion@irisgreen.eu: it reaches the person who wrote it."},{"id":"MET-0042","bloque":"metodologia","archivo":"es/metodologia/index.html","url":"/es/metodologia/","campo":"p[7]","texto":"Quién escribe esto","contexto":"enlace final","propuesta_tecnica":"ruta /en/methodology/ separada (HTML paralelo generado desde el español, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Who writes this"},{"id":"ACC-0001","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"head > title","texto":"Lectura accesible · Qué hace cada botón","contexto":"pestaña del navegador y resultado de búsqueda","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Accessible reading · What each button does"},{"id":"ACC-0002","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"head > meta[name=\"description\"]","texto":"Cómo utilizar los ajustes de lectura, conservar las preferencias y conocer las comprobaciones y limitaciones de accesibilidad de Iris Green.","contexto":"meta description / resumen buscador","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"How to use the reading settings, keep your preferences and understand Iris Green’s accessibility checks and limitations."},{"id":"ACC-0003","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"head > meta[property=\"og:title\"]","texto":"Lectura accesible","contexto":"título social / OG","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Accessible reading"},{"id":"ACC-0004","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"head > meta[property=\"og:description\"]","texto":"Cómo utilizar los ajustes de lectura, conservar las preferencias y conocer las comprobaciones y limitaciones de accesibilidad de Iris Green.","contexto":"descripción social / OG","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"How to use the reading settings, keep your preferences and understand Iris Green’s accessibility checks and limitations."},{"id":"ACC-0005","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"p","texto":"Inicio","contexto":"miga de pan","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Home"},{"id":"ACC-0006","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"h1","texto":"Lectura accesible","contexto":"título principal","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Accessible reading"},{"id":"ACC-0007","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"p[2]","texto":"Abre Lectura en la cabecera para ajustar la presentación. Puedes combinar las opciones y volver a la vista original. Aquí se explica qué hacen los controles disponibles y qué limitaciones quedan.","contexto":"entradilla","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Open Reading in the header to adjust the presentation. You can combine the options and return to the original view. This page explains what the available controls do and what limitations remain."},{"id":"ACC-0008","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"h2","texto":"Qué hace cada botón","contexto":"título de sección","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"What each button does"},{"id":"ACC-0009","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section > h3","texto":"A− y A+ · Tamaño del texto","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"A− and A+ · Text size"},{"id":"ACC-0010","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section > p","texto":"Cambian el tamaño del contenido entre el 100 %, 115 %, 130 % y 150 %. El porcentaje indica el valor elegido y el botón se desactiva al llegar a su límite. La cabecera y los paneles flotantes no se amplían con este ajuste. También puedes usar el zoom de tu navegador.","contexto":"explicación control A−/A+","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"They change the size of the content between 100%, 115%, 130% and 150%. The percentage shows the selected value and the button is disabled when it reaches its limit. The header and floating panels are not enlarged by this setting. You can also use your browser zoom."},{"id":"ACC-0011","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[2] > h3","texto":"Letra más separada","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Wider letter spacing"},{"id":"ACC-0012","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[2] > p","texto":"Aplica una combinación de separación entre letras, palabras y líneas. Para ajustarlas por separado, abre «Tipografía, espaciado y anchura», que también permite elegir la separación entre párrafos. Utilizar este botón de combinación sustituye las separaciones personalizadas; no cambia la tipografía ni la anchura elegidas.","contexto":"explicación letra más separada","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Applies a combination of spacing between letters, words and lines. To adjust them separately, open “Typography, spacing and width”, which also lets you choose paragraph spacing. Using this combined button replaces custom spacing settings; it does not change the selected typeface or width."},{"id":"ACC-0013","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[3] > h3","texto":"Botones más grandes","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Bigger buttons"},{"id":"ACC-0014","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[3] > p","texto":"Aumenta los controles de texto preparados para este ajuste. No agranda las zonas superpuestas sobre las ilustraciones, porque podrían taparse entre sí. En Vera y el mapa de casa puedes abrir «Usar botones en lugar de tocar la imagen».","contexto":"explicación botones grandes","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Increases the text controls that are prepared for this setting. It does not enlarge areas overlaid on illustrations, because they could cover each other. In Vera and the home map, you can open “Use buttons instead of touching the image”."},{"id":"ACC-0015","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[4] > h3","texto":"Más contraste","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"More contrast"},{"id":"ACC-0016","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[4] > p","texto":"Refuerza el texto y los fondos de lectura sin aplicar un filtro de color a las fotografías o ilustraciones. No es un selector de temas completos ni garantiza que todos los elementos gráficos estén adaptados.","contexto":"explicación contraste","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Strengthens text and reading backgrounds without applying a colour filter to photographs or illustrations. It is not a full theme selector and does not guarantee that every graphic element is adapted."},{"id":"ACC-0017","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[5] > h3","texto":"Guía de lectura","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Reading guide"},{"id":"ACC-0018","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[5] > p","texto":"Muestra una banda que sigue al puntero. Si el foco del teclado coincide con la banda, esta se aparta del control. La guía todavía no dispone de controles propios para colocarla con teclado o mediante botones táctiles.","contexto":"explicación guía de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Shows a band that follows the pointer. If keyboard focus coincides with the band, it moves away from the control. The guide still does not have its own controls for positioning it with the keyboard or through touch buttons."},{"id":"ACC-0019","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[6] > h3","texto":"Leer en voz alta","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Read aloud"},{"id":"ACC-0020","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[6] > p","texto":"Activa la función de voz disponible en la página. En las fichas de texto se inicia al pulsar un fragmento; algunas páginas interactivas utilizan un texto de lectura preparado. Desactiva el botón para detenerla. Esta función no sustituye a un lector de pantalla y todavía no ofrece pausa, continuación ni velocidad.","contexto":"explicación leer en voz alta","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Activates the voice function available on the page. On text pages, it starts when you press a fragment; some interactive pages use a prepared reading text. Turn the button off to stop it. This function does not replace a screen reader and still does not offer pause, resume or speed controls."},{"id":"ACC-0021","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[6] > p[2]","texto":"Se utiliza el servicio de voz que ofrece el navegador. Algunas voces pueden utilizar servicios remotos: no se garantiza que el procesamiento de todo texto sea local. Recargar o cambiar de página no inicia una voz por haber guardado otras preferencias.","contexto":"nota técnica voz","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"It uses the voice service provided by the browser. Some voices may use remote services: there is no guarantee that all text processing is local. Reloading or changing page does not start a voice because other preferences have been saved."},{"id":"ACC-0022","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[7] > h3","texto":"Reducir movimiento","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Reduce motion"},{"id":"ACC-0023","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[7] > p","texto":"Desactiva las animaciones y transiciones de la página controladas por sus estilos. Si tu dispositivo solicita reducir movimiento, la web lo respeta aunque esta opción propia esté desactivada. El panel indica cuándo está activa esa preferencia del dispositivo. Este ajuste no controla la reproducción dentro de servicios de vídeo externos.","contexto":"explicación reducir movimiento","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Disables the page’s animations and transitions controlled by its styles. If your device requests reduced motion, the website respects that even when this own option is switched off. The panel indicates when that device preference is active. This setting does not control playback inside external video services."},{"id":"ACC-0024","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[8] > h3","texto":"Restablecer","contexto":"control de lectura","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Reset"},{"id":"ACC-0025","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[8] > p","texto":"Reinicia únicamente las preferencias de lectura de Iris Green. No borra los favoritos ni el idioma elegido. Sigue respetando la reducción de movimiento y los colores forzados de tu dispositivo.","contexto":"explicación restablecer","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Resets only Iris Green’s reading preferences. It does not delete favourites or the chosen language. It continues to respect reduced motion and forced colours on your device."},{"id":"ACC-0026","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[9] > h2","texto":"Tipografía, espaciado y anchura","contexto":"bloque independiente de texto","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Typography, spacing and width"},{"id":"ACC-0027","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[9] > p","texto":"Abre Lectura y despliega «Tipografía, espaciado y anchura». Puedes elegir la letra original o alternativas de tipo Arial, Verdana o Georgia, según las fuentes disponibles en tu dispositivo. No se descarga una tipografía nueva ni se promete que una letra sea mejor para todas las personas.","contexto":"tipografía y espaciado","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Open Reading and expand “Typography, spacing and width”. You can choose the original typeface or Arial-, Verdana- or Georgia-style alternatives, depending on the fonts available on your device. No new typeface is downloaded and no promise is made that one font is better for everyone."},{"id":"ACC-0028","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[9] > p[2]","texto":"La separación entre letras, palabras, líneas y párrafos tiene cuatro controles independientes. Los valores con × indican una proporción del tamaño de la letra. «Original» recupera la presentación habitual de ese ajuste; no modifica los demás. El botón de espaciado rápido sigue ofreciendo una combinación y sustituye las cuatro separaciones personalizadas cuando lo utilizas.","contexto":"tipografía y espaciado","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Spacing between letters, words, lines and paragraphs has four independent controls. Values marked with × indicate a proportion of the font size. “Original” restores the usual presentation for that setting; it does not modify the others. The quick spacing button still offers a combination and replaces the four custom spacing settings when you use it."},{"id":"ACC-0029","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[9] > p[3]","texto":"La anchura Media o Estrecha limita las líneas de texto sin reducir el tamaño elegido. «Restablecer estos ajustes» recupera tipografía, separaciones y anchura originales; conserva el tamaño, el contraste y las demás preferencias. «Restablecer», fuera de ese bloque, continúa reiniciando todas las preferencias propias de la web.","contexto":"anchura y restablecer ajustes","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Medium or Narrow width limits the length of text lines without reducing the chosen size. “Reset these settings” restores the original typeface, spacing and width; it keeps size, contrast and the other preferences. “Reset”, outside that block, still resets all the website’s own preferences."},{"id":"ACC-0030","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"section[9] > p[4]","texto":"Las elecciones se conservan en el mismo navegador cuando permite guardarlas. La muestra del panel permite comparar la letra y los espacios. Cabecera, paneles e ilustraciones mantienen su presentación; las fichas y tableros siguen necesitando sus comprobaciones de uso. Estos ajustes no son una certificación de accesibilidad ni una sustitución de tecnologías de apoyo.","contexto":"conservación de ajustes y límites","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Your choices are kept in the same browser when it allows them to be saved. The sample in the panel lets you compare the typeface and spacing. Header, panels and illustrations keep their presentation; pages and boards still need their own usability checks. These settings are not an accessibility certification or a replacement for assistive technologies."},{"id":"ACC-0031","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"h2[2]","texto":"Guardar los ajustes","contexto":"título de sección","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Saving the settings"},{"id":"ACC-0032","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"p[3]","texto":"Las preferencias de presentación se guardan en este navegador y se recuperan al cambiar entre las páginas conectadas al sistema de lectura. No se necesita una cuenta. Si el navegador no permite guardarlas, funcionan en la página actual y el panel avisa de esa limitación. Borrar los datos del sitio o utilizar otro navegador puede hacer que tengas que elegirlas de nuevo.","contexto":"guardar preferencias","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Presentation preferences are saved in this browser and restored when you move between pages connected to the reading system. No account is needed. If the browser does not allow them to be saved, they work on the current page and the panel warns you about that limitation. Deleting site data or using another browser may mean you need to choose them again."},{"id":"ACC-0033","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"h2[3]","texto":"Colores y controles seleccionados","contexto":"título de sección","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Colours and selected controls"},{"id":"ACC-0034","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"p[4]","texto":"Los filtros compartidos seleccionados llevan el texto subrayado, además del cambio de color. Cuando el navegador activa una paleta de colores forzados, se utilizan sus colores para controles, campos y paneles. No hace falta activar un «modo para daltonismo». La revisión de información transmitida por el color en todos los gráficos y juegos no está terminada.","contexto":"colores y estados seleccionados","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"The selected shared filters have underlined text, as well as the colour change. When the browser activates a forced-colours palette, its colours are used for controls, fields and panels. There is no need to activate a “colour-blind mode”. The review of information conveyed by colour in all graphics and games is not finished."},{"id":"ACC-0035","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"h2[4]","texto":"Música y teclado","contexto":"título de sección","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Music and keyboard"},{"id":"ACC-0036","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"p[5]","texto":"Música abre un reproductor pequeño abajo a la derecha. No empieza a sonar al abrirlo: la reproducción se inicia al pulsar Escuchar, elegir una pista o utilizar Anterior o Siguiente. Puedes cerrarlo con Escape o con su botón de cierre. Si el reproductor o el panel de Lectura tapa un control que recibe el foco del teclado fuera del panel, se recoge para dejarlo visible. Recoger el reproductor no detiene una pista que ya hayas iniciado; vuelve a abrir Música para pausarla.","contexto":"música y teclado","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Music opens a small player at the bottom right. It does not start playing when you open it: playback starts when you press Listen, choose a track or use Previous or Next. You can close it with Escape or its close button. If the player or the Reading panel covers a control that receives keyboard focus outside the panel, it collapses to leave it visible. Collapsing the player does not stop a track you have already started; open Music again to pause it."},{"id":"ACC-0037","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"h2[5]","texto":"Alcance de las comprobaciones","contexto":"título de sección","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Scope of the checks"},{"id":"ACC-0038","bloque":"lectura-accesible","archivo":"es/lectura-accesible/index.html","url":"/es/lectura-accesible/","campo":"p[6]","texto":"Se han realizado pruebas técnicas de controles y navegación en un navegador de prueba, en tamaños de escritorio y móvil, y con preferencias del dispositivo emuladas. No equivalen a haber probado cada dispositivo, cada voz o cada combinación de ajustes.","contexto":"alcance de pruebas técnicas","propuesta_tecnica":"ruta /en/accessible-reading/ separada (HTML paralelo, patrón de Condiciones y Situaciones)","estado":"EN inexistente","texto_en":"Technical tests of controls and navigation have been carried out in a test browser, at desktop and mobile sizes, and with emulated device preferences. They are not the same as testing every device, every voice or every combination of settings."},{"id":"ACC-0039","bloque":