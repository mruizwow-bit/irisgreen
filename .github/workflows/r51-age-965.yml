name: R51 Global age 965 gate
on:
  push:
    branches: ['agent2/sabik-iris-r08-20260924']
    paths: ['assets/safety/age-classification-r51-*.json','scripts/test_r51_age_965.py','.github/workflows/r51-age-965.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python scripts/test_r51_age_conditions.py
      - run: python scripts/test_r51_age_situations.py
      - run: python scripts/test_r51_age_965.py
