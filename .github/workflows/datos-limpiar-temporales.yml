name: Datos · limpiar temporales

on:
  push:
    branches: [feat/en-datos-20260908]
    paths:
      - .github/workflows/datos-limpiar-temporales.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/en-datos-20260908
          fetch-depth: 0
      - name: Eliminar dependencias temporales y workflow
        shell: bash
        run: |
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/datos-limpiar-temporales.yml
          git status --short
      - name: Commit limpieza
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m "Limpiar temporales de prueba de Datos" || true
          git push origin HEAD:feat/en-datos-20260908
