name: Investigación completa EN
on:
  push:
    branches: ['ajustes/investigacion-en-20260907']
    paths:
      - 'editorial/translations/investigacion-en-*.json'
      - 'scripts/apply_investigacion_en.py'
      - 'scripts/test_investigacion_en.py'
      - '.github/workflows/investigacion-en.yml'
permissions:
  contents: write
concurrency:
  group: investigacion-en-irisgreen
  cancel-in-progress: true
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/investigacion-en-20260907
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-research
          /tmp/ig-research/bin/pip -q install playwright==1.55.0
          /tmp/ig-research/bin/python -m playwright install --with-deps chromium >/tmp/ig-research-browser.log 2>&1
      - name: Integrar los 120 estudios ingleses
        run: python3 scripts/apply_investigacion_en.py
      - name: Actualizar aviso inglés ya completado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('es/investigacion/index.html')
          s=p.read_text()
          s=s.replace('Editorial adaptation inspired by GRADE. A screening scale does not diagnose; a correlation does not prove cause; lived experience is not a prevalence. The study texts are, for now, in Spanish.','Editorial adaptation inspired by GRADE. A screening scale does not diagnose; a correlation does not prove cause; lived experience is not a prevalence.')
          p.write_text(s)
          PY
      - name: Generar exactamente la salida pública
        run: |
          python3 scripts/build_site.py
          python3 scripts/repair_routes.py --check
      - name: Probar Investigación ES EN
        run: /tmp/ig-research/bin/python scripts/test_investigacion_en.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: investigacion-en-resultados
          path: reports/languages/investigacion-en.json
          retention-days: 7
      - name: Guardar únicamente los archivos públicos probados
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- es/investigacion/estudios-textos.json es/investigacion/index.html
          git diff --cached --quiet || git commit -m 'Completar Investigación en inglés'
          git push origin HEAD:ajustes/investigacion-en-20260907
