name: Aplicar migración de idioma local v2
on:
  push:
    branches:
      - fix/idioma-local-20260908
    paths:
      - .github/workflows/aplicar-migracion-idioma-local-v2.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idioma-local-20260908
      - name: Insertar limpieza temprana de ig_lang en rutas ES
        run: |
          python3 -c "from pathlib import Path; p=Path('assets/preferencias-lectura.js'); s=p.read_text(encoding='utf-8'); marker=\"  if (window.IGPreferences) return;\"; insert=\"  if (/^\\\\/es(?:\\\\/|$)/.test(window.location.pathname)) { try { window.localStorage.removeItem('ig_lang'); } catch (_) {} }\\n\"; assert marker in s; p.write_text(s.replace(marker, insert+marker, 1), encoding='utf-8')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/preferencias-lectura.js
          git commit -m 'Limpiar idioma global heredado al entrar en rutas españolas'
          git push origin HEAD:fix/idioma-local-20260908
