name: Cierre · paso 1 · sale el portugués

on:
  push:
    branches:
      - cierre/20260912-sale-portugues

permissions:
  contents: write

jobs:
  retirar-portugues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cierre/20260912-sale-portugues
          fetch-depth: 0

      - name: Diagnosticar portugués residual de Trámites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def walk(value, path='$'):
              if isinstance(value, dict):
                  for k, v in value.items():
                      p=f'{path}.{k}'
                      if k.lower() == 'pt':
                          print('PT_KEY', p)
                      yield from walk(v, p)
              elif isinstance(value, list):
                  for i, v in enumerate(value):
                      yield from walk(v, f'{path}[{i}]')
              elif isinstance(value, str) and ('/pt-br/' in value.lower() or value.lower() in {'pt','pt-br'}):
                  print('PT_VALUE', path, repr(value))

          for p in [Path('es/tramites/tramites-datos.json'), Path('es/tramites/directorio/tramites-datos.json')]:
              data=json.loads(p.read_text(encoding='utf-8'))
              print('ARCHIVO', p)
              list(walk(data))
          raise SystemExit('Diagnóstico deliberado: revisar PT_KEY/PT_VALUE antes de borrar')
          PY
