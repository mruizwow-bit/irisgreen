name: Aplicar auditoría 420 navegación protegida

on:
  push:
    branches:
      - integracion/20260912-senales-relaciones-final

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-senales-relaciones-final
          fetch-depth: 1
      - name: Aplicar auditoría a la navegación protegida
        run: python3 scripts/apply_auditoria_420_relaciones.py --root . --update-navigation-manifest
      - name: Comprobar las 420 unidades antes de guardar
        run: python3 scripts/audit_420_relaciones.py --root .
      - name: Guardar adaptación aprobada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial/navigation es/situaciones en/situations es/biblioteca en/everyday-life
          if git diff --cached --quiet; then
            echo "La navegación protegida ya estaba actualizada."
            exit 0
          fi
          git commit -m "Auditoría 420: actualizar navegación protegida"
          git push origin HEAD:integracion/20260912-senales-relaciones-final
