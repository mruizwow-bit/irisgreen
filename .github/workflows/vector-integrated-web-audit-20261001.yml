name: Vector integrated web audit 2026-10-01
on:
  push:
    branches: ['vector/recovery-audit-20261001']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vector-integrated-web-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build current recovery
        run: python scripts/build_site.py
      - name: Install Chromium
        run: |
          python -m venv /tmp/ig-vector-audit
          /tmp/ig-vector-audit/bin/pip -q install playwright==1.55.0
          /tmp/ig-vector-audit/bin/python -m playwright install --with-deps chromium >/tmp/ig-vector-playwright.log 2>&1
      - name: Run integrated audit
        run: |
          python -m http.server 4173 --directory dist >/tmp/ig-vector-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          /tmp/ig-vector-audit/bin/python scripts/audit_vector_integrated_web_20261001.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vector-integrated-web-audit-20261001
          path: |
            reports/vector-integrated-web-audit-20261001
            reports/routes/build.json
            /tmp/ig-vector-http.log
          retention-days: 14
