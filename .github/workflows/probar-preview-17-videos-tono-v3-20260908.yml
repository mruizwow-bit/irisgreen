name: Probar preview 17 videos tono v3
on:
  push:
    branches: [recuperacion-estable-20260908]
    paths:
      - '.github/workflows/probar-preview-17-videos-tono-v3-20260908.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar Deploy Preview 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          NODE_PATH=/tmp/pw/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          async function clickFirstVisible(page, selector, label){
            const loc=page.locator(selector);
            const n=await loc.count();
            for(let i=0;i<n;i++){
              const el=loc.nth(i);
              if(await el.isVisible()){
                await el.click();
                return true;
              }
            }
            throw new Error(label+' visible button not found');
          }
          (async()=>{
            const base='https://deploy-preview-17--irisgreen-home.netlify.app';
            const forbidden=['pauta general','no una pauta','lo que a ella le funcionó','no es lo que hay que hacer','convertir su caso','general rule','not a set of instructions','what worked for them','not what you have to do','turning his case','no de cómo se implanta','not about how a system is introduced','no se promete ninguna cura','does not promise a cure','profesional clínico','clinical professional','no cómo se diagnostica','not how ADHD is diagnosed','ruta clínica','clinical route','explicación clínica','clinical explanation','explicação clínica','servicio de mentoría','mentoría de pago','servicio de pago','vive de acompañar','acompaña desde','accompanying other people','keep you company while you read','acompañando'];
            const required=['Una persona cuenta en primera persona cómo lo vive.','Cuenta su experiencia con el diagnóstico tardío, el autismo y la vida adulta. Habla de identidad','Lleva más de seis décadas comunicándose con CAA. Cuenta cómo la comunicación aumentativa y alternativa forma parte de su vida','Relato en primera persona de un diagnóstico de TDAH ya de adulta. Cuenta cómo lo vive ella, qué empieza a encajar','Convive con el TOC desde los dieciséis años y habla del pensamiento mágico desde la experiencia vivida.','A person speaks in the first person about how they experience it.','He talks about identity, understanding yourself better','He talks about how augmentative and alternative communication is part of his life','what starts to make sense, and how the way she sees herself changes','She has lived with OCD since she was sixteen and speaks about magical thinking from lived experience.'];
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1536,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base+'/es/videos/',{waitUntil:'networkidle'});
            const html=await page.content();
            const body=await page.locator('body').innerText();
            const all=body+'\n'+html;
            for(const term of forbidden){ if(all.toLowerCase().includes(term.toLowerCase())) throw new Error('forbidden: '+term); }
            for(const text of required){ if(!all.includes(text)) throw new Error('missing: '+text); }
            const enBtn=page.getByRole('button',{name:/^EN$/}).first();
            if(await enBtn.count()){
              await enBtn.click(); await page.waitForTimeout(500);
              const visible=await page.locator('body').innerText();
              if(!visible.includes('How to read this video')) throw new Error('EN label not visible');
              for(const term of forbidden){ if(visible.toLowerCase().includes(term.toLowerCase())) throw new Error('forbidden visible EN: '+term); }
            }
            await clickFirstVisible(page, '#plBtn, .ig-uh-music', 'music');
            await page.waitForTimeout(400);
            if(!(await page.locator('#ig-music-panel').count()) && !(await page.locator('#pl:not([hidden])').count())) throw new Error('Music does not open');
            await page.keyboard.press('Escape').catch(()=>{});
            await clickFirstVisible(page, '#a11yBtn, .ig-uh-reading', 'reading');
            await page.waitForTimeout(500);
            const page2=await page.locator('body').innerText();
            if(!(await page.locator('#ig-reading-panel').count()) && !(await page.locator('#a11y:not([hidden])').count()) && !page2.includes('Text size') && !page2.includes('Tamaño del texto') && !page2.includes('A−')) throw new Error('Reading does not open');
            if(errors.length) throw new Error('JS errors: '+errors.join(' | '));
            await browser.close();
            console.log('preview-17-videos-tono-v3-ok');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
