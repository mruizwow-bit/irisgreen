name: R51 A9 R04 library verify

on:
  push:
    branches:
      - 'agent9/r51-cloud-library-r04-20260927'
    paths:
      - 'cloud/n04-r38-library/**'
      - '.github/workflows/r51-a9-cloud-library-r04.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r51-a9-r04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: cloud/n04-r38-library/package-lock.json

      - name: Locked install
        working-directory: cloud/n04-r38-library
        run: npm ci --ignore-scripts

      - name: R51 source and registry gates
        working-directory: cloud/n04-r38-library
        run: |
          node --test             tests/r51-source-freeze.test.mjs             tests/r51-source-registry.test.mjs             tests/r51-r04-source-reader.test.mjs

      - name: R51 canonical age taxonomy gate
        working-directory: cloud/n04-r38-library
        run: node --test tests/r51-r04-age-taxonomy.test.mjs

      - name: R51 six-domain editorial build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:editorial
          node --test tests/r51-r04-editorial.test.mjs

      - name: R51 Games build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:games
          node --test tests/r51-r04-games.test.mjs

      - name: R51 Routines build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:routines
          node --test tests/r51-r04-routines.test.mjs

      - name: R51 Interests candidate build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:interests
          node --test tests/r51-r04-interests.test.mjs

      - name: R51 Workshop 25 build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:workshop
          node --test tests/r51-r04-workshop.test.mjs

      - name: R51 Quiet Space editorial build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:quiet-space
          node --test tests/r51-r04-quiet-space.test.mjs

      - name: R51 Home source hold gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:home-gate
          node --test tests/r51-r04-home-gate.test.mjs

      - name: Upload R51 editorial report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-editorial-report
          path: cloud/n04-r38-library/build/r04/editorial-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload R51 Routines report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-routines-report
          path: cloud/n04-r38-library/build/r04/routines-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload R51 Games report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-games-report
          path: cloud/n04-r38-library/build/r04/games-report.json
          if-no-files-found: ignore
          retention-days: 14


      - name: Upload R51 Interests candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-interests-candidate
          path: |
            cloud/n04-r38-library/build/r04/interests-candidate-entities.json
            cloud/n04-r38-library/build/r04/interests-candidate-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 Workshop 25 candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-workshop-25-candidate
          path: |
            cloud/n04-r38-library/build/r04/workshop-25-integrated-entities.json
            cloud/n04-r38-library/build/r04/workshop-25-integrated-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 Quiet Space editorial candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-quiet-space-editorial-candidate
          path: |
            cloud/n04-r38-library/build/r04/quiet-space-editorial-entities.json
            cloud/n04-r38-library/build/r04/quiet-space-editorial-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 Home source hold
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-home-source-hold
          path: cloud/n04-r38-library/build/r04/home-source-hold-report.json
          if-no-files-found: error
          retention-days: 14
