name: Hotfix vídeos quitar descripciones

on:
  push:
    branches:
      - recuperacion-estable-20260908
    paths:
      - .github/workflows/hotfix-videos-quitar-descripciones-20260908.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Quitar descripciones visibles de vídeos
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          p = Path('es/videos/index.html')
          html = p.read_text(encoding='utf-8')
          before = html

          # La usuaria no quiere el bloque descriptivo de cada tarjeta.
          note_block = re.compile(
              r'\n\s*<sc-if value="\{\{ v\.hasNota \}\}"[^>]*>\s*\n'
              r'\s*<p\b[^>]*><strong>\{\{ tHowToRead \}\}</strong>\s*\{\{ v\.nota \}\}</p>\s*\n'
              r'\s*</sc-if>\s*',
              re.S
          )
          html, removed_blocks = note_block.subn('\n', html)
          if removed_blocks != 1:
              raise SystemExit(f'Bloque de nota eliminado {removed_blocks} veces, esperado 1')

          # Aunque ya no se renderiza, evitar que el mapeo siga activando notas.
          html = re.sub(r'\n\s*nota:\s*videoNota\(v\) \|\| \(NOTA_BASE\[L\] \|\| NOTA_BASE\.es\)\[v\.tipo\] \|\| \(NOTA_BASE\[L\] \|\| NOTA_BASE\.es\)\.vivencia,', '\n nota: "",', html, count=1)
          html = re.sub(r'\n\s*hasNota:\s*true,', '\n hasNota: false,', html, count=1)
          html = re.sub(r'\n\s*notaPropia:\s*!!videoNota\(v\),', '\n notaPropia: false,', html, count=1)
          html = re.sub(r'\n\s*notaBg:\s*videoNota\(v\) \? "rgba\(23,57,92,0\.05\)" : "rgba\(111,95,192,0\.07\)",', '\n notaBg: "transparent",', html, count=1)

          # Limpiar las referencias de cabecera/metadatos a "cómo leer cada vídeo" porque ya no existe ese bloque.
          html = html.replace('con tipo de fuente y cómo leer cada vídeo.', 'con filtros por tema y plataforma.')
          html = html.replace('con tipo de fuente y cómo leer cada vídeo.', 'con filtros por tema y plataforma.')

          if html == before:
              raise SystemExit('No hubo cambios en es/videos/index.html')
          if '<strong>{{ tHowToRead }}</strong>' in html:
              raise SystemExit('Sigue existiendo el bloque tHowToRead en plantilla')
          if len(re.findall(r'\bconst\s+thumbURL\s*=', html)) != 1:
              raise SystemExit('thumbURL no está exactamente una vez antes del build')
          p.write_text(html, encoding='utf-8')

          subprocess.run([sys.executable, 'scripts/build_site.py'], check=True)
          dist = Path('dist/es/videos/index.html').read_text(encoding='utf-8')
          if '<strong>{{ tHowToRead }}</strong>' in dist:
              raise SystemExit('Sigue existiendo el bloque tHowToRead en dist')
          if len(re.findall(r'\bconst\s+thumbURL\s*=', dist)) != 1:
              raise SystemExit('thumbURL no está exactamente una vez en dist')
          print('patch-ok')
          PY

          python3 -m http.server 8787 --directory dist >/tmp/irisgreen-http.log 2>&1 &
          echo $! >/tmp/irisgreen-http.pid
          sleep 2
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          NODE_PATH=/tmp/pw/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1536,height:900}});
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('console', msg=>{ if(msg.type()==='error') errors.push(msg.text()); });
            await page.goto('http://127.0.0.1:8787/es/videos/', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(2200);
            let body = await page.locator('body').innerText();
            if(body.includes('Root: Identifier')) throw new Error('Root error visible');
            if(!body.includes('Dan Wilkins') && !body.includes('Ro Vitale')) throw new Error('No aparecen tarjetas');
            for (const term of ['Cómo leer este vídeo','Una persona cuenta en primera persona','Cuenta su experiencia con el diagnóstico tardío','Lleva más de seis décadas comunicándose','Tiene discalculia y cuenta','Diagnosticado de dificultades del lenguaje']) {
              if(body.toLowerCase().includes(term.toLowerCase())) throw new Error('Descripción visible en ES: '+term);
            }
            if(errors.some(e=>/Identifier 'thumbURL' has already been declared|Root: Identifier/.test(e))) throw new Error(errors.join(' | '));
            const enBtn = page.getByRole('button', {name:/^EN$/}).first();
            if(!(await enBtn.count())) throw new Error('No hay botón EN');
            await enBtn.click();
            await page.waitForTimeout(900);
            body = await page.locator('body').innerText();
            if(!body.includes('Reading')) throw new Error('No aparece Reading en EN');
            if(!body.includes('VIDEO LIBRARY')) throw new Error('No cambia a EN');
            for (const term of ['How to read this video','A person speaks in the first person','He shares his experience of late diagnosis','He has communicated with AAC','He has dyscalculia and talks','Diagnosed with language difficulties']) {
              if(body.toLowerCase().includes(term.toLowerCase())) throw new Error('Descripción visible en EN: '+term);
            }
            await browser.close();
            console.log('browser-ok');
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
          kill "$(cat /tmp/irisgreen-http.pid)" || true
          cd "$REPO"

          git restore reports/initial-data-build.json reports/routes/build.json reports/thumbnails/images.json 2>/dev/null || true
          git diff --name-only | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          grep -qx 'es/videos/index.html' /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 1
          git add es/videos/index.html
          git commit -m "Quitar descripciones de Vídeos"
          git push origin main
