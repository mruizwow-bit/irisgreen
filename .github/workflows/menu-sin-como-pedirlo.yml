name: Menú sin Cómo pedirlo
on:
  push:
    branches: ['ajustes/menu-sin-como-pedirlo-20260907']
    paths:
      - '.github/workflows/menu-sin-como-pedirlo.yml'
      - 'scripts/fix_main_nav_help.py'
permissions:
  contents: write
concurrency:
  group: menu-sin-como-pedirlo-irisgreen
  cancel-in-progress: true
jobs:
  corregir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/menu-sin-como-pedirlo-20260907
      - name: Retirar la duplicidad solo del menú principal
        run: python3 scripts/fix_main_nav_help.py
      - name: Generar la salida pública y comprobar rutas
        run: |
          python3 scripts/build_site.py
          python3 scripts/repair_routes.py --check
          python3 scripts/fix_main_nav_help.py --check
      - name: Guardar las páginas corregidas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .
          git diff --cached --quiet || git commit -m 'Eliminar Cómo pedirlo del menú principal'
          git push origin HEAD:ajustes/menu-sin-como-pedirlo-20260907
