name: Medir rendimiento Lighthouse
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Construir salida pública
        run: python3 scripts/build_site.py
      - name: Servir dist
        run: |
          cd dist
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ig-lighthouse-server.log 2>&1 &
          echo $! >/tmp/ig-lighthouse-server.pid
      - name: Medir seis rutas en tres pasadas
        run: |
          mkdir -p /tmp/ig-lighthouse
          routes=(
            "home:/"
            "situaciones:/es/situaciones/"
            "ficha:/es/situaciones/la-ropa-me-molesta/"
            "investigacion:/es/investigacion/"
            "directorio:/es/tramites/directorio/"
            "libros:/es/libros/"
          )
          for pass in 1 2 3; do
            for item in "${routes[@]}"; do
              name="${item%%:*}"
              route="${item#*:}"
              npx --yes lighthouse@13.4.1 "http://127.0.0.1:8765${route}" \
                --chrome-flags="--headless --no-sandbox --disable-gpu" \
                --output=json --output-path="/tmp/ig-lighthouse/${name}-${pass}.json" \
                --only-categories=performance,accessibility,best-practices,seo --quiet
            done
          done
      - name: Resumir mediana y bloquear regresiones CWV de laboratorio
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from statistics import median

          # Techo de no-regresión derivado del baseline de laboratorio actual.
          # Se usa la mediana de tres pasadas para que un runner ruidoso no convierta
          # una sola medición atípica en una regresión falsa. No equivale a afirmar
          # que las rutas actuales sean rápidas: Situaciones, Investigación,
          # Directorio y Libros parten de LCP de laboratorio >4 s.
          LCP_CEILING_MS={
              'home':4000,
              'situaciones':5600,
              'ficha':4000,
              'investigacion':7500,
              'directorio':9000,
              'libros':5600,
          }
          TBT_CEILING_MS=600
          CLS_CEILING=0.1
          ROUTES=tuple(LCP_CEILING_MS)

          def lcp_status(value):
              return 'good' if value<=2500 else 'needs-improvement' if value<=4000 else 'poor'
          def tbt_status(value):
              return 'good' if value<=200 else 'needs-improvement' if value<=600 else 'poor'
          def med(values, digits=0):
              value=median(values)
              return round(value, digits)

          out={}
          failures=[]
          raw={}
          for name in ROUTES:
              runs=[]
              for pass_no in (1,2,3):
                  p=Path(f'/tmp/ig-lighthouse/{name}-{pass_no}.json')
                  data=json.loads(p.read_text())
                  cats=data['categories'];a=data['audits']
                  runs.append({
                    'pass':pass_no,
                    'performance':round(cats['performance']['score']*100),
                    'accessibility':round(cats['accessibility']['score']*100),
                    'best_practices':round(cats['best-practices']['score']*100),
                    'seo':round(cats['seo']['score']*100),
                    'fcp_ms':round(a['first-contentful-paint']['numericValue']),
                    'lcp_ms':round(a['largest-contentful-paint']['numericValue']),
                    'tbt_ms':round(a['total-blocking-time']['numericValue']),
                    'cls':round(a['cumulative-layout-shift']['numericValue'],4),
                    'speed_index_ms':round(a['speed-index']['numericValue']),
                    'transfer_bytes':a.get('total-byte-weight',{}).get('numericValue'),
                  })
              raw[name]=runs
              lcp=med([x['lcp_ms'] for x in runs])
              tbt=med([x['tbt_ms'] for x in runs])
              cls=med([x['cls'] for x in runs],4)
              vals={
                'performance':med([x['performance'] for x in runs]),
                'accessibility':med([x['accessibility'] for x in runs]),
                'best_practices':med([x['best_practices'] for x in runs]),
                'seo':med([x['seo'] for x in runs]),
                'fcp_ms':med([x['fcp_ms'] for x in runs]),
                'lcp_ms':lcp,
                'lcp_status':lcp_status(lcp),
                'lcp_ceiling_ms':LCP_CEILING_MS[name],
                'tbt_ms':tbt,
                'tbt_status':tbt_status(tbt),
                'tbt_ceiling_ms':TBT_CEILING_MS,
                'cls':cls,
                'cls_ceiling':CLS_CEILING,
                'speed_index_ms':med([x['speed_index_ms'] for x in runs]),
                'transfer_bytes':med([x['transfer_bytes'] for x in runs if x['transfer_bytes'] is not None]) if any(x['transfer_bytes'] is not None for x in runs) else None,
              }
              out[name]=vals
              if lcp>LCP_CEILING_MS[name]:
                  failures.append({'route':name,'metric':'median_lcp_ms','value':lcp,'ceiling':LCP_CEILING_MS[name]})
              if tbt>TBT_CEILING_MS:
                  failures.append({'route':name,'metric':'median_tbt_ms','value':tbt,'ceiling':TBT_CEILING_MS})
              if cls>CLS_CEILING:
                  failures.append({'route':name,'metric':'median_cls','value':cls,'ceiling':CLS_CEILING})

          report={
              'measurement':'Median of three Lighthouse laboratory runs; not real-user CrUX/Core Web Vitals data',
              'routes':out,
              'raw_runs':raw,
              'known_poor_lcp':[name for name,vals in out.items() if vals['lcp_status']=='poor'],
              'failures':failures,
              'limits':[
                  'The ceilings are no-regression limits, not performance targets.',
                  'Three passes and the median reduce single-run CI noise; they do not eliminate lab variance.',
                  'Poor LCP routes remain explicit technical debt and are not reclassified as passing CWV.',
                  'TBT is a Lighthouse lab proxy for main-thread blocking; it is not INP.',
              ],
          }
          Path('/tmp/ig-lighthouse/summary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if failures:
              raise SystemExit('Regresión de rendimiento por encima del contrato de laboratorio: '+json.dumps(failures,ensure_ascii=False))
          PY
      - name: Cerrar servidor
        if: always()
        run: kill $(cat /tmp/ig-lighthouse-server.pid) 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lighthouse-baseline
          path: /tmp/ig-lighthouse
          retention-days: 14
