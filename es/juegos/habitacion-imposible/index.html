<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Habitación imposible · Iris Green</title><link rel="stylesheet" href="/assets/habitacion-room1/room.css"><script src="/assets/habitacion-room1/model.js" defer></script><script src="/assets/habitacion-room1/room.js" defer></script></head>
<body><a class="skip" href="#main">Ir al juego</a><main id="main" class="room-shell">
<header><a href="/es/juegos/" class="back" aria-label="Volver a Juegos">← <span>Juegos</span></a><span id="room-count">Sala 1</span><select id="language" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option></select></header>
<h1 id="title">Habitación imposible</h1><p id="goal">Une la entrada con la salida. Prueba una orientación.</p>
<div class="scene" id="scene" data-state="initial">
<svg id="art" viewBox="130 86 296 301" role="img" aria-labelledby="scene-title scene-description"><title id="scene-title">Habitación con la entrada abajo a la izquierda y la salida arriba a la derecha</title><desc id="scene-description">El camino todavía no conecta.</desc><image href="/assets/habitacion-room1/storyboard-approved.png" width="1536" height="1024"/></svg>
<button id="exit" type="button" hidden>Ir a la salida →</button>
</div>
<p id="feedback" role="status" aria-live="polite" aria-atomic="true">Observa la habitación. Elige una orientación para empezar.</p>
<div class="orientations" role="group" aria-label="Orientación de la habitación">
<button type="button" data-orientation="up" aria-pressed="false"><span aria-hidden="true">↑</span><span class="label">Arriba</span><span class="check" aria-hidden="true">✓</span></button>
<button type="button" data-orientation="right" aria-pressed="false"><span aria-hidden="true">→</span><span class="label">Derecha</span><span class="check" aria-hidden="true">✓</span></button>
<button type="button" data-orientation="down" aria-pressed="false"><span aria-hidden="true">↓</span><span class="label">Abajo</span><span class="check" aria-hidden="true">✓</span></button>
<button type="button" data-orientation="left" aria-pressed="false"><span aria-hidden="true">←</span><span class="label">Izquierda</span><span class="check" aria-hidden="true">✓</span></button>
</div>
<div id="completion"></div><footer><button id="restart" type="button">Volver a empezar</button><label><span id="motion-label">Movimiento</span> <select id="motion"><option value="normal">Normal</option><option value="reduced">Reducido</option><option value="none">Sin movimiento</option></select></label></footer>
<noscript><p>Activa JavaScript para elegir la orientación y jugar.</p></noscript>
</main></body></html>
