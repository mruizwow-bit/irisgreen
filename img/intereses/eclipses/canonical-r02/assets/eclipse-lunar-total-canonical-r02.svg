<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="lunar-total-r02-title lunar-total-r02-desc">
<title id="lunar-total-r02-title">Total lunar eclipse generic geometry and observed-disk inset</title>
<desc id="lunar-total-r02-desc">Educational representation with two linked views. Side view: Earth is between the Sun and Moon and the Moon is inside Earth's umbra. Inset: the Moon is shown with generic copper coloration. The exact color varies and this is not event-specific.</desc>
<defs>
 <radialGradient id="sun" cx="48%" cy="45%" r="55%"><stop offset="0%" stop-color="#fffce5"/><stop offset="64%" stop-color="#ffe27a"/><stop offset="100%" stop-color="#eeb13a"/></radialGradient>
 <radialGradient id="earth" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#75addc"/><stop offset="72%" stop-color="#346d9e"/><stop offset="100%" stop-color="#183e62"/></radialGradient>
 <radialGradient id="moon" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#deded9"/><stop offset="78%" stop-color="#9d9e9b"/><stop offset="100%" stop-color="#70716f"/></radialGradient>
 <radialGradient id="copper" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#df9774"/><stop offset="72%" stop-color="#b25b43"/><stop offset="100%" stop-color="#713128"/></radialGradient>
 </defs>

<circle cx="245" cy="500" r="112" fill="url(#sun)"/>
<path d="M357 412 L1340 445 L1340 555 L357 588 Z" fill="#8397ad" opacity=".15"/>
<path d="M900 450 L1390 482 L1390 518 L900 550 Z" fill="#030812" opacity=".72"/>
<circle cx="820" cy="500" r="88" fill="url(#earth)"/><circle cx="820" cy="500" r="94" fill="none" stroke="#7fc2ee" stroke-width="4" opacity=".6"/>
<circle cx="1332" cy="500" r="48" fill="url(#copper)"/>
<g transform="translate(1380 175)"><circle r="62" fill="url(#copper)"/><circle r="68" fill="none" stroke="#dba084" stroke-width="2" opacity=".32"/></g>

</svg>