name: Metodología ES EN
on:
  push:
    branches: ['ajustes/metodologia-en-20260907']
    paths:
      - '.github/workflows/metodologia-bilingue.yml'
      - 'scripts/build_methodology_bilingual.py'
      - 'scripts/test_methodology_bilingual.py'
permissions:
  contents: write
concurrency:
  group: metodologia-bilingue-irisgreen
  cancel-in-progress: true
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/metodologia-en-20260907
      - name: Crear pareja ES EN sin reescribir el contenido español
        run: python3 scripts/build_methodology_bilingual.py
      - name: Generar exactamente la salida pública
        run: |
          python3 scripts/build_site.py
          python3 scripts/repair_routes.py --check
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-methodology
          /tmp/ig-methodology/bin/pip -q install playwright==1.55.0
          /tmp/ig-methodology/bin/python -m playwright install --with-deps chromium >/tmp/ig-methodology-browser.log 2>&1
      - name: Probar navegación, fidelidad y accesibilidad ES EN
        run: /tmp/ig-methodology/bin/python scripts/test_methodology_bilingual.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metodologia-bilingue-resultados
          path: reports/languages/methodology-bilingual.json
          retention-days: 7
      - name: Guardar solo las dos páginas validadas
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- es/metodologia/index.html en/methodology/index.html
          git diff --cached --quiet || git commit -m 'Completar Metodología en inglés'
          git push origin HEAD:ajustes/metodologia-en-20260907
