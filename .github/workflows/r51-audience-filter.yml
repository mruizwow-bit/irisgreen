name: R51 Canonical age filter QA
on:
  push:
    branches: ['agent2/sabik-iris-r08-20260924']
    paths:
      - 'assets/ig-audience.js'
      - 'assets/ig-audience.css'
      - 'assets/ig-age-gate-r51.css'
      - 'assets/buscador-comun.js'
      - 'assets/safety/age-classification-r51-*.json'
      - 'sabik/retrieval-panel.js'
      - 'sabik/iris-mount.mjs'
      - 'scripts/apply_r51_audience_discovery.py'
      - 'scripts/test_r51_audience_discovery.py'
      - 'scripts/test_r51_audience_filter_browser.py'
      - 'scripts/build_site.py'
      - '.github/workflows/r51-audience-filter.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  canonical-age-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: node --check assets/ig-audience.js
      - run: node --check assets/buscador-comun.js
      - run: node --check sabik/retrieval-panel.js
      - run: node --check sabik/iris-mount.mjs
      - run: python -m py_compile scripts/apply_r51_audience_discovery.py scripts/test_r51_audience_discovery.py scripts/test_r51_audience_filter_browser.py
      - run: |
          python -m venv /tmp/ig-r51
          /tmp/ig-r51/bin/pip -q install playwright==1.55.0
          /tmp/ig-r51/bin/python -m playwright install --with-deps chromium >/tmp/ig-r51-install.log 2>&1
      - run: python scripts/build_site.py
      - run: python scripts/test_r51_age_965.py
      - run: python scripts/test_r51_audience_discovery.py --root dist
      - run: |
          python -m http.server 4173 --directory dist >/tmp/ig-r51-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 1
          /tmp/ig-r51/bin/python scripts/test_r51_audience_filter_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r51-canonical-age-filter-qa
          path: reports/r51-audience-filter
          retention-days: 14
