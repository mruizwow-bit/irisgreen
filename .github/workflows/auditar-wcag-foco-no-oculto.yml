name: Auditar WCAG foco no oculto
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foco-no-oculto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-focus-obscured
          /tmp/ig-focus-obscured/bin/pip -q install playwright==1.55.0
          /tmp/ig-focus-obscured/bin/python -m playwright install --with-deps chromium >/tmp/ig-focus-obscured-install.log 2>&1
      - name: Construir salida pública
        run: python3 scripts/build_site.py
      - name: Recorrer foco por teclado
        run: |
          cd dist
          /tmp/ig-focus-obscured/bin/python ../scripts/audit_focus_not_obscured.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wcag-focus-not-obscured
          path: dist/reports/wcag-focus-not-obscured
          retention-days: 14
