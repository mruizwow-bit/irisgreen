name: Juegos en sala S0 · runtime split
on:
  push:
    branches: [main, motor/room-games-s0-runtime-20261002]
    paths:
      - 'assets/data/juegos/**'
      - 'assets/juegos-sala-s0.js'
      - 'assets/juegos-sala-s0.css'
      - 'assets/juegos-iris.js'
      - 'es/recursos/juegos/sala/**'
      - 'en/resources/games/room/**'
      - 'scripts/test_room_games_s0.py'
      - '.github/workflows/room-games-s0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-games-s0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Build canónico
        run: python scripts/build_site.py
      - name: Gate runtime y red S0
        run: python scripts/test_room_games_s0.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: room-games-s0-evidence
          path: reports/room-games-s0/runtime-network.json
          retention-days: 14
