name: Cuestionarios ES EN
on:
  push:
    branches: ['ajustes/cuestionarios-en-20260907']
    paths:
      - '.github/workflows/cuestionarios-en.yml'
      - 'scripts/translate_questionnaires_en.py'
      - 'scripts/test_questionnaires_en.py'
permissions:
  contents: write
concurrency:
  group: cuestionarios-en-irisgreen
  cancel-in-progress: true
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/cuestionarios-en-20260907
      - name: Aplicar traducción sobre la fuente actual
        run: python3 scripts/translate_questionnaires_en.py
      - name: Generar exactamente la salida pública
        run: |
          python3 scripts/build_site.py
          python3 scripts/repair_routes.py --check
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-questionnaires
          /tmp/ig-questionnaires/bin/pip -q install playwright==1.55.0
          /tmp/ig-questionnaires/bin/python -m playwright install --with-deps chromium >/tmp/ig-questionnaires-browser.log 2>&1
      - name: Probar ES EN en navegador
        run: /tmp/ig-questionnaires/bin/python scripts/test_questionnaires_en.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cuestionarios-en-resultados
          path: reports/languages/questionnaires-en.json
          retention-days: 7
      - name: Guardar solo la página probada
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- es/cuestionarios/index.html
          git diff --cached --quiet || git commit -m 'Completar Cuestionarios en inglés'
          git push origin HEAD:ajustes/cuestionarios-en-20260907
