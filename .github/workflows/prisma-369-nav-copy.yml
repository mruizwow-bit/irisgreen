name: Prisma · #369 P20 P21 P22 P24 P25 P34 navigation copy
on:
  push:
    branches: ['prisma/369-nav-copy-p20-p21-p22-p24-p25-p34-*']
    paths:
      - 'scripts/apply_r69_global_cleanup.py'
      - 'es/neurodiversidad/condiciones/index.html'
      - 'en/neurodiversity/conditions/index.html'
      - 'es/situaciones/index.html'
      - 'en/situations/index.html'
      - 'scripts/test_prisma_369_nav_copy.py'
      - '.github/workflows/prisma-369-nav-copy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile scripts/apply_r69_global_cleanup.py scripts/test_prisma_369_nav_copy.py
      - name: Build canónico
        run: python scripts/build_site.py
      - name: QA #369 P20 P21 P22 P24 P25 P34
        run: python scripts/test_prisma_369_nav_copy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prisma-369-nav-copy
          path: reports/prisma-369-nav-copy/
          retention-days: 14
