name: Aplicar migración de idioma local
on:
  push:
    branches: ['fix/idioma-local-20260908']
    paths: ['.github/workflows/aplicar-migracion-idioma-local.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idioma-local-20260908
      - name: Insertar migración temprana
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/preferencias-lectura.js')
          s=p.read_text(encoding='utf-8')
          old="  'use strict';\n  if (window.IGPreferences) return;"
          new="""  'use strict';
  /* Las rutas /es/ mandan sobre una preferencia de idioma heredada. Durante
     la regresión de septiembre de 2026, entrar en /en/ empezó a escribir
     ig_lang globalmente y varias páginas /es/ lo reutilizaban al montar.
     Se limpia antes de que esos componentes lean localStorage. Los botones
     de idioma de la página siguen pudiendo cambiar su estado durante la visita. */
  if (/^\\/es(?:\\/|$)/.test(window.location.pathname)) {
    try { window.localStorage.removeItem('ig_lang'); } catch (_) {}
  }
  if (window.IGPreferences) return;"""
          if old not in s:
              raise SystemExit('No se encontró el punto de inserción esperado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/preferencias-lectura.js
          git commit -m 'Hacer que las rutas españolas ignoren el idioma global heredado'
          git push origin HEAD:fix/idioma-local-20260908
