name: R52 A3 New Sabik + R37 Motion
on:
  push:
    branches: ['agent3/r52-correct-new-sabik-r37-motion-20260928']
  pull_request:
    paths:
      - 'sabik/**'
      - 'scripts/test_sabik_presence_r52.py'
      - 'scripts/test_sabik_presence_r52_browser.py'
      - '.github/workflows/r52-a3-sabik-presence.yml'
      - '.github/workflows/iris-sabik-r08.yml'
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_sabik_presence_r52.py
      - run: node tools/test-sabik-motion-r37.js
      - run: node --check sabik/iris-mount.mjs
      - run: node --check sabik/sabik-web-r01.js
      - run: python scripts/test_sabik_presence_r52_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r52-a3-sabik-temporal-evidence
          path: reports/sabik-r52/
