name: Aplicar Metodología y Lectura EN final v5

on:
  push:
    branches:
      - recuperacion-estable-20260908
    paths:
      - .github/workflows/aplicar-metodologia-lectura-en-final-v5-20260908.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main actual
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Montar probar y dejar rama
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE"
          BRANCH="feat/metodologia-lectura-en-final-20260908"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/metodologia-lectura-en-20260908 --depth=1
          git checkout -B "$BRANCH" origin/main
          git checkout origin/feat/metodologia-lectura-en-20260908 -- en/methodology/index.html en/accessible-reading/index.html es/metodologia/index.html es/lectura-accesible/index.html

          python3 - <<'PY'
          from pathlib import Path
          import json
          sp=Path('scripts/apply_reviewed_entries.py')
          s=sp.read_text(encoding='utf-8')
          old='    assert len(catalog)==len(before)==372\n'
          new='    assert len(catalog)==len(before)\n    assert len(catalog)>=372\n'
          if new not in s:
              if old not in s: raise SystemExit('No encuentro validación rígida de buscador')
              sp.write_text(s.replace(old,new,1),encoding='utf-8')
          repl={
            'en/methodology/index.html':('"item":"https://irisgreen.eu/es/metodologia/"','"item":"https://irisgreen.eu/en/methodology/"'),
            'en/accessible-reading/index.html':('"item":"https://irisgreen.eu/es/lectura-accesible/"','"item":"https://irisgreen.eu/en/accessible-reading/"')
          }
          for file,(a,b) in repl.items():
              p=Path(file); p.write_text(p.read_text(encoding='utf-8').replace(a,b),encoding='utf-8')
          idx=Path('buscador.json')
          data=json.loads(idx.read_text(encoding='utf-8'))
          data=[x for x in data if x.get('u') not in ['/es/metodologia/','/es/lectura-accesible/']]
          data += [
            {'s':'Tema','t':'Metodología','u':'/es/metodologia/','d':'Cómo se comprueba lo que hay aquí, regla por regla, con un ejemplo de la propia web en cada una.','en':{'s':'Topic','t':'Methodology','u':'/en/methodology/','d':'How the information here is checked, rule by rule, with an example from this website for each one.'}},
            {'s':'Tema','t':'Lectura accesible','u':'/es/lectura-accesible/','d':'Cómo utilizar los ajustes de lectura, conservar las preferencias y conocer las comprobaciones y limitaciones de accesibilidad de Iris Green.','en':{'s':'Topic','t':'Accessible reading','u':'/en/accessible-reading/','d':'How to use the reading settings, keep your preferences and understand Iris Green’s accessibility checks and limitations.'}}
          ]
          idx.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          required={
            'es/metodologia/index.html':['/en/methodology/','hreflang="en"'],
            'es/lectura-accesible/index.html':['/en/accessible-reading/','hreflang="en"'],
            'en/methodology/index.html':['<html lang="en">','<h1>Methodology</h1>','Every claim has its document'],
            'en/accessible-reading/index.html':['<html lang="en">','<h1>Accessible reading</h1>','What each button does']
          }
          for file, terms in required.items():
              txt=Path(file).read_text(encoding='utf-8')
              missing=[t for t in terms if t not in txt]
              if missing: raise SystemExit(f'Faltan en {file}: {missing}')
          for file,bads in {'en/methodology/index.html':['Cómo se comprueba lo que hay aquí','profesional sanitaria'],'en/accessible-reading/index.html':['Qué hace cada botón','Tipografía, espaciado y anchura']}.items():
              txt=Path(file).read_text(encoding='utf-8')
              for bad in bads:
                  if bad in txt: raise SystemExit(f'Texto español residual en {file}: {bad}')
          PY

          python3 scripts/build_site.py
          python3 - <<'PY'
          from pathlib import Path
          for url in ['https://irisgreen.eu/en/methodology/','https://irisgreen.eu/en/accessible-reading/']:
              if url not in Path('sitemap.xml').read_text(encoding='utf-8'): raise SystemExit('Falta sitemap '+url)
          for url in ['/en/methodology/','/en/accessible-reading/']:
              if url not in Path('buscador.json').read_text(encoding='utf-8'): raise SystemExit('Falta buscador '+url)
              if url not in Path('dist/buscador.json').read_text(encoding='utf-8'): raise SystemExit('Falta dist buscador '+url)
          for file in ['dist/en/methodology/index.html','dist/en/accessible-reading/index.html','dist/es/metodologia/index.html','dist/es/lectura-accesible/index.html']:
              if not Path(file).exists(): raise SystemExit('Falta dist '+file)
          PY

          python3 -m http.server 8787 --directory dist >/tmp/irisgreen-http.log 2>&1 &
          echo $! >/tmp/irisgreen-http.pid
          sleep 2
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          NODE_PATH=/tmp/pw/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1536,height:900}});
            const errors=[];
            page.on('pageerror', e=>errors.push(String(e)));
            page.on('console', msg=>{ if(msg.type()==='error') errors.push(msg.text()); });
            async function go(path){ errors.length=0; await page.goto('http://127.0.0.1:8787'+path,{waitUntil:'domcontentloaded'}); await page.waitForTimeout(800); const body=await page.locator('body').innerText(); const critical=errors.filter(e=>!/Failed to load resource|favicon/i.test(e)); if(critical.length) throw new Error(path+' JS '+critical.join(' | ')); return body; }
            let body=await go('/es/metodologia/');
            if(!body.includes('Metodología')||!body.includes('EN')) throw new Error('Metodología ES mal');
            await page.locator('nav.langs a[lang="en"]').click(); await page.waitForTimeout(800);
            if(!page.url().includes('/en/methodology/')) throw new Error('Metodología EN ruta mal');
            body=await page.locator('body').innerText();
            if(!body.includes('Methodology')||!body.includes('Every claim has its document')) throw new Error('Metodología EN texto mal');
            if(body.includes('Cómo se comprueba lo que hay aquí')) throw new Error('Metodología EN conserva español');
            body=await go('/es/lectura-accesible/');
            if(!body.includes('Lectura accesible')||!body.includes('EN')) throw new Error('Lectura ES mal');
            await page.locator('nav.langs a[lang="en"]').click(); await page.waitForTimeout(800);
            if(!page.url().includes('/en/accessible-reading/')) throw new Error('Lectura EN ruta mal');
            body=await page.locator('body').innerText();
            if(!body.includes('Accessible reading')||!body.includes('Typography, spacing and width')) throw new Error('Lectura EN texto mal');
            if(body.includes('Qué hace cada botón')||body.includes('Tipografía, espaciado y anchura')) throw new Error('Lectura EN conserva español');
            await browser.close(); console.log('browser-ok');
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
          kill "$(cat /tmp/irisgreen-http.pid)" || true
          cd "$REPO"
          git restore reports/initial-data-build.json reports/routes/build.json reports/thumbnails/images.json reports/study-20260907/applied.json 2>/dev/null || true
          rm -f sitemap-1.xml
          git status --short
          python3 - <<'PY'
          import subprocess, sys
          allowed={'en/methodology/index.html','en/accessible-reading/index.html','es/metodologia/index.html','es/lectura-accesible/index.html','buscador.json','sitemap.xml','scripts/apply_reviewed_entries.py'}
          out=subprocess.check_output(['git','status','--porcelain'],text=True)
          changed={line[3:] for line in out.splitlines() if line.strip()}
          extra=changed-allowed
          must={'en/methodology/index.html','en/accessible-reading/index.html','buscador.json','sitemap.xml','scripts/apply_reviewed_entries.py'}
          missing=must-changed
          if extra: raise SystemExit('Cambios no permitidos: '+repr(sorted(extra)))
          if missing: raise SystemExit('Faltan cambios: '+repr(sorted(missing)))
          PY
          git add en/methodology/index.html en/accessible-reading/index.html es/metodologia/index.html es/lectura-accesible/index.html buscador.json sitemap.xml scripts/apply_reviewed_entries.py
          git commit -m "Crear EN de Metodología y Lectura accesible"
          git push -u origin "$BRANCH" --force-with-lease
