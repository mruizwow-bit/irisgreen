name: Recursos actuales ES y EN
on:
  workflow_dispatch:
  push:
    branches: ['agent2/retirada-legacy-20260924']
  pull_request:
    paths:
      - 'es/recursos/**'
      - 'en/resources/**'
      - 'assets/*rutinas*'
      - 'assets/*juegos*'
      - 'scripts/test_resources_current.py'
      - 'scripts/retired_game_routes.json'
      - '.github/workflows/juegos-tanda.yml'
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0 beautifulsoup4==4.13.4 pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py
      - run: python scripts/test_resources_current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursos-es-en-evidencia
          path: reports/resources-current/
