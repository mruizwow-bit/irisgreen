name: Nexo R44 Suite5 token QA v5
on:
  push:
    branches: ['nexo/r44-suite5-reconciled-20261002']
    paths: ['.github/workflows/nexo-suite5-token-qa-v5.yml']

permissions:
  contents: write

jobs:
  suite5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_MAIN_SHA: 28e60f0a57876c607a60fb902d3f4421b8cba7ca
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nexo/r44-suite5-reconciled-20261002
          fetch-depth: 0

      - name: Verify pinned base is in branch history
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_MAIN_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_MAIN_SHA" HEAD
          echo "branch=$(git rev-parse HEAD)"
          echo "pinned_main=$BASE_MAIN_SHA"

      - name: Revalidate exact path guard on clean main worktree
        run: |
          set -euo pipefail
          HOSTS=(
            es/taller/pixel-art/index.html en/workshop/pixel-art/index.html
            es/taller/escritura-restricciones/index.html en/workshop/constraint-writing/index.html
            es/taller/juegos-de-mesa/index.html en/workshop/board-games/index.html
            es/taller/ritmo/index.html en/workshop/rhythm-sequencer/index.html
            es/taller/videojuegos/index.html en/workshop/video-game-design/index.html
          )

          git worktree add --detach /tmp/suite5-base "$BASE_MAIN_SHA"
          cp scripts/build_taller_suite5.py /tmp/suite5-base/scripts/build_taller_suite5.py
          cp test_suite5.sh /tmp/suite5-base/test_suite5.sh

          (
            cd /tmp/suite5-base
            bash test_suite5.sh
          )

          for f in "${HOSTS[@]}"; do
            cmp "/tmp/suite5-base/$f" "$GITHUB_WORKSPACE/$f"
          done
          echo "10/10 generated hosts match committed Suite5 hosts byte-for-byte"

          (
            cd /tmp/suite5-base
            git reset --hard "$BASE_MAIN_SHA"
            git clean -fd
          )
          cp scripts/build_taller_suite5.py /tmp/suite5-base/scripts/build_taller_suite5.py
          cp test_suite5.sh /tmp/suite5-base/test_suite5.sh

          set +e
          (
            cd /tmp/suite5-base
            SUITE5_MUTATION_F=1 bash test_suite5.sh
          ) >/tmp/mutation-f.log 2>&1
          rc=$?
          set -e
          cat /tmp/mutation-f.log
          test "$rc" -eq 1
          grep -q "ruta-extra/index.html" /tmp/mutation-f.log
          git worktree remove --force /tmp/suite5-base

      - name: Canonical build
        run: python3 scripts/build_site.py

      - name: Prepare Playwright
        run: |
          python3 -m venv /tmp/suite5-qa
          /tmp/suite5-qa/bin/pip -q install playwright==1.55.0
          /tmp/suite5-qa/bin/python -m playwright install --with-deps chromium >/tmp/suite5-browser-install.log 2>&1

      - name: Serve dist
        run: |
          cd dist
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/suite5-http.log 2>&1 &
          echo $! >/tmp/suite5-http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/es/taller/pixel-art/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: LIGHT NAVY token consumption browser QA
        run: |
          set -euo pipefail
          /tmp/suite5-qa/bin/python scripts/test_taller_suite5_runtime_browser.py | tee /tmp/suite5-token-qa.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r44-suite5-token-consumption-qa-v5
          path: |
            reports/r44-suite5-token-qa
            /tmp/suite5-token-qa.log
            /tmp/mutation-f.log
            /tmp/suite5-http.log
          retention-days: 14

      - name: Remove temporary QA harnesses
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm             .github/workflows/nexo-suite5-token-qa-v4.yml             .github/workflows/nexo-suite5-token-qa-v5.yml             scripts/test_taller_suite5_runtime_browser.py
          git commit -m 'R44 SUITE5: remove token QA harnesses after true PASS'
          git push origin HEAD:nexo/r44-suite5-reconciled-20261002
