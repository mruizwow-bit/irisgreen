name: Publicar Iris Green en producción

on:
  workflow_dispatch:
    inputs:
      confirm_reopen:
        description: 'Escribe MARIA_EXPLICIT_REOPEN para autorizar la reapertura pública'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm_reopen == 'MARIA_EXPLICIT_REOPEN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar autorización explícita
        run: |
          test "${{ github.event.inputs.confirm_reopen }}" = "MARIA_EXPLICIT_REOPEN"

      - name: Construir producto canónico
        run: python3 scripts/build_site.py

      - name: Publicar producto completo y bloquear deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          SITE_ID: 40042464-343c-4587-b6b7-f6159836e291
        run: |
          set -euo pipefail
          TOKEN="${NETLIFY_AUTH_TOKEN:-${NETLIFY_TOKEN:-$NETLIFY_ACCESS_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No hay token de Netlify configurado"
            exit 1
          fi

          latest_published() {
            curl -fsSL \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?production=true&latest-published=true&per_page=1" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"] if d else "")'
          }

          OLD_ID="$(latest_published)"
          if [ -n "$OLD_ID" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$OLD_ID/unlock" >/tmp/netlify-unlock.json
          fi

          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$SITE_ID" \
            --auth="$TOKEN" \
            --message="Iris Green explicit reopen ${GITHUB_SHA}"

          NEW_ID="$(latest_published)"
          if [ -z "$NEW_ID" ]; then
            echo "::error::No se pudo localizar el nuevo deploy publicado"
            exit 1
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$NEW_ID/lock" >/tmp/netlify-lock.json

          echo "Producción completa publicada por autorización explícita. Deploy: $NEW_ID"
