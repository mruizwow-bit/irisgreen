name: Probar fix de idioma local
on:
  push:
    branches:
      - recuperacion-estable-20260908
    paths:
      - .github/workflows/probar-fix-idioma-local.yml
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idioma-local-20260908
      - name: Preparar Chromium y web local
        run: |
          python3 -m venv /tmp/ig-local
          /tmp/ig-local/bin/pip -q install playwright==1.55.0
          /tmp/ig-local/bin/python -m playwright install --with-deps chromium >/tmp/ig-local.log 2>&1
          python3 scripts/build_site.py
          cd dist
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ig-http-local.log 2>&1 &
      - name: Comprobar idioma heredado y Música
        run: |
          /tmp/ig-local/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          base='http://127.0.0.1:8000'
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':1280,'height':900})
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto(base+'/',wait_until='domcontentloaded')
              page.evaluate("localStorage.setItem('ig_lang','en')")
              page.goto(base+'/es/investigacion/',wait_until='domcontentloaded')
              page.wait_for_timeout(1200)
              assert (page.locator('html').get_attribute('lang') or '').startswith('es')
              assert 'Research' not in ' '.join(page.locator('header').all_inner_texts())
              assert page.evaluate("localStorage.getItem('ig_lang')") in (None,'es')
              page.goto(base+'/en/neurodiversity/conditions/',wait_until='domcontentloaded')
              page.wait_for_timeout(600)
              assert (page.locator('html').get_attribute('lang') or '').startswith('en')
              for route in ['/', '/es/neurodiversidad/condiciones/']:
                  req=[]
                  page.on('request',lambda r: req.append(r.url) if '/audio/' in r.url else None)
                  page.goto(base+route,wait_until='domcontentloaded')
                  page.wait_for_timeout(900)
                  t=page.locator('.ig-uh-music,#plBtn,[data-ig-music]').first
                  assert t.count()
                  t.click(); page.wait_for_timeout(250)
                  panel=page.locator('#ig-music-panel')
                  assert panel.count() and panel.is_visible()
              assert not errors, errors
              b.close()
          PY
