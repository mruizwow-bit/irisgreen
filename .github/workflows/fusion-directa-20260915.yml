name: Fusion directa final 20260915

on:
  push:
    branches:
      - release/fusion-directa-20260915

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout direct payload
        uses: actions/checkout@v4
        with:
          ref: release/fusion-directa-20260915
          path: direct

      - name: Checkout prepared payload
        uses: actions/checkout@v4
        with:
          ref: release/aplicar-fusion-final-20260915
          path: payload

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Apply package source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/release-source/nonpub-*.txt | base64 -d > /tmp/nonpublic.tar.xz
          echo "807083d3d67d82edfc0d6df386081774650961b75b7e268397e5aa486f240078  /tmp/nonpublic.tar.xz" | sha256sum -c -
          tar -xJf /tmp/nonpublic.tar.xz -C repo
          cd repo
          python3 scripts/promote_daily_48_final.py

      - name: Restore package scripts
        shell: bash
        run: |
          set -euo pipefail
          cat direct/release-source/direct/build-*.txt > repo/scripts/build_site.py
          cat direct/release-source/direct/connect-*.txt > repo/scripts/connect_tarjetas_iris.py
          cat direct/release-source/direct/finalize-*.txt > repo/scripts/finalize_tarjetas_iris_v2_core.py

      - name: Sync final public files from production
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          while read -r expected path; do
            [ -n "$path" ] || continue
            case "$path" in
              scripts/*|editorial/*|netlify.toml|_redirects|es/biblioteca/*) continue ;;
              es/*|en/*|assets/*|img/*)
                mkdir -p "$(dirname "$path")"
                curl --fail --location --silent --show-error \
                  -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                  "https://irisgreen.eu/$path?main-sync=20260915-final3" -o "$path"
                ;;
            esac
          done < ../payload/release-source/blob-manifest-final.txt
          rm -f assets/maintenance.html assets/muestras/luma/p01.avif MAINTENANCE_ACTIVE.txt

      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          if grep -q '^\[context\.production\]' netlify.toml; then
            echo 'ERROR: mantenimiento de producción sigue activo'
            exit 1
          fi
          grep -q 'python3 scripts/build_site.py' netlify.toml
          node --check assets/tarjeta-iris.js
          node --check assets/recursos-idioma.js
          node --check assets/rutinas-visuales.js
          python3 -m py_compile scripts/build_site.py scripts/connect_tarjetas_iris.py scripts/connect_tarjetas_iris_en.py scripts/finalize_tarjetas_iris_v2_core.py
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          required=[
              root/'es/recursos/index.html',
              root/'es/recursos/tarjeta-iris/index.html',
              root/'es/tarjetas-iris/index.html',
              root/'assets/tarjeta-iris.js',
              root/'assets/recursos-idioma.js',
          ]
          missing=[str(p) for p in required if not p.is_file() or p.stat().st_size == 0]
          assert not missing, ('Faltan archivos finales', missing)
          total=bad=0
          for name in ('tarjetas-necesito-vida-diaria.json','tarjetas-necesito-condiciones.json','tarjetas-necesito-situaciones.json'):
              data=json.loads((root/'editorial'/name).read_text(encoding='utf-8'))
              for key,value in data.items():
                  if key.startswith('_'):
                      continue
                  total+=1
                  es=(value or {}).get('es','')
                  en=(value or {}).get('en','')
                  bad += bool(re.search(r'\bnecesito\b',es,re.I) or re.search(r'\bI need\b',en,re.I))
          assert total==415 and bad==0,(total,bad)
          print('OK: archivos finales presentes; tarjetas editoriales=',total,'repeticiones=',bad)
          PY

      - name: Commit final version to main
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name "Iris Green release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publicar Tarjeta Iris, Recursos y apoyos finales"
          git push origin HEAD:main
