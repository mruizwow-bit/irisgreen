name: Diagnostico home musica y buscador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-home-musica-buscador.yml'

permissions:
  contents: read

jobs:
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-home
          /tmp/ig-home/bin/pip -q install playwright==1.55.0
          /tmp/ig-home/bin/python -m playwright install --with-deps chromium >/tmp/ig-browser-install.log 2>&1
      - name: Probar producción real
        run: |
          /tmp/ig-home/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          BASE='https://irisgreen.eu'
          paths=['/','/es/investigacion/']
          with sync_playwright() as pw:
              b=pw.chromium.launch()
              for path in paths:
                  p=b.new_page(viewport={'width':1440,'height':1000})
                  errors=[]; audio=[]; responses=[]
                  p.on('pageerror',lambda e: errors.append(str(e)))
                  p.on('request',lambda r: audio.append(r.url) if r.url.lower().split('?')[0].endswith(('.mp3','.m4a')) else None)
                  p.on('response',lambda r: responses.append((r.url,r.status)) if r.url.lower().split('?')[0].endswith(('.mp3','.m4a')) else None)
                  r=p.goto(BASE+path,wait_until='domcontentloaded'); print('PAGE',path,'HTTP',r.status if r else None)
                  p.locator('main h1').first.wait_for(state='visible',timeout=15000)
                  p.wait_for_timeout(700)
                  music=p.locator('.ig-uh-music:visible,#plBtn:visible,[data-ig-music]:visible').first
                  assert music.count(), 'sin boton de musica '+path
                  music.click()
                  panel=p.locator('#ig-music-panel'); panel.wait_for(state='visible',timeout=5000)
                  print('MUSIC_OPEN',path,True,panel.inner_text()[:180].replace('\n',' | '))
                  play=panel.locator('.ig-m-play')
                  play.click(); p.wait_for_timeout(1800)
                  print('AUDIO_REQUESTS',path,audio[:3])
                  print('AUDIO_RESPONSES',path,responses[:3])
                  print('STATUS_TEXT',path,panel.locator('.ig-m-status').inner_text())
                  assert audio, 'no se solicito audio '+path
                  assert any(s in (200,206) for _,s in responses), 'audio sin respuesta valida '+repr(responses[:3])
                  assert not panel.locator('.ig-m-status').inner_text().strip(), 'reproductor muestra error '+panel.locator('.ig-m-status').inner_text()
                  print('PAGEERRORS',path,errors)
                  p.close()
              p=b.new_page(viewport={'width':1440,'height':1000})
              errors=[];p.on('pageerror',lambda e: errors.append(str(e)))
              p.goto(BASE+'/',wait_until='domcontentloaded');p.locator('main h1').first.wait_for(state='visible');p.wait_for_timeout(500)
              p.locator('.ig-uh-langs button:has-text("EN")').first.click();p.wait_for_timeout(250)
              assert p.locator('html').get_attribute('lang')=='en'
              inp=p.locator('.ig-search-input').first
              print('EN_PLACEHOLDER',inp.get_attribute('placeholder'))
              # Estado inicial: todas las tarjetas visibles deben estar localizadas, no solo la interfaz.
              initial=p.eval_on_selector_all('#consola a[href]','els=>els.filter(a=>a.offsetParent!==null).map(a=>({text:a.textContent.trim(),href:a.getAttribute("href")}))')
              print('EN_INITIAL_LINKS',initial[:12])
              inp.fill('noise');p.wait_for_timeout(350)
              vals=p.eval_on_selector_all('#consola a[href]','els=>els.filter(a=>a.offsetParent!==null).map(a=>({text:a.textContent.trim(),href:a.getAttribute("href")}))')
              print('EN_NOISE_LINKS',vals[:12])
              assert vals and all((x['href'] or '').startswith('/en/') for x in vals if x['text']), vals
              spanish_markers=('No aguanto','Me despierto','Todas las fichas','Todas las cifras','Todas las ayudas','Situación','Condición')
              joined=' | '.join(x['text'] for x in vals)
              assert not any(m in joined for m in spanish_markers), joined
              print('HOME_PAGEERRORS',errors)
              b.close()
          PY
