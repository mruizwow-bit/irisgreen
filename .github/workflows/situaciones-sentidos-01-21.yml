            en/situations/noise-is-unbearable-for-them/index.html \
            en/situations/exams-in-a-noisy-classroom-are-unbearable/index.html \
            en/situations/ordinary-sounds-are-painful-for-me/index.html \
            en/situations/specific-sounds-trigger-an-immediate-reaction-in-me/index.html \
            en/situations/white-lights-tire-me-out-very-quickly/index.html \
            en/situations/the-smell-in-some-shops-makes-me-leave/index.html \
            en/situations/i-do-not-notice-i-am-cold-until-i-am-shivering/index.html \
            en/situations/heat-overwhelms-me-sooner-than-it-seems-to-overwhelm-other-people/index.html \
            en/situations/i-need-to-move-in-order-to-concentrate/index.html \
            en/situations/certain-movements-or-escalators-make-me-dizzy/index.html \
            en/situations/crowds-disorient-me-even-when-they-are-not-very-noisy/index.html \
