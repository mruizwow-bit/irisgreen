name: Ejecutar EN Metodologia Lectura v4
on:
  push:
    branches: [recuperacion-estable-20260908]
    paths:
      - '.github/workflows/ejecutar-metodologia-lectura-en-20260908-v4.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts fuente
        uses: actions/checkout@v4
        with:
          ref: recuperacion-estable-20260908
          path: meta
      - name: Extraer traducciones y script v3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          old = Path('meta/.github/workflows/aplicar-metodologia-lectura-en-20260908.yml').read_text(encoding='utf-8')
          start = "cat > /tmp/metodologia_lectura_trans.json <<'JSON_TRANSLATIONS'\n"
          end = '\nJSON_TRANSLATIONS'
          i = old.index(start) + len(start)
          j = old.index(end, i)
          data = old[i:j].lstrip('\n').rstrip('\n') + '\n'
          records = json.loads(data)
          assert len(records) == 83, len(records)
          Path('/tmp/metodologia_lectura_trans.json').write_text(data, encoding='utf-8')
          v3 = Path('meta/.github/workflows/ejecutar-metodologia-lectura-en-20260908-v3.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          starts = [m.end() for m in re.finditer(re.escape(marker), v3)]
          if len(starts) < 2:
              raise SystemExit('No encuentro el script de montaje en v3')
          a = starts[1]
          b = v3.index('\n          PY\n      - name: Prueba local en navegador', a)
          block = v3[a:b]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/apply_metodologia_lectura_v3.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('traducciones', len(records), 'script-v3-extraido')
          PY
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: site
      - name: Aplicar y probar build
        shell: bash
        run: |
          set -euo pipefail
          cd site
          BR="feat/metodologia-lectura-en-20260908"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR" origin/main
          python3 /tmp/apply_metodologia_lectura_v3.py
          git restore reports/initial-data-build.json reports/routes/build.json 2>/dev/null || true
      - name: Prueba local en navegador
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE/site/dist"
          python3 -m http.server 4173 >/tmp/irisgreen-metodologia-lectura.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='http://127.0.0.1:4173';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1536,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            async function checkPage(path, expected, forbidden){
              await page.goto(base+path,{waitUntil:'networkidle'});
              const langs=await page.locator('.langs .lang').allInnerTexts();
              if(langs.join(' · ')!=='ES · EN') throw new Error(path+' selector: '+langs.join(' · '));
              const txt=await page.locator('main').innerText();
              for(const s of expected) if(!txt.includes(s)) throw new Error(path+' missing '+s);
              for(const s of forbidden) if(txt.includes(s)) throw new Error(path+' still has '+s);
              const enBox=await page.locator('.langs .lang').filter({hasText:'EN'}).first().boundingBox();
              if(!enBox || enBox.x<0 || enBox.x>1536) throw new Error(path+' EN not visible');
              await page.locator('#plBtn').click(); await page.waitForTimeout(300);
              const musicOk=await page.locator('#ig-music-panel').count() || await page.locator('#pl:not([hidden])').count();
              if(!musicOk) throw new Error(path+' music does not open');
              await page.keyboard.press('Escape').catch(()=>{});
              await page.locator('#a11yBtn').click(); await page.waitForTimeout(300);
              const readingOk=await page.locator('#ig-reading-panel').count() || await page.locator('#a11y:not([hidden])').count();
              if(!readingOk) throw new Error(path+' reading does not open');
              await page.keyboard.press('Escape').catch(()=>{});
            }
            await checkPage('/en/methodology/',['Methodology','Iris Green is not a healthcare professional','NICE guideline NG69','Who writes this','write to informacion@irisgreen.eu'],['Cómo se comprueba lo que hay aquí','Iris Green no es profesional sanitaria','Cada ficha lleva']);
            await checkPage('/en/accessible-reading/',['Accessible reading','What each button does','Typography, spacing and width','Write to informacion@irisgreen.eu','Report a difficulty'],['Qué hace cada botón','Abre Lectura en la cabecera','Escribe a informacion@irisgreen.eu']);
            await page.goto(base+'/es/metodologia/',{waitUntil:'networkidle'});
            if((await page.locator('.langs .lang').allInnerTexts()).join(' · ')!=='ES · EN') throw new Error('ES metodologia selector bad');
            await page.locator('.langs .lang').filter({hasText:'EN'}).click(); await page.waitForLoadState('networkidle');
            if(!page.url().includes('/en/methodology/')) throw new Error('ES metodologia EN link failed: '+page.url());
            await page.goto(base+'/es/lectura-accesible/',{waitUntil:'networkidle'});
            if((await page.locator('.langs .lang').allInnerTexts()).join(' · ')!=='ES · EN') throw new Error('ES lectura selector bad');
            await page.locator('.langs .lang').filter({hasText:'EN'}).click(); await page.waitForLoadState('networkidle');
            if(!page.url().includes('/en/accessible-reading/')) throw new Error('ES lectura EN link failed: '+page.url());
            if(errors.length) throw new Error('JS errors: '+errors.join(' | '));
            await browser.close(); console.log('metodologia-lectura-local-browser-ok');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Commit en rama
        shell: bash
        run: |
          set -euo pipefail
          cd site
          BR="feat/metodologia-lectura-en-20260908"
          git restore reports/initial-data-build.json reports/routes/build.json 2>/dev/null || true
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/changed.txt
          cat /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed.txt').read_text().splitlines())
          required={'es/metodologia/index.html','es/lectura-accesible/index.html','en/methodology/index.html','en/accessible-reading/index.html','sitemap.xml','sitemap-1.xml'}
          allowed=required | {'buscador.json'}
          missing=required-changed
          extra=changed-allowed
          if missing or extra:
              raise SystemExit(f'missing={sorted(missing)} extra={sorted(extra)}')
          PY
          git add es/metodologia/index.html es/lectura-accesible/index.html en/methodology/index.html en/accessible-reading/index.html sitemap.xml sitemap-1.xml buscador.json 2>/dev/null || git add es/metodologia/index.html es/lectura-accesible/index.html en/methodology/index.html en/accessible-reading/index.html sitemap.xml sitemap-1.xml
          git commit -m "Crear EN de Metodología y Lectura accesible"
          git push origin "$BR" --force-with-lease
