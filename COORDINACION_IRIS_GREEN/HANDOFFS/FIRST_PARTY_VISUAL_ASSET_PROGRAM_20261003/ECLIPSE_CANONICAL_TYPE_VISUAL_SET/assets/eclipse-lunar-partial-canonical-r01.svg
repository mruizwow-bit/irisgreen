<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="lunar-partial-title lunar-partial-desc">
<title id="lunar-partial-title">Partial lunar eclipse generic geometry</title>
<desc id="lunar-partial-desc">Generic educational representation: the Moon passes partly through Earth's umbra, so only part of the lunar disk is in the darkest shadow.</desc>
<defs>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff8cf"/><stop offset="68%" stop-color="#ffd867"/><stop offset="100%" stop-color="#f0a52e"/></radialGradient>
  <radialGradient id="earth" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#6ea5d7"/><stop offset="75%" stop-color="#2d5f8f"/><stop offset="100%" stop-color="#173c62"/></radialGradient>
  <radialGradient id="moon" cx="38%" cy="32%" r="66%"><stop offset="0%" stop-color="#d7d7d2"/><stop offset="80%" stop-color="#999a98"/><stop offset="100%" stop-color="#727472"/></radialGradient>
  <radialGradient id="copper" cx="38%" cy="32%" r="66%"><stop offset="0%" stop-color="#d98b67"/><stop offset="78%" stop-color="#a34f39"/><stop offset="100%" stop-color="#6f2f29"/></radialGradient>
</defs>

<circle cx="260" cy="500" r="110" fill="url(#sun)"/>
<path d="M350 420 L1280 430 L1280 600 L350 580 Z" fill="#7a8799" opacity=".15"/>
<path d="M880 450 L1370 474 L1370 526 L880 550 Z" fill="#020711" opacity=".72"/>
<circle cx="800" cy="500" r="86" fill="url(#earth)"/><circle cx="800" cy="500" r="92" fill="none" stroke="#76b9e8" stroke-width="4" opacity=".65"/>
<g transform="translate(1315 548)"><circle r="46" fill="url(#moon)"/><path d="M-46 -18 A46 46 0 0 0 37 26 A46 46 0 0 0 -46 -18Z" fill="#5f2d2b" opacity=".82"/></g>

</svg>