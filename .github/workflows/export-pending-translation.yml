name: Export pending support translation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-pending-translation.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build translation document
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('es/tramites/directorio/tramites-datos.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          groups = ['uk', 'br', 'us', 'mundo']
          expected = {'uk': 234, 'br': 148, 'us': 362, 'mundo': 1423}
          actual = {g: len(data.get(g, [])) for g in groups}
          if actual != expected:
              raise SystemExit(f'Unexpected pending counts: {actual}')

          field_rules = {
              'que': 'Traducir al inglés el texto redactado. Conservar sin traducir nombres oficiales de programas, leyes, organismos, siglas y denominaciones que deban permanecer oficiales.',
              'cuantia': 'Traducir al inglés solo la parte redactada. No cambiar importes, cifras, porcentajes, símbolos ni monedas.',
              'quien': 'Traducir al inglés. Conservar nombres oficiales, siglas y denominaciones administrativas cuando corresponda.',
              'docs': 'Traducir al inglés. Conservar nombres oficiales de formularios, modelos, trámites, leyes, organismos y siglas.',
              'obs': 'Traducir al inglés. Conservar nombres oficiales, siglas y referencias administrativas.',
              'tags': 'Traducir como lista de términos de búsqueda separados por comas, no como una frase. Se pueden añadir sinónimos ingleses útiles. Conservar siglas y nombres oficiales.'
          }

          categories = sorted({row.get('cat','') for g in groups for row in data[g] if row.get('cat')})
          regions = sorted({row.get('region','') for row in data['mundo'] if row.get('region')})

          out = {
              '_meta': {
                  'proyecto': 'Iris Green',
                  'seccion': 'Ayudas / Support',
                  'objetivo': 'Traducción al inglés de todo el contenido pendiente del Directorio de ayudas, después de completar España y la interfaz.',
                  'fuente': 'es/tramites/directorio/tramites-datos.json',
                  'estado_ya_traducido': {'interfaz': 51, 'espana_fichas': 258},
                  'grupos_pendientes': actual,
                  'fichas_pendientes_total': sum(actual.values()),
                  'campos_traducibles_por_ficha': list(field_rules),
                  'campos_de_ficha_pendientes_total': sum(actual.values()) * len(field_rules),
                  'regla_titulo': 'No traducir automáticamente name: es el nombre oficial de la ayuda o programa. Solo cambiarlo si se decide expresamente que no es una denominación oficial.',
                  'regla_fuentes': 'No modificar id, country, fuente, org, enlaces ni datos estructurales. Mantener el original y rellenar únicamente las claves *_en y el mapa de categorías.',
                  'formato_de_entrega': 'Devolver este mismo JSON, sin borrar ni reordenar las fichas, rellenando cada clave terminada en _en. No sustituir el texto original.'
              },
              'instrucciones_para_el_chat_traductor': [
                  'Trabaja exclusivamente sobre el contenido de este archivo.',
                  'No corrijas, actualices ni investigues la información: esta tarea es solo de traducción.',
                  'No cambies importes, fechas, porcentajes, monedas, URLs, IDs ni nombres oficiales.',
                  'Usa inglés claro y natural, adecuado para una web informativa y accesible.',
                  'Mantén el sentido y el nivel de precisión del original; no resumas ni añadas información.',
                  'En tags_en escribe términos de búsqueda separados por comas, no una oración.',
                  'Rellena cat_en mediante el mapa categorias_pendientes y úsalo de forma coherente en todas las fichas con la misma categoría.',
                  'Si una denominación oficial ya está en inglés, no la retraduzcas.',
                  'Devuelve el JSON válido y completo, con todas las fichas y todos los campos *_en rellenados.'
              ],
              'criterios_por_campo': field_rules,
              'regiones_visibles_pendientes_de_revisar': [
                  {'texto': r, 'texto_en': ''} for r in regions
              ],
              'categorias_pendientes': [
                  {'texto': c, 'texto_en': ''} for c in categories
              ],
              'fichas': {}
          }

          for g in groups:
              rows = []
              for i, row in enumerate(data[g]):
                  item = {
                      '_grupo': g,
                      '_indice': i,
                      'id': row.get('id'),
                      'name': row.get('name'),
                      'terr': row.get('terr'),
                      'region': row.get('region'),
                      'cat': row.get('cat'),
                      'country': row.get('country'),
                      'nivel': row.get('nivel'),
                      'ambito': row.get('ambito'),
                      'pais': row.get('pais'),
                      'org': row.get('org'),
                      'fuente': row.get('fuente')
                  }
                  for key in field_rules:
                      item[key] = row.get(key, '')
                      item[key + '_en'] = ''
                  rows.append(item)
              out['fichas'][g] = rows

          dest = Path('pendiente_traduccion_ayudas_EN.json')
          dest.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'file': str(dest),
              'counts': actual,
              'total': sum(actual.values()),
              'categories': len(categories),
              'regions': len(regions),
              'bytes': dest.stat().st_size
          }, ensure_ascii=False))
          PY
      - name: Upload translation document
        uses: actions/upload-artifact@v4
        with:
          name: pendiente-traduccion-ayudas-en
          path: pendiente_traduccion_ayudas_EN.json
          if-no-files-found: error
          retention-days: 7
