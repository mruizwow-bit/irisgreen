name: Nexo R44 Suite5 runtime QA
on:
  push:
    branches: ['nexo/r44-suite5-main-20261002']
    paths: ['.github/workflows/nexo-suite5-runtime-qa.yml']
permissions:
  contents: write
jobs:
  runtime-qa:
    if: contains(github.event.head_commit.message, 'RUN_NEXO_SUITE5_RUNTIME_QA')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: nexo/r44-suite5-main-20261002
          fetch-depth: 0
      - name: Prepare Playwright
        run: |
          python3 -m venv /tmp/suite5-qa
          /tmp/suite5-qa/bin/pip -q install playwright==1.55.0
          /tmp/suite5-qa/bin/python -m playwright install --with-deps chromium >/tmp/suite5-browser-install.log 2>&1
      - name: Start local source server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/suite5-http.log 2>&1 &
          echo $! >/tmp/suite5-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/es/taller/pixel-art/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Runtime browser QA
        id: qa
        run: |
          set +e
          /tmp/suite5-qa/bin/python scripts/test_taller_suite5_runtime_browser.py | tee /tmp/suite5-runtime.log
          rc=${PIPESTATUS[0]}
          echo "$rc" >/tmp/suite5-runtime.rc
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r44-suite5-runtime-qa
          path: |
            reports/r44-suite5-runtime
            /tmp/suite5-runtime.log
            /tmp/suite5-http.log
          retention-days: 14
      - name: Remove temporary QA harness
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nexo-suite5-runtime-qa.yml scripts/test_taller_suite5_runtime_browser.py
          git commit -m 'R44 SUITE5: remove temporary runtime QA harness'
          git push origin HEAD:nexo/r44-suite5-main-20261002
      - name: Enforce QA result
        if: always()
        run: test "$(cat /tmp/suite5-runtime.rc)" -eq 0
