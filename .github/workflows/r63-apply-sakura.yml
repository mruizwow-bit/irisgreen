name: R63 apply Sakura handoff to integration branch
on:
  push:
    branches:
      - astra/r63-sakura-a2-integration-20260929
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r63-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R63 handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Astra R63 integration"
          git config user.email "actions@users.noreply.github.com"
          git apply --check --3way --exclude=assets/ig-global-ui-tokens-2026.css .r63-upload/R63_SAKURA.patch
          git apply --3way --index --exclude=assets/ig-global-ui-tokens-2026.css .r63-upload/R63_SAKURA.patch
          git rm -f .r63-upload/R63_SAKURA.patch
          git rm -f .github/workflows/r63-apply-sakura.yml
          git status --short
          git commit -m "R63 Sakura: integrate reviewed handoff [r63-applied]"
          git push origin HEAD
