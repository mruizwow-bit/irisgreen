name: R63 apply Sakura runtime text delta
on:
  push:
    branches:
      - astra/r63-sakura-a2-integration-20260929
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[r63-text-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed R63 runtime text files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Astra R63 integration"
          git config user.email "actions@users.noreply.github.com"
          ARGS=(
            --include='assets/rincon-r46*'
            --include='assets/rincon-r53*'
            --include='assets/rincon-r63-sala-sakura.js'
            --include='es/sitio-tranquilo/index.html'
            --include='en/quiet-space/index.html'
          )
          git apply --check --3way "${ARGS[@]}" .r63-upload/R63_SAKURA.patch
          git apply --3way --index "${ARGS[@]}" .r63-upload/R63_SAKURA.patch
          git rm -f .r63-upload/R63_SAKURA.patch
          git rm -f .github/workflows/r63-apply-sakura.yml
          git status --short
          git commit -m "R63 Sakura: integrate reviewed runtime text delta [r63-text-applied]"
          git push origin HEAD
