name: Datos · corregir residuos EN

on:
  push:
    branches: [feat/en-datos-20260908]
    paths:
      - .github/workflows/datos-patch-residuos-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/en-datos-20260908
          fetch-depth: 0
      - name: Corregir anioDatos visibles y formato de cifras EN
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):[p]})}
          const map = new Map([
            ['revisiones incluidas hasta la publicación','reviews included up to publication'],
            ['estudios incluidos en la revisión publicada en 2023','studies included in the review published in 2023'],
            ['estructura demográfica mundial de 2020','2020 global demographic structure'],
            ['síntesis de estudios; diagnóstico declarado en EE. UU. 2016–2019','synthesis of studies; reported diagnosis in the U.S. 2016–2019'],
            ['muestra de niños al entrar en la escuela','sample of children entering school'],
            ['sin año único: no existe una cifra mundial seleccionada','no single year: no selected global figure exists'],
            ['estudios incluidos en metaanálisis publicado en 2019','studies included in meta-analysis published in 2019'],
            ['estimación mundial vigente','current global estimate'],
            ['estimación base de UNICEF; página activa en 2026','UNICEF baseline estimate; page active in 2026'],
            ['análisis internacional de UNICEF','UNICEF international analysis'],
            ['base 2021–2022; proyección 2050','2021–2022 baseline; 2050 projection'],
            ['múltiples años en 61 países','multiple years in 61 countries'],
            ['submuestra internacional de 30 países','international subsample of 30 countries'],
            ['última serie disponible en la actualización de 2026','latest available series in the 2026 update'],
            ['2021 / 2022 / 2019 / 2022, según la fuente','2021 / 2022 / 2019 / 2022, depending on the source']
          ]);
          function patchText(s){
            for (const [a,b] of map) s = s.split(a).join(b);
            // Formato inglés en cifras visibles: decimal comma before % and space before percent.
            s = s.replace(/(>\s*\d+),(\d{1,2})\s*%/g, '$1.$2%');
            s = s.replace(/(>\s*\d+)\s+%/g, '$1%');
            s = s.replace(/(\b\d+),(\d{1,2})\s*%/g, '$1.$2%');
            s = s.replace(/(\b\d+)\s+%/g, '$1%');
            return s;
          }
          // JSON estructurado inglés
          const jsonPath = 'en/data/data.json';
          let json = fs.readFileSync(jsonPath,'utf8');
          json = patchText(json);
          fs.writeFileSync(jsonPath,json);
          // HTML generados
          for (const fp of walk('en/data').filter(f=>f.endsWith('.html'))) {
            const old = fs.readFileSync(fp,'utf8');
            const neu = patchText(old);
            if (old !== neu) fs.writeFileSync(fp, neu);
          }
          // Reauditoría de campos visibles estructurados
          const dataEn = JSON.parse(fs.readFileSync('en/data/data.json','utf8'));
          const spanishish = /[áéíóúÁÉÍÓÚñÑ¿¡]|\b(estructura|demográfica|mundial|síntesis|científica|publicación|actualización|cada año|cada 2 años|fuente comprobada|decisión editorial|población|personas|niños|mujeres|varones|prevalencia|diagnósticos|trastorno|discapacidad|autistas|datos de|sin proceder|no procede)\b/i;
          const fields = ['anioDatos','territorio','refTemporal','metodo','publicacion','revision','poblacion','poblacionOrigen'];
          const issues=[];
          for (let i=0;i<dataEn.paginas.length;i++) {
            for (const f of fields) {
              const v = dataEn.paginas[i][f];
              if (typeof v === 'string' && v.trim() && spanishish.test(v)) issues.push({page:i,title:dataEn.paginas[i].title,slug:dataEn.paginas[i].slug_en,field:f,value:v});
            }
            (dataEn.paginas[i].cifras||[]).forEach((c,ci)=>{
              ['cifra','pie'].forEach(f=>{ const v=c[f]; if(typeof v==='string' && v.trim() && spanishish.test(v)) issues.push({page:i,title:dataEn.paginas[i].title,slug:dataEn.paginas[i].slug_en,field:`cifras[${ci}].${f}`,value:v}); });
            });
          }
          if (issues.length) { console.log(JSON.stringify(issues,null,2)); throw new Error('Residuos visibles pendientes: '+issues.length); }
          // Limpieza de workflows temporales de esta fase.
          for (const f of ['.github/workflows/datos-auditar-residuos.yml','.github/workflows/datos-patch-residuos-v2.yml']) fs.rmSync(f,{force:true});
          NODE
      - name: Validar build y navegador rápido
        shell: bash
        run: |
          python3 scripts/build_site.py
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 -d dist >/tmp/iris-server.log 2>&1 &
          echo $! > /tmp/iris-server.pid
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const urls=['/en/data/','/en/data/adhd-in-adults/','/en/data/autism/','/en/data/children-with-disabilities/'];
            for(const u of urls){
              const res=await page.goto('http://127.0.0.1:4173'+u,{waitUntil:'networkidle'});
              if(!res||res.status()>=400) throw new Error(`${u} status ${res&&res.status()}`);
              const txt=await page.locator('main').innerText();
              for(const bad of ['estructura demográfica','síntesis de estudios','muestra de niños','estimación mundial','análisis internacional','según la fuente','Página en borrador','Qué mide','Cómo citarla','Qué evitar']){
                if(txt.includes(bad)) throw new Error(`${u} conserva español: ${bad}`);
              }
            }
            await page.goto('http://127.0.0.1:4173/en/data/adhd-in-adults/',{waitUntil:'networkidle'});
            const t=await page.locator('main').innerText();
            if(!t.includes('2020 global demographic structure')) throw new Error('No aparece anioDatos traducido');
            if(t.includes('2,58 %') || t.includes('6,76 %')) throw new Error('Porcentajes sin formato EN');
            await browser.close(); console.log('residuos-browser-ok');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $(cat /tmp/iris-server.pid)
          rm -rf node_modules package.json package-lock.json
      - name: Commit corrección
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m "Corregir residuos de texto en Datos EN" || true
          git push origin HEAD:feat/en-datos-20260908
