<style>
:root{
  --ink:#17395c;
  --muted:#52647a;
  --body:"Atkinson Hyperlegible",Arial,sans-serif;
  --display:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body)}
.iris-shell{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:34px 0 64px}
.iris-head{max-width:800px;margin-bottom:28px}
.iris-kicker{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#6554A8;margin:0 0 8px}
.iris-head h1{font-family:var(--display);font-size:clamp(38px,5vw,54px);font-weight:400;line-height:1.08;margin:0 0 10px}
.iris-head p{font-size:18px;line-height:1.55;color:var(--muted);margin:0}
.iris-layout{display:grid;grid-template-columns:minmax(300px,.78fr) minmax(0,1.22fr);gap:30px;align-items:start}
.iris-panel{background:#fff;border:1px solid #d9deea;border-radius:22px;padding:22px;box-shadow:0 10px 34px rgba(23,57,92,.05)}
.iris-panel h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 18px}
.iris-step{border:0;padding:0;margin:0 0 22px}
.iris-step legend{font-weight:700;margin-bottom:10px}
.iris-sections{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.iris-section{--swatch:#6554A8;--soft:#EEEBF8;min-height:52px;border:1px solid color-mix(in srgb,var(--swatch) 28%, white);background:var(--soft);border-radius:13px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:9px}
.iris-section[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--swatch);font-weight:700}
.iris-dot{width:12px;height:12px;border-radius:50%;background:var(--swatch);flex:0 0 auto}
.iris-section[data-section-choice="situaciones"]{--swatch:#6554A8;--soft:#EEEBF8}
.iris-section[data-section-choice="vida"]{--swatch:#855B87;--soft:#F1E8F1}
.iris-section[data-section-choice="ayudas"]{--swatch:#586B9D;--soft:#E9ECF7}
.iris-section[data-section-choice="condiciones"]{--swatch:#626A82;--soft:#ECEEF4}
.iris-field{display:grid;gap:7px;margin-bottom:14px}
.iris-field label{font-weight:700;font-size:15px}
.iris-field input,.iris-field textarea{width:100%;border:1px solid #aeb8c8;border-radius:12px;background:#fff;padding:11px 12px;line-height:1.45;font:inherit;color:inherit}
.iris-field textarea{min-height:86px;resize:vertical}
.iris-helper{font-size:13px;line-height:1.45;color:var(--muted);margin-top:-3px}
.iris-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.iris-btn{min-height:46px;border-radius:12px;border:1px solid var(--ink);padding:9px 15px;background:var(--ink);color:#fff;font-weight:700;font:inherit;cursor:pointer}
.iris-btn.secondary{background:#fff;color:var(--ink);border-color:#9caabd}
.iris-btn.ghost{background:transparent;color:var(--ink);border-color:#ccd2de}
.iris-preview{position:sticky;top:18px}
.iris-preview-label{display:flex;justify-content:space-between;gap:12px;margin:0 0 10px;color:var(--muted);font-size:14px}
.iris-card{
  --accent:#6554A8;
  --soft:#EEEBF8;
  --line:#cbc4e8;
  position:relative;
  min-height:520px;
  background:#fff;
  border:2px solid var(--line);
  border-radius:28px;
  padding:42px 46px 30px;
  box-shadow:0 14px 42px rgba(23,57,92,.08);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  isolation:isolate;
}
.iris-card[data-section="situaciones"]{--accent:#6554A8;--soft:#EEEBF8;--line:#cbc4e8}
.iris-card[data-section="vida"]{--accent:#855B87;--soft:#F1E8F1;--line:#d8c7d9}
.iris-card[data-section="ayudas"]{--accent:#586B9D;--soft:#E9ECF7;--line:#c8cee5}
.iris-card[data-section="condiciones"]{--accent:#626A82;--soft:#ECEEF4;--line:#ccd0db}
.iris-card::before{
  content:"";
  position:absolute;
  inset:18% 24%;
  background:url("/img/v40-brand-symbol.webp") center/contain no-repeat;
  opacity:.045;
  filter:grayscale(1);
  pointer-events:none;
  z-index:-2;
}
.iris-card::after{
  content:"IRIS GREEN Â· irisgreen.eu";
  position:absolute;
  left:7%;
  right:7%;
  top:49%;
  text-align:center;
  font-family:var(--display);
  font-size:clamp(29px,4.1vw,54px);
  letter-spacing:.08em;
  white-space:nowrap;
  color:var(--accent);
  opacity:.055;
  transform:rotate(-18deg);
  transform-origin:center;
  pointer-events:none;
  z-index:-1;
}
.iris-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.iris-card-brand{font-family:var(--display);font-size:24px}
.iris-card-type{text-align:right;color:var(--accent);font-size:12px;line-height:1.35;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.iris-card-title{font-family:var(--display);font-size:clamp(36px,4.2vw,50px);font-weight:400;line-height:1.08;color:#273645;margin:25px 0 20px}
.iris-block{margin-bottom:15px}
.iris-block h3{font-family:var(--body);font-size:17px;margin:0 0 5px;color:#2b3947}
.iris-block p{font-size:17px;line-height:1.5;margin:0;color:#263542;white-space:pre-wrap}
.iris-need{background:var(--soft);border:1px solid var(--line);border-radius:17px;padding:15px 18px}
.iris-card-foot{margin-top:auto;padding-top:18px;border-top:1px solid #e2e5ec;display:flex;justify-content:space-between;gap:14px;color:#68778a;font-size:12px}
.iris-privacy{font-size:13px;color:var(--muted);margin:15px 0 0}
@media(max-width:900px){.iris-layout{grid-template-columns:1fr}.iris-preview{position:static}.iris-card{min-height:500px}}
@media(max-width:560px){.iris-shell{width:calc(100% - 20px);padding-top:22px}.iris-sections{grid-template-columns:1fr}.iris-panel{padding:17px}.iris-card{min-height:590px;padding:29px 23px 23px;border-radius:22px}.iris-card-title{font-size:38px}.iris-block p{font-size:16px}.iris-card-foot{display:block}.iris-card-foot span{display:block;margin-top:3px}}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff!important}
  .hd,.panel,.ft,.iris-head,.iris-panel,.iris-preview-label{display:none!important}
  .iris-shell{width:100%;padding:0;margin:0}
  .iris-layout{display:block}
  .iris-preview{position:static}
  .iris-card{width:100%;height:calc(100vh - 20mm);min-height:0;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
