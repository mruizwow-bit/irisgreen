name: R51 A9 R04 library verify

on:
  push:
    branches:
      - 'agent9/r51-cloud-library-r04-20260927'
    paths:
      - 'cloud/n04-r38-library/**'
      - '.github/workflows/r51-a9-cloud-library-r04.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Canonical web source commit SHA to evaluate incrementally'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: r51-a9-r04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: cloud/n04-r38-library/package-lock.json

      - name: Locked install
        working-directory: cloud/n04-r38-library
        run: npm ci --ignore-scripts

      - name: R51 incremental source update plan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha != '' }}
        working-directory: cloud/n04-r38-library
        env:
          R51_SOURCE_SHA: ${{ inputs.source_sha }}
        run: npm run plan:r04:update

      - name: R51 source and registry gates
        working-directory: cloud/n04-r38-library
        run: |
          node --test             tests/r51-source-freeze.test.mjs             tests/r51-source-registry.test.mjs             tests/r51-r04-source-reader.test.mjs

      - name: R51 canonical age taxonomy gate
        working-directory: cloud/n04-r38-library
        run: node --test tests/r51-r04-age-taxonomy.test.mjs tests/r51-r04-age-retrieval.test.mjs

      - name: R51 six-domain editorial build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:editorial
          node --test tests/r51-r04-editorial.test.mjs

      - name: R51 Games build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:games
          node --test tests/r51-r04-games.test.mjs

      - name: R51 Routines build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:routines
          node --test tests/r51-r04-routines.test.mjs

      - name: R51 Interests candidate build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:interests
          node --test tests/r51-r04-interests.test.mjs

      - name: R51 Workshop 25 build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:workshop
          node --test tests/r51-r04-workshop.test.mjs

      - name: R51 Quiet Space editorial build and gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:quiet-space
          node --test tests/r51-r04-quiet-space.test.mjs

      - name: R51 Home source hold gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:home-gate
          node --test tests/r51-r04-home-gate.test.mjs

      - name: R51 incremental delta contract gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:delta-contract
          node --test tests/r51-r04-incremental-delta.test.mjs

      - name: R51 incremental impact planner gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:impact-contract
          node --test tests/r51-r04-incremental-impact.test.mjs

      - name: R51 single-record editorial rebuild gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:editorial-incremental-fixture
          node --test tests/r51-r04-editorial-incremental.test.mjs

      - name: R51 single-ID interactive rebuild gate
        working-directory: cloud/n04-r38-library
        run: |
          npm run build:r04:interactive-incremental-fixture
          node --test tests/r51-r04-interactive-incremental.test.mjs

      - name: Verify protected Netlify candidate site
        working-directory: cloud/n04-r38-library
        env:
          NETLIFY_SITE_ID: 47b06e68-ff54-4097-8ad8-336b2d71758a
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "EXISTING_NETLIFY_DEPLOY_CREDENTIAL_UNAVAILABLE"
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          (async()=>{
            const token=process.env.NETLIFY_AUTH_TOKEN, id=process.env.NETLIFY_SITE_ID;
            const res=await fetch('https://api.netlify.com/api/v1/sites/'+id,{headers:{Authorization:'Bearer '+token}});
            if(!res.ok) throw new Error('Netlify site API status '+res.status);
            const s=await res.json();
            if(s.id!==id||s.name!=='sabik-asistente'||s.sso_login!==true||s.sso_login_context!=='all'){
              throw new Error('Protected site identity mismatch');
            }
            const prod=s.published_deploy?.id||'';
            fs.appendFileSync(process.env.GITHUB_ENV,'R51_PRODUCTION_DEPLOY_BEFORE='+prod+'\n');
            console.log(JSON.stringify({status:'PASS',site_id:id,team_login:true,production_deploy_present:Boolean(prod)}));
          })().catch(e=>{console.error(e.message);process.exit(1);});
          NODE

      - name: Create private R04 candidate carrier deploy
        working-directory: cloud/n04-r38-library
        env:
          NETLIFY_SITE_ID: 47b06e68-ff54-4097-8ad8-336b2d71758a
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm run build
          printf '{"schema":"R51_A9_CANDIDATE_CARRIER/1.0","github_sha":"%s"}\n' "$GITHUB_SHA" > dist/r51-r04-candidate.json
          ./node_modules/.bin/netlify deploy --no-build --dir dist --site "$NETLIFY_SITE_ID" --message "R51 A9 R04 candidates $GITHUB_SHA" --json > /tmp/r51-candidate-deploy.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/r51-candidate-deploy.json','utf8'));
          const deployId=d.deploy_id||d.id||null;
          const deployUrl=d.deploy_url||d.deploy_ssl_url||null;
          if(!/^[a-f0-9]{24}$/.test(deployId||'')) throw new Error('Missing deploy id');
          if(!String(deployUrl||'').includes('--sabik-asistente.netlify.app')) throw new Error('Unexpected deploy origin');
          fs.appendFileSync(process.env.GITHUB_ENV,'N04_DEPLOY_ID='+deployId+'\nR51_CANDIDATE_DEPLOY_URL='+deployUrl+'\n');
          console.log(JSON.stringify({status:'PASS',deploy_id:deployId,private_candidate_url:deployUrl}));
          NODE

      - name: Publish R51 Interests candidate to private Cloud
        working-directory: cloud/n04-r38-library
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          R51_CANDIDATE_NAME: interests-5c
          R51_CANDIDATE_FILE: build/r04/interests-candidate-entities.json
        run: npm run publish:r04:candidate

      - name: Publish R51 Workshop candidate to private Cloud
        working-directory: cloud/n04-r38-library
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          R51_CANDIDATE_NAME: workshop-5d
          R51_CANDIDATE_FILE: build/r04/workshop-25-integrated-entities.json
        run: npm run publish:r04:candidate

      - name: Publish R51 Quiet Space candidate to private Cloud
        working-directory: cloud/n04-r38-library
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          R51_CANDIDATE_NAME: quiet-space-5e
          R51_CANDIDATE_FILE: build/r04/quiet-space-editorial-entities.json
        run: npm run publish:r04:candidate

      - name: Upload R51 editorial report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-editorial-report
          path: cloud/n04-r38-library/build/r04/editorial-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload R51 Routines report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-routines-report
          path: cloud/n04-r38-library/build/r04/routines-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload R51 Games report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-games-report
          path: cloud/n04-r38-library/build/r04/games-report.json
          if-no-files-found: ignore
          retention-days: 14


      - name: Upload R51 Interests candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-interests-candidate
          path: |
            cloud/n04-r38-library/build/r04/interests-candidate-entities.json
            cloud/n04-r38-library/build/r04/interests-candidate-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 Workshop 25 candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-workshop-25-candidate
          path: |
            cloud/n04-r38-library/build/r04/workshop-25-integrated-entities.json
            cloud/n04-r38-library/build/r04/workshop-25-integrated-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 Quiet Space editorial candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-quiet-space-editorial-candidate
          path: |
            cloud/n04-r38-library/build/r04/quiet-space-editorial-entities.json
            cloud/n04-r38-library/build/r04/quiet-space-editorial-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 Home source hold
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-home-source-hold
          path: cloud/n04-r38-library/build/r04/home-source-hold-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 incremental delta contract
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-incremental-delta-contract
          path: cloud/n04-r38-library/build/r04/incremental-delta-contract.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 incremental impact contract
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-incremental-impact-contract
          path: cloud/n04-r38-library/build/r04/incremental-impact-contract.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 incremental editorial fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-incremental-editorial-fixture
          path: cloud/n04-r38-library/build/r04/incremental-editorial-fixture.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload R51 incremental interactive fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r51-a9-r04-incremental-interactive-fixture
          path: cloud/n04-r38-library/build/r04/incremental-interactive-fixture.json
          if-no-files-found: error
          retention-days: 14
