name: A01 R2 final exact-head gate
on:
  pull_request:
    branches: [sabik/reconcile-a01-safety-continuity-20260921]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0a1d4339bae2628dc963501a30f326553605821b
          path: runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen QA support
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 987c64748fb6928c3777eb43be536f72a4730f44
          path: qa
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact Linux environment and history
        working-directory: runtime
        run: |
          test "$(git rev-parse HEAD)" = 0a1d4339bae2628dc963501a30f326553605821b
          git rev-parse HEAD
          git merge-base --is-ancestor a6c4e1b946a36940194e8c44e2d98838038fcefc HEAD
          git merge-base --is-ancestor 56c601c55ea5c3e288b3b6cb893bc2c28ee98ecc HEAD
          uname -a
          cat /etc/os-release
          node --version
          python3 --version
      - name: Verify freeze blobs protected scope and diff
        working-directory: runtime
        run: |
          BASE=fc5cdfc2f978c85033de2b07c34309f8a4a7bd18
          CAND=0a1d4339bae2628dc963501a30f326553605821b
          FREEZE=418740e858397008aa709b0fcf22589fbc20a02f
          for p in sabik/nea-core/sabik-machine.js tools/test-sabik-machine-s0.js sabik/nea-core/session.js sabik/nea-core/sabik-state.js; do
            test "$(git rev-parse "$BASE:$p")" = "$(git rev-parse "$CAND:$p")"
          done
          git diff --check "$BASE..$CAND"
          for p in tests/fixtures/sabik/a01-safety-independent-v1.json tests/specs/sabik/a01-safety-gate-v1.json tests/specs/sabik/run-a01-safety-gate-v1.mjs tests/specs/sabik/validate-a01-safety-gate-v1.mjs tools/a01-candidate-212-independent-adapter.mjs; do
            test ! -e "$p"
          done
          for p in tests/fixtures/sabik/a01-safety-independent-v1.json tests/specs/sabik/a01-safety-gate-v1.json tests/specs/sabik/run-a01-safety-gate-v1.mjs tests/specs/sabik/validate-a01-safety-gate-v1.mjs; do
            test "$(git -C ../qa rev-parse "$FREEZE:$p")" = "$(git -C ../qa rev-parse "HEAD:$p")"
          done
      - name: Inject exact frozen QA harness temporarily
        working-directory: runtime
        run: |
          mkdir -p tests/fixtures/sabik tests/specs/sabik
          cp ../qa/tests/fixtures/sabik/a01-safety-independent-v1.json tests/fixtures/sabik/
          cp ../qa/tests/specs/sabik/a01-safety-gate-v1.json tests/specs/sabik/
          cp ../qa/tests/specs/sabik/run-a01-safety-gate-v1.mjs tests/specs/sabik/
          cp ../qa/tests/specs/sabik/validate-a01-safety-gate-v1.mjs tests/specs/sabik/
          cp ../qa/tools/a01-candidate-212-independent-adapter.mjs tools/
      - name: Validate frozen contract
        working-directory: runtime
        run: node tests/specs/sabik/validate-a01-safety-gate-v1.mjs
      - name: Run exact frozen A01 gate
        working-directory: runtime
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          node tests/specs/sabik/run-a01-safety-gate-v1.mjs --adapter tools/a01-candidate-212-independent-adapter.mjs | tee /tmp/a01-r2-final.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/a01-r2-final.exit
          exit "$code"
      - name: Remove QA harness and prove candidate clean
        working-directory: runtime
        run: |
          rm tests/fixtures/sabik/a01-safety-independent-v1.json
          rm tests/specs/sabik/a01-safety-gate-v1.json
          rm tests/specs/sabik/run-a01-safety-gate-v1.mjs
          rm tests/specs/sabik/validate-a01-safety-gate-v1.mjs
          rm tools/a01-candidate-212-independent-adapter.mjs
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = 0a1d4339bae2628dc963501a30f326553605821b
      - name: Pure regressions
        working-directory: runtime
        run: |
          node tools/test-sabik-machine-s0.js
          node tools/test-sabik-s4.js
          node tools/test-sabik-page-v7.js
          node tools/test-sabik-a11y-closure.js
      - name: Browser tooling
        working-directory: runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/a01-r2-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/a01-r2-browser/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/a01-r2-browser/node_modules" >> "$GITHUB_ENV"
          node -p 'require(process.env.RUNNER_TEMP+"/a01-r2-browser/node_modules/playwright/package.json").version'
          google-chrome --version
      - name: Browser source
        working-directory: runtime
        run: |
          node tools/test-sabik-s1.js
          node tools/test-sabik-s4-browser.js
      - name: Linux build and dist browser
        working-directory: runtime
        run: |
          python3 scripts/build_site.py
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = 0a1d4339bae2628dc963501a30f326553605821b
          export S1_WEB_ROOT="$PWD/dist"
          export S4_WEB_ROOT="$PWD/dist"
          node tools/test-sabik-s1.js
          node tools/test-sabik-s4-browser.js
          node -e 'const fs=require("fs"),p=require("path");const w=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const x=p.join(d,e.name);return e.isDirectory()?w(x):[{x,b:fs.statSync(x).size}]});const f=w("dist");console.log(JSON.stringify({files:f.length,total_bytes:f.reduce((n,x)=>n+x.b,0),max_file_bytes:Math.max(...f.map(x=>x.b))},null,2));'
      - name: Bind final job verdict to frozen gate
        run: |
          code="$(cat /tmp/a01-r2-final.exit)"
          if [ "$code" = "0" ]; then echo A01_QA_PASS_CANDIDATE; else echo A01_QA_BLOCKED_CANDIDATE; fi
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a01-r2-final-exact-head
          path: /tmp/a01-r2-final.log
          retention-days: 14
