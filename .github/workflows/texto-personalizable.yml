name: Lectura · tipografía y espaciados independientes
on:
  push:
    branches: ['ajustes/auditoria-web']
    paths: ['.github/workflows/texto-personalizable.yml']
permissions:
  contents: write
concurrency:
  group: texto-personalizable-irisgreen
  cancel-in-progress: false
jobs:
  lectura:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/auditoria-web
      - name: Preparar el navegador y el directorio público actual
        run: |
          python3 -m venv /tmp/ig-text
          /tmp/ig-text/bin/pip -q install playwright==1.55.0 beautifulsoup4==4.13.4
          /tmp/ig-text/bin/python -m playwright install --with-deps chromium >/tmp/ig-text-install.log 2>&1
          python3 scripts/build_site.py
          echo "IG_TEST_OUT=$GITHUB_WORKSPACE/reports/text-preferences" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          files=['buscador.json','videoteca-listado.json','es/recursos/juegos/juegos-120.json','es/intereses/cromos.json']
          Path('/tmp/ig-text-catalogues.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}))
          PY
      - name: Registrar presentación original y cerrar pruebas pendientes de la base
        run: |
          cd dist
          /tmp/ig-text/bin/python ../scripts/test_text_preferences.py --phase baseline
          /tmp/ig-text/bin/python ../scripts/test_text_preferences.py --phase base
      - name: Incorporar controles independientes y comprobar repetibilidad
        if: always()
        run: |
          python3 scripts/extend_text_preferences.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=['assets/preferencias-lectura.js','assets/preferencias-lectura.css','assets/interfaz-comun.js','es/lectura-accesible/index.html']
          Path('/tmp/ig-text-once.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}))
          PY
          python3 scripts/extend_text_preferences.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for f in ['/tmp/ig-text-once.json','/tmp/ig-text-catalogues.json']:
              for p,digest in json.loads(Path(f).read_text()).items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==digest,p
          PY
          node --check assets/preferencias-lectura.js
          node --check assets/interfaz-comun.js
          python3 scripts/build_site.py
      - name: Probar opciones nuevas, combinaciones, idiomas, retorno y almacenamiento
        if: always()
        run: |
          cd dist
          /tmp/ig-text/bin/python ../scripts/test_text_preferences.py --phase after
      - name: Mantener las pruebas anteriores de conservación y controles
        if: always()
        run: |
          cd dist
          /tmp/ig-text/bin/python ../scripts/test_reading_preferences.py --phase after
          /tmp/ig-text/bin/python ../scripts/test_coherence.py
      - name: Preparar evidencia y fuentes exactas sin publicar informes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('/tmp/ig-text-evidence');out.mkdir(exist_ok=True)
          if Path('dist/reports/preferences/after.json').exists():shutil.copy2('dist/reports/preferences/after.json','reports/text-preferences/regression-preferences.json')
          if Path('dist/reports/coherence/tests.json').exists():shutil.copy2('dist/reports/coherence/tests.json','reports/text-preferences/regression-controls.json')
          shutil.copytree('reports/text-preferences',out/'reports',dirs_exist_ok=True)
          for name in ['assets/preferencias-lectura.js','assets/preferencias-lectura.css','assets/interfaz-comun.js','es/lectura-accesible/index.html','scripts/extend_text_preferences.py','scripts/test_text_preferences.py']:
              p=Path(name);q=out/'source'/p;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: texto-personalizable-resultados
          path: /tmp/ig-text-evidence
          retention-days: 7
      - name: Guardar cambios e informes solo en la rama de revisión
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/preferencias-lectura.js assets/preferencias-lectura.css assets/interfaz-comun.js es/lectura-accesible/index.html
          find reports -name '*.json' -print0 | xargs -0 -r git add --
          git diff --cached --quiet || git commit -m 'Incorporar tipografía y espaciados independientes con evidencia de pruebas'
          git pull --rebase origin ajustes/auditoria-web
          git push origin HEAD:ajustes/auditoria-web
