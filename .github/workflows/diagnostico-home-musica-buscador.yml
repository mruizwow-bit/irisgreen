name: Diagnostico home musica y buscador

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico-home-musica-buscador.yml'

permissions:
  contents: read

jobs:
  produccion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a que producción tenga los dos arreglos
        run: |
          python3 - <<'PY'
          import time, urllib.request
          expected=[('https://irisgreen.eu/assets/musica.js','ALL_TRACKS'),('https://irisgreen.eu/assets/buscador-comun.js',"cache: 'no-cache'")]
          for attempt in range(30):
              ok=True
              for url,needle in expected:
                  try:
                      text=urllib.request.urlopen(url+'?verify='+str(time.time_ns()),timeout=8).read().decode('utf-8','replace')
                      if needle not in text: ok=False
                  except Exception: ok=False
              if ok:
                  print('Produccion actualizada en intento',attempt+1)
                  break
              time.sleep(5)
          else:
              raise SystemExit('Produccion no ha recibido los arreglos a tiempo')
          PY
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-home
          /tmp/ig-home/bin/pip -q install playwright==1.55.0
          /tmp/ig-home/bin/python -m playwright install --with-deps chromium >/tmp/ig-browser-install.log 2>&1
      - name: Probar producción real
        run: |
          /tmp/ig-home/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          BASE='https://irisgreen.eu'
          with sync_playwright() as pw:
              b=pw.chromium.launch()
              for path in ['/','/es/investigacion/']:
                  p=b.new_page(viewport={'width':1440,'height':1000})
                  errors=[]; audio=[]; responses=[]
                  p.on('pageerror',lambda e: errors.append(str(e)))
                  p.on('request',lambda r: audio.append(r.url) if r.url.lower().split('?')[0].endswith(('.mp3','.m4a')) else None)
                  p.on('response',lambda r: responses.append((r.url,r.status)) if r.url.lower().split('?')[0].endswith(('.mp3','.m4a')) else None)
                  r=p.goto(BASE+path,wait_until='domcontentloaded'); assert r and r.status==200
                  p.locator('main h1').first.wait_for(state='visible',timeout=15000);p.wait_for_timeout(500)
                  music=p.locator('.ig-uh-music:visible,#plBtn:visible,[data-ig-music]:visible').first
                  assert music.count(), 'sin boton de musica '+path
                  music.click(); panel=p.locator('#ig-music-panel');panel.wait_for(state='visible',timeout=5000)
                  panel.locator('.ig-m-play').click();p.wait_for_timeout(1800)
                  print('MUSIC',path,'title=',panel.locator('.ig-m-title').inner_text(),'requests=',audio[:2],'responses=',responses[:2],'status=',panel.locator('.ig-m-status').inner_text())
                  assert audio and any(s in (200,206) for _,s in responses)
                  assert not panel.locator('.ig-m-status').inner_text().strip()
                  assert not errors, errors
                  p.close()
              p=b.new_page(viewport={'width':1440,'height':1000});errors=[];p.on('pageerror',lambda e: errors.append(str(e)))
              p.goto(BASE+'/',wait_until='domcontentloaded');p.locator('main h1').first.wait_for(state='visible');p.wait_for_timeout(500)
              p.locator('.ig-uh-langs button:has-text("EN")').first.click();p.wait_for_timeout(300)
              assert p.locator('html').get_attribute('lang')=='en'
              inp=p.locator('.ig-search-input').first
              print('EN_PLACEHOLDER',inp.get_attribute('placeholder'))
              initial=p.eval_on_selector_all('#consola a[href]','els=>els.filter(a=>a.offsetParent!==null).map(a=>({text:a.textContent.trim(),href:a.getAttribute("href")}))')
              print('EN_INITIAL',initial[:10])
              everyday=[x for x in initial if x['text']=='All Everyday life guides']
              assert everyday and everyday[0]['href']=='/en/everyday-life/', everyday
              initial_text=' | '.join(x['text'] for x in initial)
              assert 'Todas las fichas' not in initial_text and 'Todas las cifras' not in initial_text and 'Todas las ayudas' not in initial_text
              inp.fill('noise');p.wait_for_timeout(400)
              vals=p.eval_on_selector_all('#consola a[href]','els=>els.filter(a=>a.offsetParent!==null).map(a=>({text:a.textContent.trim(),href:a.getAttribute("href")}))')
              print('EN_NOISE',vals[:10])
              result_vals=[x for x in vals if x['href'] and ('/situations/' in x['href'] or '/conditions/' in x['href'])]
              assert result_vals and all(x['href'].startswith('/en/') for x in result_vals), result_vals
              joined=' | '.join(x['text'] for x in result_vals)
              assert 'No aguanto' not in joined and 'Me despierto' not in joined
              assert not errors, errors
              print('VALIDACION_FINAL_OK')
              b.close()
          PY
