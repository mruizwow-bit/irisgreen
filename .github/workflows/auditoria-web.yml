name: TEMP R39 A3 R06 private transport validation

on:
  push:
    branches:
      - 'agent3/r39-r06-opener-fix-20260925'
    paths:
      - '.github/workflows/auditoria-web.yml'

permissions:
  contents: read

jobs:
  r39-r06:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24.19.0']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cloud/n04-r38-library/package-lock.json
      - name: Record identity and scope
        run: |
          node --version
          test "$(git rev-parse HEAD^:sabik/authorized-transport.mjs 2>/dev/null || true)" != "$(git rev-parse HEAD:sabik/authorized-transport.mjs)"
          git diff --check 16f1134e56292ca2ee600e77e69012c494f39aaf...HEAD
          git diff --name-only 16f1134e56292ca2ee600e77e69012c494f39aaf...HEAD
      - name: Install exact Cloud dependencies
        working-directory: cloud/n04-r38-library
        run: npm ci --ignore-scripts
      - name: R06 opener-null transport regression
        run: node --test tools/test-sabik-authorized-transport.mjs
      - name: Cloud regression suite
        working-directory: cloud/n04-r38-library
        run: npm test
      - name: Cloud build
        working-directory: cloud/n04-r38-library
        run: npm run build
      - name: Static syntax checks
        run: |
          node --check sabik/authorized-transport.mjs
          node --check cloud/n04-r38-library/src/cloud-connection.mjs
          node --check cloud/n04-r38-library/src/team-transport-handler.mjs
