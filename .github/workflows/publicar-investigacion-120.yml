name: Publicar investigación 120

on:
  push:
    paths:
      - 'es/investigacion/_import/**'
      - '.github/workflows/publicar-investigacion-120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Recomponer, validar y publicar los datos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, re

          root = Path('es/investigacion')
          parts = sorted((root / '_import').glob('parte-*.xz.b64'))
          if len(parts) != 5:
              raise SystemExit(f'Se esperaban 5 partes y hay {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = lzma.decompress(base64.b64decode(encoded))
          data = json.loads(raw.decode('utf-8'))

          if len(data) != 120 or [x.get('n') for x in data] != list(range(1, 121)):
              raise SystemExit('La colección no contiene exactamente las publicaciones 1–120')

          required = ('heading','titleOrig','authors','year','design','sample','text','means','notProven','doi','heading_en','text_en','means_en','notProven_en')
          for item in data:
              missing = [k for k in required if not item.get(k)]
              if missing:
                  raise SystemExit(f'Ficha {item["n"]}: faltan campos {missing}')

          compact = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
          raw_json = compact.encode('utf-8')
          digest = hashlib.sha256(raw_json).hexdigest()
          (root / 'estudios-textos.json').write_bytes(raw_json)

          page = root / 'index.html'
          html = page.read_text(encoding='utf-8')

          html = html.replace('20 estudios', '120 publicaciones')
          html = html.replace('20 studies', '120 publications')
          html = html.replace('20 estudos', '120 publicações')
          html = re.sub(r'("numberOfItems"\s*:\s*)20\b', r'\g<1>120', html)

          html = html.replace('means: "Qué significa"', 'means: "Qué encontraron"')
          html = html.replace('means: "What it means"', 'means: "What the researchers found"')
          html = html.replace('means: "O que significa"', 'means: "O que foi encontrado"')

          html = html.replace(
              'howText: "Usamos los cuatro niveles de certeza de GRADE (alta, moderada, baja, muy baja) tal como los emplea Cochrane, pero aplicados a la afirmación concreta que publicamos: es una valoración editorial, no una evaluación GRADE formal de novo. Depende del diseño, la consistencia, el riesgo de sesgo, la precisión y de cuánta inferencia causal exige la frase."',
              'howText: "No asignamos una calificación GRADE a cada publicación. Cuando una revisión o una guía haya utilizado GRADE, indicamos la valoración publicada por sus autores y a qué resultado se refiere."'
          )
          html = html.replace(
              'gradeNote: "Adaptación editorial inspirada en GRADE. Una escala de cribado no diagnostica; una correlación no demuestra causa; una experiencia vivida no es una prevalencia."',
              'gradeNote: "Cuando el artículo no incluye una valoración GRADE, no creamos una por nuestra cuenta. Explicamos el diseño, la muestra, los resultados y las limitaciones para que se entienda hasta dónde llega la evidencia."'
          )
          html = html.replace(
              'howText: "The certainty level is an editorial judgement about the specific claim we publish, not a formal GRADE assessment. It depends on design, consistency, risk of bias, precision and how much causal inference the sentence requires."',
              'howText: "We do not assign a GRADE rating to each individual publication. When a review or guideline has used GRADE, we report the assessment published by its authors and state which outcome it applies to."'
          )
          html = html.replace(
              'gradeNote: "Editorial adaptation inspired by GRADE. A screening scale does not diagnose; a correlation does not prove cause; lived experience is not a prevalence."',
              'gradeNote: "When an article does not contain a GRADE assessment, we do not create one ourselves. We explain the design, sample, findings and limitations so readers can understand how far the evidence reaches."'
          )
          html = html.replace(
              'howText: "A certeza é uma valoração editorial sobre a afirmação concreta que publicamos, não uma avaliação GRADE formal. Depende do desenho, da consistência, do risco de viés, da precisão e de quanta inferência causal a frase exige."',
              'howText: "Não atribuímos uma classificação GRADE a cada publicação. Quando uma revisão ou diretriz utiliza GRADE, mostramos a avaliação publicada pelos autores e indicamos a que resultado ela se refere."'
          )
          html = html.replace(
              'gradeNote: "Adaptação editorial inspirada no GRADE. Uma escala de triagem não diagnostica; uma correlação não prova causa; uma experiência vivida não é uma prevalência. Os textos dos estudos estão, por enquanto, em espanhol."',
              'gradeNote: "Quando o artigo não inclui uma avaliação GRADE, não criamos uma por conta própria. Explicamos o desenho, a amostra, os resultados e as limitações para mostrar até onde a evidência permite chegar."'
          )

          html = html.replace('Última revisión de esta página: 1 de septiembre de 2026 · 120 publicaciones.', 'Última revisión de esta página: 10 de septiembre de 2026 · 120 publicaciones.')
          html = html.replace('This page last reviewed: 31 August 2026 · 120 publications.', 'This page last reviewed: 10 September 2026 · 120 publications.')
          html = html.replace('Última revisão desta página: 31 de agosto de 2026 · 120 publicações.', 'Última revisão desta página: 10 de setembro de 2026 · 120 publicações.')

          html = re.sub(r'\s*<span[^>]*>\{\{\s*c\.confLabel\s*\}\}</span>', '', html)
          html = re.sub(
              r'\s*<div style="display: grid; gap: 8px;">\s*<sc-for list="\{\{ levels \}\}" as="l" hint-placeholder-count="4">.*?</sc-for>\s*</div>',
              '', html, flags=re.S
          )

          html = html.replace('(T.designs[s.designKey] || s.design)', '(L === "es" ? s.design : (T.designs[s.designKey] || s.design))')

          pattern = re.compile(r'<script id="ig-initial-data" type="application/json" data-source="/es/investigacion/estudios-textos\.json" data-sha256="[^"]*">.*?</script>', re.S)
          replacement = '<script id="ig-initial-data" type="application/json" data-source="/es/investigacion/estudios-textos.json" data-sha256="' + digest + '">' + compact.replace('</', '<\\/') + '</script>'
          html, count = pattern.subn(lambda m: replacement, html, count=1)
          if count != 1:
              raise SystemExit('No se encontró de forma única ig-initial-data')

          if '{{ c.confLabel }}' in html or 'list="{{ levels }}"' in html:
              raise SystemExit('Queda UI de certeza editorial en la página')
          if 'valoración editorial' in html or 'editorial judgement' in html or 'valoração editorial' in html:
              raise SystemExit('Queda texto de certeza editorial en la página')
          embedded = re.search(r'<script id="ig-initial-data"[^>]*>(.*?)</script>', html, re.S)
          embedded_data = json.loads(embedded.group(1).replace('<\\/', '</'))
          if embedded_data != data:
              raise SystemExit('Los datos incrustados no coinciden con el JSON externo')

          page.write_text(html, encoding='utf-8')
          print(f'OK: {len(data)} publicaciones · {len(raw_json)} bytes · sha256={digest}')
          PY

      - name: Guardar cambios publicados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/investigacion/estudios-textos.json es/investigacion/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Publicar 120 investigaciones revisadas"
            git push
          fi
