name: Aplicar fusion final 20260915

on:
  push:
    branches:
      - release/aplicar-fusion-final-20260915

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          ref: release/aplicar-fusion-final-20260915
          path: payload

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Inventory exact recoverable files
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          hist=0
          web=0
          miss=0
          while read -r expected path; do
            [ -n "$expected" ] || continue
            if git cat-file -e "$expected^{blob}" 2>/dev/null; then
              echo "HISTORY $path"
              hist=$((hist+1))
              continue
            fi
            tmp="$(mktemp)"
            if curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "https://irisgreen.eu/$path?main-sync=20260915b" -o "$tmp"; then
              got="$(git hash-object "$tmp")"
              if [ "$got" = "$expected" ]; then
                echo "WEB $path"
                web=$((web+1))
                rm -f "$tmp"
                continue
              fi
              echo "MISMATCH $path expected=$expected got=$got"
            else
              echo "NOURL $path"
            fi
            rm -f "$tmp"
            miss=$((miss+1))
          done < ../payload/release-source/blob-manifest-final.txt
          echo "TOTAL history=$hist web=$web unresolved=$miss"
