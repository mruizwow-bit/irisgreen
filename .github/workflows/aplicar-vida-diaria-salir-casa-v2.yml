name: Validar Vida diaria · Salir de casa v2

on:
  push:
    paths:
      - '.github/workflows/aplicar-vida-diaria-salir-casa-v2.yml'

permissions:
  contents: write

jobs:
  aplicar-validar-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar las 8 parejas ES/EN con selector de tarjeta exacto
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/aplicar-vida-diaria-salir-casa.yml').read_text(encoding='utf-8')
          anchor = '      - name: Aplicar literalmente las 8 descripciones ES/EN\n'
          if source.count(anchor) != 1:
              raise SystemExit('No se encontró de forma única el paso aplicador')
          section = source.split(anchor, 1)[1]
          marker = "          python3 - <<'PY'\n"
          if marker not in section:
              raise SystemExit('No se encontró el bloque Python del aplicador')
          block = section.split(marker, 1)[1].split('\n          PY', 1)[0]
          code = textwrap.dedent(block)

          card_replacement = '''    pattern = re.compile(r'<a\\b(?=[^>]*\\bclass="[^"]*\\bvd-card\\b[^"]*")(?=[^>]*\\bhref="' + re.escape(href) + r'")[^>]*>.*?</a>', re.S)'''
          code, card_changed = re.subn(
              r'(?m)^    pattern = re\.compile\(.*re\.escape\(href\).*$',
              lambda _: card_replacement,
              code,
              count=1,
          )
          if card_changed != 1:
              raise SystemExit(f'No se pudo aislar el selector de tarjeta: {card_changed}')

          meta_replacement = (
              "    escaped_meta = html.escape(new_meta, quote=True)\n"
              "    text, meta_count = re.subn(r'(<meta name=\"description\" content=\")[^\"]*(\")', lambda m: m.group(1) + escaped_meta + m.group(2), text, count=1)\n"
              "    text, og_count = re.subn(r'(<meta property=\"og:description\" content=\")[^\"]*(\")', lambda m: m.group(1) + escaped_meta + m.group(2), text, count=1)\n"
              "    text, jsonld_count = re.subn(r'(\"description\":\\s*)\"[^\"]*\"', lambda m: m.group(1) + json.dumps(new_meta, ensure_ascii=False), text, count=1)\n"
              "    if meta_count != 1 or og_count != 1 or jsonld_count not in (0, 1):\n"
              "        raise AssertionError(f'{path}: metadatos descriptivos inesperados: {(meta_count, og_count, jsonld_count)}')"
          )
          code, meta_changed = re.subn(
              r'(?m)^    text = text\.replace\(meta\.group\(1\), html\.escape\(new_meta, quote=True\)\)$',
              lambda _: meta_replacement,
              code,
              count=1,
          )
          if meta_changed != 1:
              raise SystemExit(f'No se pudo limitar la actualización de metadatos: {meta_changed}')

          exec(compile(code, '<aplicar-vida-diaria>', 'exec'), {'__name__': '__main__'})

          # El nuevo lede validado de Perros sustituye el párrafo sobre el que
          # actuaba esta corrección histórica. Se retira solo esa guardia; el
          # resto de publish_biblioteca.py permanece intacto.
          pub_path = Path('scripts/publish_biblioteca.py')
          pub_text = pub_path.read_text(encoding='utf-8')
          dog_anchor = '# Perros de asistencia: umbral estatal y margen autonómico.\nedit("perros-de-asistencia-que-reconoce-la-ley", ['
          start = pub_text.find(dog_anchor)
          if start >= 0:
              end = pub_text.find('\n])', start)
              if end < 0:
                  raise AssertionError('No se encontró el final de la guardia histórica de Perros')
              replacement = '# Perros de asistencia: el lede validado se mantiene desde la fuente editorial.\n'
              pub_text = pub_text[:start] + replacement + pub_text[end + len('\n])'):]
              pub_path.write_text(pub_text, encoding='utf-8')
          elif 'edit("perros-de-asistencia-que-reconoce-la-ley"' in pub_text:
              raise AssertionError('La guardia de Perros existe con una estructura inesperada')
          PY

      - name: Comprobar y preparar commit sin desplegar
        shell: bash
        run: |
          git diff --check
          echo 'Archivos modificados por la integración:'
          git diff --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/biblioteca en/everyday-life scripts/publish_biblioteca.py
          test "$(git diff --cached --name-only | wc -l)" -eq 21
          git commit -m "Actualizar Vida diaria · Salir de casa ES/EN [skip netlify]"

      - name: Ejecutar build completo antes de tocar producción
        shell: bash
        run: python3 scripts/build_site.py

      - name: Verificar las 16 páginas de la salida pública
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'dist/es/biblioteca/viajar-en-avion-con-una-discapacidad-no-visible/index.html': 'En un aeropuerto hay que orientarse, esperar, pasar controles y seguir posibles cambios de puerta o de horario.',
            'dist/es/biblioteca/transporte-publico-y-desplazamientos/index.html': 'Viajar en autobús, metro o tren implica consultar horarios, usar un billete y orientarse.',
            'dist/es/biblioteca/compras-recados-y-esperas/index.html': 'Hacer la compra incluye preparar una lista, desplazarse, buscar productos, comparar precios y pagar.',
            'dist/es/biblioteca/restaurantes-y-comer-fuera/index.html': 'Comer fuera implica elegir en un menú, esperar y estar en un lugar con olores, ruido y otras personas.',
            'dist/es/biblioteca/cine-teatro-y-museos-con-menos-estimulos/index.html': 'Algunos cines, teatros y museos ofrecen sesiones o visitas con menos estímulos.',
            'dist/es/biblioteca/actividad-fisica-deporte-y-piscina/index.html': 'La actividad física no se limita al deporte.',
            'dist/es/biblioteca/ocio-arte-musica-animales-y-naturaleza/index.html': 'El ocio no tiene que ser terapéutico ni productivo.',
            'dist/es/biblioteca/perros-de-asistencia-que-reconoce-la-ley/index.html': 'Un perro de asistencia está entrenado para realizar tareas concretas relacionadas con la discapacidad de una persona.',
            'dist/en/everyday-life/flying-with-a-non-visible-disability/index.html': 'At an airport, people need to find their way around, wait, go through security checks and follow possible gate or schedule changes.',
            'dist/en/everyday-life/public-transport-and-getting-around/index.html': 'Travelling by bus, metro or train involves checking schedules, using a ticket and finding the way.',
            'dist/en/everyday-life/shopping-errands-and-waiting/index.html': 'Shopping includes preparing a list, travelling, finding products, comparing prices and paying.',
            'dist/en/everyday-life/restaurants-and-eating-out/index.html': 'Eating out involves choosing from a menu, waiting and being in a place with smells, noise and other people.',
            'dist/en/everyday-life/cinema-theatre-and-museums-with-fewer-stimuli/index.html': 'Some cinemas, theatres and museums offer sessions or visits with fewer sensory demands.',
            'dist/en/everyday-life/physical-activity-sport-and-swimming/index.html': 'Physical activity is not limited to sport.',
            'dist/en/everyday-life/leisure-art-music-animals-and-nature/index.html': 'Leisure does not have to be therapeutic or productive.',
            'dist/en/everyday-life/assistance-dogs-what-the-law-recognises/index.html': "An assistance dog is trained to carry out specific tasks related to a person's disability.",
          }
          for path, expected in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if expected not in text:
                  raise SystemExit(f'No aparece el texto validado en {path}')
          print('OK: 16/16 páginas contienen la versión validada')
          PY

      - name: Subir a main solo después de superar todo
        shell: bash
        run: git push origin HEAD:main
