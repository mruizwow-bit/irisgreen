name: Sabik I0 calibration V1

on:
  push:
    branches:
      - sabik/i0-development-calibration-v0-4-20260920
    paths:
      - ".github/workflows/sabik-i0-calibration-v1.yml"
      - "config/sabik/i0/calibration-run-v1.json"
      - "tools/sabik-i0-reference-executor.mjs"
      - "tools/run-sabik-i0-calibration-v1.mjs"
      - "docs/sabik-next/I0_CALIBRATION_RUN_START_V1.md"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runtime
        run: node --version
      - name: Contract validator
        run: node tools/validate-sabik-i0-dev-cal.mjs
      - name: Syntax
        run: |
          node --check tools/sabik-i0-reference-executor.mjs
          node --check tools/run-sabik-i0-calibration-v1.mjs
      - name: Real calibration run
        run: node tools/run-sabik-i0-calibration-v1.mjs --config config/sabik/i0/calibration-run-v1.json --output reports/sabik/i0/calibration-v1
      - name: Result hashes
        run: |
          sha256sum reports/sabik/i0/calibration-v1/*
          cat reports/sabik/i0/calibration-v1/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: sabik-i0-calibration-v1
          path: reports/sabik/i0/calibration-v1/
      - name: Commit immutable run evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sabik/i0/calibration-v1
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "test(sabik): record I0 calibration run V1"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
