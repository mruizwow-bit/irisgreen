name: Publicar Iris Green en Netlify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-produccion-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construir dist
        run: python3 scripts/build_site.py
      - name: Publicar producción
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        run: |
          TOKEN="${NETLIFY_AUTH_TOKEN:-${NETLIFY_TOKEN:-$NETLIFY_ACCESS_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No hay token de Netlify configurado en los secretos del repositorio"
            exit 1
          fi
          npx -y netlify-cli@latest deploy --prod --dir=dist --site=40042464-343c-4587-b6b7-f6159836e291 --auth="$TOKEN" --message="Iris Green main ${GITHUB_SHA}"
