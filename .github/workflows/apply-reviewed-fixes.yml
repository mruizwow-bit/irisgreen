name: Aplicar arreglos revisados

on:
  push:
    branches:
      - arreglos-2026-09-09

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: arreglos-2026-09-09
          fetch-depth: 0

      - name: Reconstruir archivos revisados
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-arreglos/manual-01.txt \
              .upload-arreglos/manual-02.txt \
              .upload-arreglos/manual-03.txt \
              .upload-arreglos/manual-04.txt \
              .upload-arreglos/manual-05.txt \
              .upload-arreglos/manual-06.txt | base64 -d > /tmp/manual_targets.tgz
          echo '1a61da7a50147c03c6569016cea97718663ec241add22ff88f1703e302ac83e8  /tmp/manual_targets.tgz' | sha256sum -c -
          tar -xzf /tmp/manual_targets.tgz -C .

      - name: Regenerar menús y buscador
        shell: bash
        run: |
          set -euo pipefail
          node .upload-arreglos/arreglar-menu-en.js
          node .upload-arreglos/generar-entradas-buscador.js

      - name: Verificar que coincide exactamente con el ZIP revisado
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c .upload-arreglos/expected-sha256.txt
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {line.split(None, 1)[1].strip() for line in Path('.upload-arreglos/expected-sha256.txt').read_text().splitlines() if line.strip()}
          allowed = set(expected)
          allowed.add('.github/workflows/apply-reviewed-fixes.yml')
          allowed.update(p.as_posix() for p in Path('.upload-arreglos').rglob('*') if p.is_file())
          changed = set()
          for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Cambios inesperados: ' + ', '.join(unexpected))
          print('Archivos objetivo verificados:', len(expected))
          print('Cambios inesperados: 0')
          PY

      - name: Dejar la rama limpia con solo los arreglos
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload-arreglos
          rm -f .github/workflows/apply-reviewed-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Aplicar arreglos revisados del 9 de septiembre'
          git push origin HEAD:arreglos-2026-09-09
