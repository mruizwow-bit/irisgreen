name: Astra R43 integrate once

on:
  push:
    branches:
      - astra/r43-interface-integration-20260927
    paths:
      - ".astra/r43-source.tar.xz"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: astra/r43-interface-integration-20260927
          fetch-depth: 0

      - name: Skip if already expanded
        id: guard
        shell: bash
        run: |
          if [ -f reports/r43-integration/EXPANDED ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Expand audited R43 source
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          tar -xJf .astra/r43-source.tar.xz -C .
          python3 .astra/apply_r43_current.py

      - name: Build pinned local vendor libraries
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          cd scripts/taller_suite/vendor
          npm install --ignore-scripts --no-audit --no-fund
          node build-vendor.mjs "$GITHUB_WORKSPACE/assets/vendor/taller"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/taller_suite/blockly_es_extra.py

      - name: Generate Workshop and apply Design coverage
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 scripts/build_taller_suite.py
          python3 scripts/apply_taller_materials_r43.py --root .
          python3 scripts/test_r43_integrated.py --root .
          node tools/test-r42-rincon-two-fixes.js
          python3 scripts/test_r42_app_shell.py
          python3 scripts/measure_r42_materials.py

      - name: Full public build
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 scripts/build_site.py
          python3 scripts/test_r43_integrated.py --root dist

      - name: Commit expanded integrated candidate
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p reports/r43-integration
          printf '%s\n' "R43 + Design R02 + Rincón integrated by Astra" > reports/r43-integration/EXPANDED
          rm -f .astra/r43-source.tar.xz .astra/apply_r43_current.py
          rm -rf scripts/taller_suite/vendor/node_modules
          git config user.name "Astra integration"
          git config user.email "noreply@irisgreen.eu"
          git add -A
          git commit -m "Astra: integrar Taller R43 + Design R02 + Rincón"
          git push origin HEAD:astra/r43-interface-integration-20260927
