name: Publicar Iris Green en Netlify
# Trigger manual de producción tras recuperación PR #367 · 2026-10-02
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-produccion-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construir dist
        run: python3 scripts/build_site.py
      - name: Desbloquear, publicar y volver a bloquear producción
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
          SITE_ID: 40042464-343c-4587-b6b7-f6159836e291
        run: |
          set -euo pipefail
          TOKEN="${NETLIFY_AUTH_TOKEN:-${NETLIFY_TOKEN:-$NETLIFY_ACCESS_TOKEN}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No hay token de Netlify configurado en los secretos del repositorio"
            exit 1
          fi

          latest_published() {
            curl -fsSL \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?production=true&latest-published=true&per_page=1" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"] if d else "")'
          }

          OLD_ID="$(latest_published)"
          if [ -z "$OLD_ID" ]; then
            echo "::error::No se pudo localizar el deploy publicado actual"
            exit 1
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$OLD_ID/unlock" >/tmp/netlify-unlock.json

          npx -y netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$SITE_ID" \
            --auth="$TOKEN" \
            --message="Iris Green main ${GITHUB_SHA}"

          NEW_ID="$(latest_published)"
          if [ -z "$NEW_ID" ]; then
            echo "::error::No se pudo localizar el nuevo deploy publicado"
            exit 1
          fi

          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$NEW_ID/lock" >/tmp/netlify-lock.json

          echo "Producción publicada y bloqueada de nuevo. Deploy: $NEW_ID"
