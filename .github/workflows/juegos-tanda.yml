name: Juegos · partidas y materiales
on:
  push:
    branches: ['ajustes/auditoria-web']
    paths: ['.github/workflows/juegos-tanda.yml']
permissions:
  contents: write
concurrency:
  group: juegos-irisgreen
  cancel-in-progress: false
jobs:
  juegos:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/auditoria-web
      - name: Preparar navegador
        run: |
          python3 -m venv /tmp/ig-games
          /tmp/ig-games/bin/pip -q install playwright==1.55.0 beautifulsoup4==4.13.4 pillow==11.3.0
          /tmp/ig-games/bin/python -m playwright install --with-deps chromium >/tmp/ig-games-install.log 2>&1
      - name: Conservar la prueba anterior y corregir el cruce de idiomas
        run: |
          test -f reports/games/repairs.json
          test -f reports/games/games-after-first-pass.json || cp reports/games/games-after.json reports/games/games-after-first-pass.json
          python3 scripts/repair_game_languages.py
      - name: Comprobar sintaxis del código de los juegos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          paths=[Path('es/recursos/juegos/index.html'),*Path('es/recursos/juegos').glob('*/index.html')]
          for path in paths:
              for m in re.finditer(r'<script[^>]*data-dc-script[^>]*>(.*?)</script>',path.read_text(),re.S):
                  p=Path('/tmp/ig-game-check.js');p.write_text(m[1]);subprocess.run(['node','--check',str(p)],check=True)
          print('Sintaxis comprobada en las páginas interactivas y su índice.')
          PY
      - name: Completar partidas, reinicios y materiales en 52 escenarios de juego
        run: /tmp/ig-games/bin/python scripts/test_games.py --phase after --full
      - name: Probar cartas con texto largo y navegación por teclado
        if: always()
        run: /tmp/ig-games/bin/python scripts/test_game_letters.py
      - name: Capturar los controles corregidos en móvil
        if: always()
        run: |
          /tmp/ig-games/bin/python - <<'PY'
          from pathlib import Path
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          import threading,functools
          root=Path.cwd();out=root/'reports/games'
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),functools.partial(Quiet,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          base=f'http://127.0.0.1:{server.server_port}'
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              for slug in ['donde-se-fue-la-energia','cada-cerebro-su-camino','palabra-misteriosa']:
                  ctx=browser.new_context(viewport={'width':390,'height':844});page=ctx.new_page()
                  page.route('**/*',lambda r:r.continue_() if r.request.url.startswith(base) else r.abort())
                  page.goto(base+'/es/recursos/juegos/'+slug+'/',wait_until='domcontentloaded')
                  page.locator('main h1').first.wait_for();page.wait_for_timeout(300)
                  if slug=='donde-se-fue-la-energia':
                      page.locator('.ig-energy-days').evaluate('(e)=>e.scrollIntoView({block:"center"})')
                  else:
                      page.locator('main section').first.evaluate('(e)=>e.scrollIntoView({block:"start"})')
                      page.evaluate('scrollBy(0,-160)')
                  page.screenshot(path=str(out/('mobile-controls-'+slug+'.png')))
                  ctx.close()
              browser.close()
          server.shutdown()
          PY
      - name: Guardar fuentes exactas y evidencia de las pruebas
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('/tmp/ig-games-evidence');out.mkdir(exist_ok=True)
          shutil.copytree('reports/games',out/'reports',dirs_exist_ok=True)
          for parent in ['es/recursos/juegos','assets','scripts']:
              for p in Path(parent).rglob('*'):
                  if p.is_file() and p.suffix in {'.html','.css','.js','.json','.py'}:
                      q=out/'source'/p;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: juegos-evidencia
          path: /tmp/ig-games-evidence
          retention-days: 3
      - name: Conservar cambios e informes solo en la rama de revisión
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- es/recursos/juegos assets/juegos-ajustes.css scripts/repair_games.py scripts/repair_game_languages.py scripts/test_games.py scripts/test_game_letters.py
          git add -- reports/games/*.json
          git diff --cached --quiet || git commit -m 'Cerrar corrección de idiomas y pruebas de juegos y cartas'
          git pull --rebase origin ajustes/auditoria-web
          git push origin HEAD:ajustes/auditoria-web
