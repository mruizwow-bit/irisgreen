name: Agent 2 publish canonical Design PR163

on:
  push:
    branches: [temp-check]

permissions:
  contents: write

env:
  TARGET_BRANCH: sabik/design-states-voice
  EXPECTED_TARGET: 97b2ffbad0870420cd7d027cdb739c7e13bc3ea5
  PREVIEW_BRANCH: sabik-preview
  EXPECTED_PREVIEW: 43b4e76ff685d041e1512df12e4a723ec04cef72
  ARCHIVE_SHA256: 21c990684f20a658f9035ca5de2a8a2f69737fcf89d2a880202f265232bcd429
  CHUNKS: >-
    43f52de1e6527b3d40694685e87ea99a875d1f96
    ac85a9b6506b064b96f61130f2836df57dbda986
    eda25b4e00d029cdbe8c3a9899009c0befa57c14
    a9b1719c051dd683f6acb10bf0fe8a33a8c300db
    5ae0bdae42687e5a7d73facb390d6690eb80c114
    5bc3a9b8938efe4f87a1d55fbfc50e6ff641c8e7
    054cf35646d3abd3e12feb2fb73002e93eb7f49d
    b7940a6f41a50c9a14df7110493190e57293de6d
    652a339e59c8d0dbdd201bbafbe925c254092614
    3229d69c31215952fdcb3c3cc8b292c9448d4c55

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify remote preconditions and reconstruct canonical package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          preview=$(git ls-remote origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')
          test "$target" = "$EXPECTED_TARGET"
          test "$preview" = "$EXPECTED_PREVIEW"

          : > /tmp/design.b64
          for sha in $CHUNKS; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$sha" --jq .content \
              | tr -d '\n' | base64 -d >> /tmp/design.b64
          done
          base64 -d /tmp/design.b64 > /tmp/design.tar.gz
          echo "$ARCHIVE_SHA256  /tmp/design.tar.gz" | sha256sum -c -
          rm -rf /tmp/canonical && mkdir -p /tmp/canonical
          tar -xzf /tmp/design.tar.gz -C /tmp/canonical

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, sys
          root=Path('/tmp/canonical')
          exp={
          'docs/sabik/design/CONTROL-STATES.md':(12677,'747822b60f81176d545ade20b493e6f052f9da7c1da1693a8703a3c29d46d5ab','f1aad17ac9a52b25816982f864353ebccc24fa7f'),
          'docs/sabik/design/README.md':(8580,'0569dd8b284ea34cf9ed91bbb5f67825b40fb99aa52fe5fb86b6e2c3f50a7dca','a0e961f54f34ec6517a4dd45ba50013f847bf21a'),
          'docs/sabik/design/RESPONSIVE-A11Y.md':(12412,'d56cf1b646fa6fe9dacc21b473f10ae00a7999be82c95d2820a3a6f251f0c6f2','9219fbee84ecc668778346e2cf208e04872c5888'),
          'docs/sabik/design/STATE-VISUAL-MATRIX.md':(32336,'c2b8a08908834d27fa1e52eaf7581d9ed5e9ad23c86efbf6d7f8381a7018e03e','0609f002c540c0713c286cab0c73a53d5ba3328a'),
          'docs/sabik/design/VOICE-WAVE-SPEC.md':(12265,'239a12514e9b514f1e67356a16ab2e149eda5b620bcd0a2977574b3eb98ef518','fab818ae1526781f30383999f20a7a3c58d8d86c'),
          'docs/sabik/design/prototypes/Banco de estados y voz.dc.html':(43211,'baca2314162943aae1b3bd3008a0bea46155294f579ae6cfaa8460f083612f7b','bef40ed8062cbf8d32e8a71702940f207dfabee0'),
          'docs/sabik/design/prototypes/README.md':(3404,'cfe279dc07354c4f6ed097b0d607b1e8b2f7d280804894bb50ab606d0c566f61','3703a5896a9c2be22d1188858c8006c7d7eb39f0'),
          'docs/sabik/design/prototypes/support.js':(69150,'8fe7df74405f3c55f49b7249c74ea1397e65d07dea2b1bd3b4a489bec2e28cbe','cb009b69ec6b5e00f48c6287a587fe7e0c6c421b'),
          }
          files=sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file())
          if files != sorted(exp):
              print('unexpected file set', files, file=sys.stderr); sys.exit(1)
          for rel,(size,sha,blob) in exp.items():
              p=root/rel; b=p.read_bytes()
              got_sha=hashlib.sha256(b).hexdigest()
              got_blob=subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()
              if (len(b),got_sha,got_blob)!=(size,sha,blob):
                  print('identity mismatch',rel,len(b),got_sha,got_blob,file=sys.stderr);sys.exit(1)
          text='\n'.join((root/p).read_text('utf-8') for p in exp)
          if 'Escuchando' in text: raise SystemExit('forbidden Escuchando found')
          import re
          if re.search(r'low_intensity\s*[:=]\s*false',text,re.I): raise SystemExit('forced low_intensity=false found')
          for term in ['human_handoff','protection_static','starting','speaking','paused','ended','error','Escuchar','Pausar voz','Reanudar voz','Detener voz','reduced-motion']:
              if term not in text: raise SystemExit('required term missing: '+term)
          print('CANONICAL_PACKAGE_OK')
          PY

      - name: Merge current preview non-destructively and apply canonical Design only
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$PREVIEW_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET"
          git config user.name "Agent 2 Design publisher"
          git config user.email "agent2-design-publisher@users.noreply.github.com"
          git merge --no-ff --no-edit "origin/$PREVIEW_BRANCH"

          rm -rf docs/sabik/design
          cp -a /tmp/canonical/docs/sabik/design docs/sabik/
          git add docs/sabik/design
          git commit -m "design(sabik): publish canonical states voice specification"

          mapfile -t changed < <(git diff --name-only "origin/$PREVIEW_BRANCH...HEAD")
          printf '%s\n' "${changed[@]}"
          expected=(
            'docs/sabik/design/CONTROL-STATES.md'
            'docs/sabik/design/README.md'
            'docs/sabik/design/RESPONSIVE-A11Y.md'
            'docs/sabik/design/STATE-VISUAL-MATRIX.md'
            'docs/sabik/design/VOICE-WAVE-SPEC.md'
            'docs/sabik/design/prototypes/Banco de estados y voz.dc.html'
            'docs/sabik/design/prototypes/README.md'
            'docs/sabik/design/prototypes/support.js'
          )
          test "${#changed[@]}" -eq 8
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          test "$(git hash-object --no-filters 'docs/sabik/design/prototypes/Banco de estados y voz.dc.html')" = bef40ed8062cbf8d32e8a71702940f207dfabee0
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Open prototype locally
        run: |
          set -euo pipefail
          test "$(grep -c '<script src="./support.js"></script>' 'docs/sabik/design/prototypes/Banco de estados y voz.dc.html')" -eq 1
          browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$browser"
          cd docs/sabik/design/prototypes
          python3 -m http.server 8765 >/tmp/design-http.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          set +e
          timeout 40s "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 \
            --dump-dom 'http://127.0.0.1:8765/Banco%20de%20estados%20y%20voz.dc.html' \
            >/tmp/design-dom.html 2>/tmp/design-chrome.log
          rc=$?
          set -e
          test -s /tmp/design-dom.html
          grep -q 'id="dc-root"' /tmp/design-dom.html
          grep -q '>Escuchar<' /tmp/design-dom.html
          grep -q 'Pausar voz' /tmp/design-dom.html
          grep -q 'Detener voz' /tmp/design-dom.html
          grep -q 'Banco de estados' /tmp/design-dom.html
          if grep -Eq 'ReferenceError|TypeError|Uncaught' /tmp/design-chrome.log; then cat /tmp/design-chrome.log; exit 1; fi
          echo "PROTOTYPE_OPEN_PASS rc=$rc"

      - name: Build clean candidate
        run: |
          set -euo pipefail
          rm -rf dist
          python3 scripts/build_site.py
          test -d dist
          test ! -e dist/docs/sabik/design
          test ! -e dist/docs/sabik/design/prototypes/support.js
          for f in \
            CONTROL-STATES.md README.md RESPONSIVE-A11Y.md STATE-VISUAL-MATRIX.md VOICE-WAVE-SPEC.md \
            'Banco de estados y voz.dc.html' support.js; do
            if find dist -type f -name "$f" -print -quit | grep -q .; then
              echo "Design file leaked to dist: $f"; exit 1
            fi
          done
          max=$(find dist -type f -printf '%s\n' | sort -nr | head -1)
          test "$max" -lt 49000000
          count=$(find dist -type f | wc -l)
          bytes=$(du -sb dist | awk '{print $1}')
          echo "BUILD_PASS files=$count bytes=$bytes max=$max design_in_dist=NO"

      - name: Recheck remotes and push normally
        run: |
          set -euo pipefail
          target=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          preview=$(git ls-remote origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')
          test "$target" = "$EXPECTED_TARGET"
          test "$preview" = "$EXPECTED_PREVIEW"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED_HEAD=$CANDIDATE_HEAD"
