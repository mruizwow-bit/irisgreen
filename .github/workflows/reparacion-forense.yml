name: Reparación forense · no despliega

on:
  push:
    branches: ['reparacion/forense-20260910']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Guardar copia textual íntegra para revisión local
        run: |
          mkdir -p /tmp/ig-snapshot
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude='*.webp' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.png' \
            --exclude='*.gif' \
            --exclude='*.svg' \
            --exclude='*.mp4' \
            --exclude='*.mp3' \
            --exclude='*.wav' \
            --exclude='*.pdf' \
            --exclude='*.zip' \
            --exclude='*.woff' \
            --exclude='*.woff2' \
            -czf /tmp/ig-snapshot/repo-texto-snapshot.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reparacion-forense-texto-snapshot
          path: /tmp/ig-snapshot/repo-texto-snapshot.tar.gz
          retention-days: 7
      - name: Compilar integradores
        run: |
          python3 -m py_compile scripts/_legacy_apply_accessible_descriptions_420.py scripts/apply_accessible_descriptions_420.py scripts/repair_situations_semantics.py scripts/build_site.py scripts/validate_publication_statuses.py scripts/finalize_validation_labels.py scripts/normalize_situation_status.py
      - name: Aplicar 420 descripciones solo en el checkout temporal
        run: |
          set -o pipefail
          mkdir -p /tmp/ig-forense
          python3 scripts/apply_accessible_descriptions_420.py | tee /tmp/ig-forense/apply-420.json
      - name: Comprobar igualdad exacta de 420 descripciones
        run: |
          set -o pipefail
          python3 scripts/apply_accessible_descriptions_420.py --check | tee /tmp/ig-forense/check-420.json
      - name: Aplicar correcciones semánticas revisadas solo en el checkout temporal
        run: |
          set -o pipefail
          python3 scripts/repair_situations_semantics.py --root . | tee /tmp/ig-forense/apply-semantica.json
          python3 scripts/repair_situations_semantics.py --root . --check | tee /tmp/ig-forense/check-semantica.json
      - name: Comprobar ejemplos de regresión de texto
        run: |
          set -o pipefail
          python3 - <<'PY' | tee /tmp/ig-forense/examples.txt
          from pathlib import Path
          checks={
            'es/situaciones/pierdo-el-hilo-en-las-reuniones/index.html':'Al principio sigo la conversación.',
            'es/situaciones/la-ropa-me-molesta/index.html':'La molestia de una etiqueta o una costura, sin cambios en la piel, no es una urgencia médica.',
            'en/situations/clothes-feel-unbearable/index.html':'Sensory differences</span><span class="chip lil">Autism',
            'es/biblioteca/viajar-en-avion-con-una-discapacidad-no-visible/index.html':'En un aeropuerto hay que orientarse, esperar, pasar controles',
          }
          for rel,needle in checks.items():
              text=Path(rel).read_text(encoding='utf-8')
              assert needle in text,(rel,needle)
              print('OK',rel,needle)
          PY
      - name: Construir dist sin desplegar
        run: |
          set -o pipefail
          python3 scripts/build_site.py | tee /tmp/ig-forense/build.txt
      - name: Comprobar que el build no reescribe las 420
        run: |
          set -o pipefail
          python3 scripts/apply_accessible_descriptions_420.py --check | tee /tmp/ig-forense/check-after-build.json
      - name: Guardar diff para revisión humana
        if: always()
        run: |
          git status --short > /tmp/ig-forense/status.txt
          git diff --check > /tmp/ig-forense/diff-check.txt || true
          git diff --stat > /tmp/ig-forense/diff-stat.txt
          git diff > /tmp/ig-forense/changes.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reparacion-forense-420
          path: /tmp/ig-forense
          retention-days: 7
