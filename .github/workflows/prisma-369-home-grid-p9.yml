name: Prisma · #369 P9 Home grid
on:
  push:
    branches: ['prisma/369-home-grid-p9-verify-*']
    paths:
      - 'scripts/test_prisma_369_home_grid_p9.py'
      - '.github/workflows/prisma-369-home-grid-p9.yml'
      - 'assets/home-r42-child-safe.css'
      - 'scripts/test_home_v4_css_integrity.py'
      - 'scripts/apply_home_r42.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Build canónico
        run: python scripts/build_site.py
      - name: Home CSS integrity
        run: python scripts/test_home_v4_css_integrity.py --root dist
      - name: QA #369 P9
        run: python scripts/test_prisma_369_home_grid_p9.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prisma-369-home-grid-p9
          path: reports/prisma-369-home-grid-p9/
          retention-days: 14
