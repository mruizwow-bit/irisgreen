# Iris Green · publicación de archivos públicos, no de la carpeta de trabajo.
# El build de producción usa una única fuente para Investigación y fue validado en CI.
[build]
  publish = "dist"
  command = "python3 scripts/build_site.py"

# Netlify normaliza las barras: no usar redirecciones hacia la misma ruta.
[build.processing.html]
  pretty_urls = true

[build.environment]
  "PYTHON_VERSION" = "3.12"

[[redirects]]
  from = "/es/recursos/juegos/juegos-86.json"
  to = "/es/recursos/juegos/juegos-120.json"
  status = 301

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    "Content-Type" = "application/xml; charset=utf-8"
    "Cache-Control" = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    "Content-Type" = "text/plain; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    "Cache-Control" = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/audio/*"
  [headers.values]
    "Cache-Control" = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    "Cache-Control" = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    "Cache-Control" = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/runtime/*"
  [headers.values]
    "Cache-Control" = "public, max-age=31536000, immutable"
