name: Temporal · Paso 2 comprobación
on:
  push:
    branches: ['integracion/20260912-accesibilidad-tipografia-libros-tarjeta']
    paths: ['.github/workflows/tmp-step2-check.yml']
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-accesibilidad-tipografia-libros-tarjeta
      - name: Construir dist
        run: python3 scripts/build_site.py
      - name: Contrato congelado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist'); pages=list(root.rglob('*.html'))
          counts={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}
          for p in pages:
              text=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\']([^"\']*)["\']',text,re.I)
                 or re.search(r'<meta[^>]*content=["\']([^"\']*)["\'][^>]*name=["\']robots["\']',text,re.I))
              value=m.group(1).strip().lower() if m else None
              counts[value if value in counts else 'otro_o_ninguno']+=1
          sitemap=len(re.findall(r'<url(?:\s|>)',Path('dist/sitemap.xml').read_text(encoding='utf-8')))
          got={'html':len(pages),**counts,'sitemap_urls':sitemap}
          expected={'html':998,'index,follow':982,'noindex,follow':2,'otro_o_ninguno':14,'sitemap_urls':995}
          print(got); assert got==expected,(got,expected)
          PY
      - name: Accesibilidad estructural real
        run: python3 scripts/audit_accesibilidad.py --root dist
      - name: Portugués sigue fuera
        run: python3 scripts/audit_sin_portugues.py --root dist
      - name: Tarjeta Iris montada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('dist')
          detail=[]
          for pattern in ['es/situaciones/*/index.html','es/biblioteca/*/index.html','es/neurodiversidad/condiciones/*/index.html']:
              detail += [p for p in root.glob(pattern) if p.is_file()]
          assert len(detail)==420,len(detail)
          bad=[]
          for p in detail:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if s.count('data-iris-card-rail="true"')!=1 or s.count('id="tarjeta-iris"')!=1:
                  bad.append(p.relative_to(root).as_posix())
          assert not bad,bad[:10]
          rep=(root/'es/situaciones/la-luz-del-supermercado-me-agota/index.html').read_text(encoding='utf-8')
          assert 'class="ficha-rail"' in rep and 'Personalizar el texto' in rep
          print({'detail_cards':len(detail),'representative':'ok'})
          PY
      - name: Estado de tipografías externas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          hits=[]
          for p in Path('dist').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.css','.js'}: continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'fonts.googleapis.com' in s or 'fonts.gstatic.com' in s: hits.append(p.relative_to('dist').as_posix())
          print({'google_font_files':len(hits),'sample':hits[:20]})
          Path('/tmp/google-fonts.txt').write_text('\n'.join(hits)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paso2-comprobacion
          path: |
            dist/reports/publicacion/accesibilidad.json
            /tmp/google-fonts.txt
          retention-days: 3
