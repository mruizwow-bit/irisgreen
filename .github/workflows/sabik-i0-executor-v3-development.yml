name: Sabik I0 executor V3-R1 decontaminated

on:
  push:
    branches:
      - sabik/i0-executor-v3-development-20260920
    paths:
      - ".github/workflows/sabik-i0-executor-v3-development.yml"
      - "config/sabik/i0/executor-v3-development.json"
      - "tools/sabik-i0-executor-v3.mjs"
      - "tools/sabik-i0-v3-evaluation-metrics.mjs"
      - "tools/test-sabik-i0-executor-v3.mjs"
      - "tools/test-sabik-i0-v3-antihardcode.mjs"
      - "tools/audit-sabik-i0-v3-literal-provenance.mjs"
      - "tools/run-sabik-i0-v3-r1-development.mjs"
      - "docs/sabik-next/I0_V3_LITERAL_PROVENANCE_AUDIT.json"
      - "docs/sabik-next/I0_EXECUTOR_V3_ARCHITECTURE.md"
      - "docs/sabik-next/I0_EXECUTOR_V3_DATA_GAPS.md"

permissions:
  contents: read

env:
  GH_TOKEN: ""
  GITHUB_TOKEN: ""

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only current V3-R1 commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seal checkout from other refs
        run: |
          test "$(git rev-list --count HEAD)" = "1"
          git remote remove origin
          test -z "$(git remote)"
          test -z "$(git for-each-ref refs/remotes --format='%(refname)')"
          test -z "$(git for-each-ref refs/pull --format='%(refname)')"
          test ! -e tests/calibration/sabik/i0-v3
          test ! -e tests/evaluation/sabik/i0/validation

      - name: Verify frozen inputs by hash
        run: |
          echo "c388607d55c5c8daef721217e49f01c0dd7e17d81c27af2f6e76f3c44cca97fb  tests/development/sabik/i0/development.v0.4.jsonl" | sha256sum -c -
          echo "ffc63e76eadbac6e975f9792e906913585bcbf53806d7616dc385481145b373f  tests/calibration/sabik/i0/calibration.v0.4.jsonl" | sha256sum -c -
          echo "3bbfcd7dfd8473b1a6366a664ddd98d7c94c08dafa6553d7879aa7b693a3edc8  tests/schemas/sabik/i0/i0-layered-case-v0.4.schema.json" | sha256sum -c -

      - name: Syntax
        run: |
          node --check tools/sabik-i0-executor-v3.mjs
          node --check tools/sabik-i0-v3-evaluation-metrics.mjs
          node --check tools/test-sabik-i0-executor-v3.mjs
          node --check tools/test-sabik-i0-v3-antihardcode.mjs
          node --check tools/audit-sabik-i0-v3-literal-provenance.mjs
          node --check tools/run-sabik-i0-v3-r1-development.mjs

      - name: Rebuild literal provenance audit
        run: |
          node tools/audit-sabik-i0-v3-literal-provenance.mjs --output /tmp/I0_V3_LITERAL_PROVENANCE_AUDIT.json
          cmp /tmp/I0_V3_LITERAL_PROVENANCE_AUDIT.json docs/sabik-next/I0_V3_LITERAL_PROVENANCE_AUDIT.json
          node -e 'const a=require("./docs/sabik-next/I0_V3_LITERAL_PROVENANCE_AUDIT.json"); if(a.CASE_SHAPED_FORBIDDEN!==0) process.exit(1)'

      - name: Anti-hardcode V2
        run: node tools/test-sabik-i0-v3-antihardcode.mjs

      - name: Contractual and paraphrase tests
        run: node tools/test-sabik-i0-executor-v3.mjs

      - name: Development 400 plus consumed regression 200
        run: node tools/run-sabik-i0-v3-r1-development.mjs --config config/sabik/i0/executor-v3-development.json --output reports/sabik/i0/executor-v3-r1-development

      - name: Isolation guard after execution
        run: |
          test -z "$(git remote)"
          test -z "$(git for-each-ref refs/remotes --format='%(refname)')"
          test ! -e tests/calibration/sabik/i0-v3
          test ! -e tests/evaluation/sabik/i0/validation
          if grep -RE "api\.github\.com|github\.com|tests/calibration/sabik/i0-v3|tests/evaluation/" \
            tools/sabik-i0-executor-v3.mjs \
            tools/run-sabik-i0-v3-r1-development.mjs \
            tools/sabik-i0-v3-evaluation-metrics.mjs; then
            echo "Forbidden external/reserved reference in V3-R1 runtime"
            exit 1
          fi
          node -e 'const m=require("./reports/sabik/i0/executor-v3-r1-development/manifest.v3-r1.json"); if(m.reserved_calibration_v3_opened!==false||m.reserved_calibration_v3_executed!==false||m.validation_opened!==false||m.validation_executed!==false) process.exit(1)'

      - name: Result hashes
        run: |
          sha256sum reports/sabik/i0/executor-v3-r1-development/*
          cat reports/sabik/i0/executor-v3-r1-development/critical-gates.v3-r1.json

      - uses: actions/upload-artifact@v4
        with:
          name: sabik-i0-executor-v3-r1-development
          path: |
            reports/sabik/i0/executor-v3-r1-development/
            docs/sabik-next/I0_V3_LITERAL_PROVENANCE_AUDIT.json
          if-no-files-found: error
