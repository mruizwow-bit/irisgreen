name: W05 R1 generate provenance-bound music fallbacks

on:
  push:
    branches:
      - web/w05-r1-music-fallback-20260922
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: web/w05-r1-music-fallback-20260922
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate fallbacks from local originals
        run: python3 scripts/generate_music_fallbacks.py
      - name: Verify originals remain baseline-identical
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(Path('audio/music-provenance.json').read_text())
          for t in data['tracks']:
              got=subprocess.check_output(['git','hash-object',t['source_path']],text=True).strip()
              assert got==t['source_git_blob_sha1'], (t['source_path'],got,t['source_git_blob_sha1'])
          assert sum(1 for t in data['tracks'] if t.get('fallback'))==9
          print('24 originals preserved; 9 provenance-bound fallbacks generated')
          PY
      - name: Commit generated derivatives and manifest measurements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/fallbacks audio/music-provenance.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat(w05): add provenance-bound MP3 fallbacks"
          git push origin "HEAD:web/w05-r1-music-fallback-20260922"
