# retry 2: el remate no escribe informes dentro de dist
name: Temporal · aplicar Paso 2
on:
  push:
    branches: ['integracion/20260912-paso2-accesibilidad']
    paths: ['.github/workflows/tmp-step2-apply.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-paso2-accesibilidad
      - name: Incorporar las tipografías locales
        run: |
          mkdir -p /tmp/ig-font-pkg assets/fonts
          cd /tmp/ig-font-pkg
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @fontsource/atkinson-hyperlegible @fontsource-variable/newsreader >/dev/null
          cd "$GITHUB_WORKSPACE"
          cp /tmp/ig-font-pkg/node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-italic.woff2 assets/fonts/
          cp /tmp/ig-font-pkg/node_modules/@fontsource/atkinson-hyperlegible/LICENSE assets/fonts/LICENSE-Atkinson-Hyperlegible.txt
          cp /tmp/ig-font-pkg/node_modules/@fontsource-variable/newsreader/LICENSE assets/fonts/LICENSE-Newsreader.txt
      - name: Aplicar solo las correcciones del Paso 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('scripts/build_site.py'); s=p.read_text(encoding='utf-8')
          marker="    # Contrato permanente: ningún estado editorial puede reaparecer en la salida pública.\n"
          call="    # Fuentes locales, impresión común y retirada definitiva de Google Fonts.\n    subprocess.run([sys.executable,str(ROOT/'scripts/apply_accessibility_release.py'),'--root',str(dst)],cwd=ROOT,check=True)\n"
          assert marker in s
          if call not in s:s=s.replace(marker,call+marker,1)
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/comprobar-publicacion.yml'); s=p.read_text(encoding='utf-8')
          s=s.replace('python3 scripts/audit_accesibilidad.py --root dist --informe-solo','python3 scripts/audit_accesibilidad.py --root dist')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/site-v23.css'); s=p.read_text(encoding='utf-8')
          rule='[style*="Atkinson"]{font-family:"IG Zero","Atkinson Hyperlegible",system-ui,sans-serif!important}'
          if rule not in s:
              anchor='body{\n'; assert anchor in s
              s=s.replace(anchor,rule+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/ajustes-interfaz.css'); s=p.read_text(encoding='utf-8')
          changes={
            '.ig-uh-reading{font-size:14px!important;width:auto!important;padding:0 10px!important}':'.ig-uh-reading{font-size:16px!important;width:auto!important;padding:0 10px!important}',
            '#ig-music-panel .ig-m-controls button{min-width:max-content;white-space:nowrap;font-size:14px;padding:6px 7px}':'#ig-music-panel .ig-m-controls button{min-width:max-content;white-space:nowrap;font-size:16px;padding:6px 7px}',
            '.ig-uh-music,.ig-uh-reading{padding-inline:8px!important;font-size:13px!important;gap:4px!important}':'.ig-uh-music,.ig-uh-reading{padding-inline:8px!important;font-size:16px!important;gap:4px!important}',
            '.ig-uh-langs button{min-width:44px!important;padding:0 6px!important;font-size:12px!important}':'.ig-uh-langs button{min-width:44px!important;padding:0 6px!important;font-size:14px!important}',
          }
          for old,new in changes.items():
              if old in s:s=s.replace(old,new,1)
              else:assert new in s, old
          p.write_text(s,encoding='utf-8')

          p=Path('es/intereses/imprimir/index.html'); s=p.read_text(encoding='utf-8')
          if 'id="print-title"' not in s:
              s=s.replace('.barra{position:sticky;', '.print-page-title{width:194mm;max-width:calc(100% - 36px);margin:22px auto 0;font-family:\'Newsreader\',Georgia,serif;font-weight:600;font-size:28px;line-height:1.2}\n.barra{position:sticky;',1)
              s=s.replace(' .barra{display:none}', ' .print-page-title{display:none}\n .barra{display:none}',1)
              s=s.replace('</head><body>\n<div class="barra">','</head><body>\n<main id="main">\n<h1 class="print-page-title" id="print-title">Cromos para imprimir</h1>\n<div class="barra">',1)
              s=s.replace('<div class="hojas" id="hojas"></div>\n<script>','<div class="hojas" id="hojas"></div>\n</main>\n<script>',1)
              old='document.documentElement.lang="en";document.title="Print cards · Iris Green";document.getElementById("imprimir").textContent="Print or save as PDF";'
              new='document.documentElement.lang="en";document.title="Print cards · Iris Green";document.getElementById("print-title").textContent="Cards to print";document.getElementById("imprimir").textContent="Print or save as PDF";'
              assert old in s;s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('es/recursos/juegos/index.html'); s=p.read_text(encoding='utf-8')
          pat=re.compile(r'<a(?P<a>[^>]*(?:data-dc-tpl="112"|href="\{\{ g\.href \}\}")[^>]*)>\s*(?P<img><img[^>]*\balt=""[^>]*>)\s*</a>')
          s,n=pat.subn(lambda m:m.group('img'),s)
          assert n>=1, 'No se encontró el enlace decorativo de Juegos'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-step2
          /tmp/ig-step2/bin/pip -q install playwright==1.55.0
          /tmp/ig-step2/bin/python -m playwright install --with-deps chromium >/tmp/ig-step2-browser.log 2>&1
      - name: Construir y exigir auditor a cero
        run: |
          python3 scripts/build_site.py
          python3 scripts/audit_accesibilidad.py --root dist
          python3 scripts/audit_sin_js.py --root dist
          python3 scripts/audit_sin_portugues.py --root dist
          python3 - <<'PY'
          from pathlib import Path
          hits=[]
          for p in Path('dist').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.html','.css','.js'}:
                  s=p.read_text(encoding='utf-8',errors='ignore')
                  if 'fonts.googleapis.com' in s or 'fonts.gstatic.com' in s:hits.append(str(p))
          assert not hits,hits[:20]
          print('Google Fonts en dist: 0')
          PY
      - name: Ejecutar una vez zoom 200, teclado, foco e impresión
        run: |
          /tmp/ig-step2/bin/python scripts/test_zoom_keyboard_focus.py --root dist --out reports/accessibility/zoom-keyboard-focus.json
          cat reports/accessibility/zoom-keyboard-focus.json
      - name: Verificar contrato congelado
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('dist');pages=list(root.rglob('*.html'))
          counts={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}
          for p in pages:
              text=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\']([^"\']*)["\']',text,re.I) or re.search(r'<meta[^>]*content=["\']([^"\']*)["\'][^>]*name=["\']robots["\']',text,re.I))
              v=m.group(1).strip().lower() if m else None
              counts[v if v in counts else 'otro_o_ninguno']+=1
          sitemap=len(re.findall(r'<url(?:\s|>)',Path('dist/sitemap.xml').read_text(encoding='utf-8')))
          got={'html':len(pages),**counts,'sitemap_urls':sitemap}
          exp={'html':998,'index,follow':982,'noindex,follow':2,'otro_o_ninguno':14,'sitemap_urls':995}
          print(got);assert got==exp
          PY
      - name: Guardar solo el Paso 2 y retirar workflows temporales
        run: |
          rm -f .github/workflows/tmp-step2-diagnose.yml .github/workflows/tmp-step2-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/comprobar-publicacion.yml _headers assets/ scripts/build_site.py scripts/apply_accessibility_release.py scripts/audit_accesibilidad.py scripts/test_zoom_keyboard_focus.py es/intereses/imprimir/index.html es/recursos/juegos/index.html reports/accessibility/zoom-keyboard-focus.json .github/workflows/tmp-step2-diagnose.yml .github/workflows/tmp-step2-apply.yml
          git commit -m 'Paso 2: cerrar accesibilidad, fuentes locales, impresión y seguridad'
          git push origin HEAD:integracion/20260912-paso2-accesibilidad
