<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="solar-total-title solar-total-desc">
<title id="solar-total-title">Total solar eclipse generic geometry</title>
<desc id="solar-total-desc">Generic educational representation: the Moon is aligned between the Sun and Earth; the umbra reaches Earth. Not to scale and not event-specific.</desc>
<defs>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff8cf"/><stop offset="68%" stop-color="#ffd867"/><stop offset="100%" stop-color="#f0a52e"/></radialGradient>
  <radialGradient id="earth" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#6ea5d7"/><stop offset="75%" stop-color="#2d5f8f"/><stop offset="100%" stop-color="#173c62"/></radialGradient>
  <radialGradient id="moon" cx="38%" cy="32%" r="66%"><stop offset="0%" stop-color="#d7d7d2"/><stop offset="80%" stop-color="#999a98"/><stop offset="100%" stop-color="#727472"/></radialGradient>
  <radialGradient id="copper" cx="38%" cy="32%" r="66%"><stop offset="0%" stop-color="#d98b67"/><stop offset="78%" stop-color="#a34f39"/><stop offset="100%" stop-color="#6f2f29"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<g opacity=".22"><path d="M350 415 L1220 458 L1220 542 L350 585 Z" fill="#8ea7c4"/><path d="M350 458 L1220 492 L1220 508 L350 542 Z" fill="#020711"/></g>
<circle cx="260" cy="500" r="150" fill="#f8dfa0" opacity=".12" filter="url(#soft)"/>
<circle cx="260" cy="500" r="110" fill="url(#sun)"/>
<g transform="translate(820 500)"><circle r="37" fill="url(#moon)"/></g>
<circle cx="1290" cy="500" r="72" fill="url(#earth)"/><circle cx="1290" cy="500" r="78" fill="none" stroke="#76b9e8" stroke-width="4" opacity=".65"/>
<path d="M350 458 L820 472 M350 542 L820 528" stroke="#f4d16b" stroke-width="2" opacity=".35"/>
<path d="M857 476 L1220 492 M857 524 L1220 508" stroke="#d6deea" stroke-width="2" opacity=".25"/>

</svg>