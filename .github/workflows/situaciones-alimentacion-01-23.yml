name: Integrar Situaciones Alimentación 01-23

on:
  push:
    branches:
      - integracion/situaciones-sentidos-sueno-comunicacion-alimentacion-20260910
    paths:
      - .github/workflows/situaciones-alimentacion-01-23.yml

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integracion/situaciones-sentidos-sueno-comunicacion-alimentacion-20260910
          fetch-depth: 0

      - name: Aplicar Alimentación 01-23
        run: python3 scripts/alimentacion_author.py --apply

      - name: Comprobar cuatro fuentes protegidas
        run: |
          python3 scripts/sentidos_author.py
          python3 scripts/sueno_author.py
          python3 scripts/comunicacion_author.py
          python3 scripts/alimentacion_author.py
          git diff --check

      - name: Guardar tanda en la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            editorial/reviews/situaciones_alimentacion_ES_EN.md \
            editorial/reviews/situaciones-alimentacion-manifest.json \
            scripts/alimentacion_author.py \
            scripts/run_accessibility_descriptions_part1.py \
            buscador.json \
            es/situaciones \
            en/situations
          git diff --cached --check
          git diff --cached --quiet && { echo 'No hay cambios que guardar'; exit 1; } || true
          git commit -m 'Situaciones Alimentación 01-23 ES-EN [skip netlify]'

      - name: Probar build completo sin publicar
        run: python3 scripts/build_site.py

      - name: Verificar las cuatro áreas protegidas
        run: |
          python3 scripts/sentidos_author.py --root dist
          python3 scripts/sueno_author.py --root dist
          python3 scripts/comunicacion_author.py --root dist
          python3 scripts/alimentacion_author.py --root dist
          python3 scripts/hide_internal_validation_labels.py --root dist

      - name: Subir solo a rama de integración
        run: git push origin HEAD:integracion/situaciones-sentidos-sueno-comunicacion-alimentacion-20260910
