name: Sabik I0 executor V2 development

on:
  push:
    branches:
      - sabik/i0-executor-v2-20260920
    paths:
      - ".github/workflows/sabik-i0-executor-v2-development.yml"
      - "tools/sabik-i0-executor-v2.mjs"
      - "tools/test-sabik-i0-executor-v2.mjs"
      - "tools/run-sabik-i0-development-v2.mjs"
      - "docs/sabik-next/I0_EXECUTOR_V2_ARCHITECTURE.md"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify frozen development and schema are untouched
        run: git diff --exit-code 04569282ab3637a60ecccb002c8e49b8c4f3cd2a -- tests/development/sabik/i0 tests/schemas/sabik/i0
      - name: Syntax
        run: |
          node --check tools/sabik-i0-executor-v2.mjs
          node --check tools/test-sabik-i0-executor-v2.mjs
          node --check tools/run-sabik-i0-development-v2.mjs
      - name: Contract-derived unit tests
        run: node tools/test-sabik-i0-executor-v2.mjs
      - name: Development-only run
        run: node tools/run-sabik-i0-development-v2.mjs reports/sabik/i0/executor-v2-development
      - name: Guard forbidden evaluation paths
        run: |
          if grep -E "tests/(calibration|evaluation)/sabik/i0" tools/sabik-i0-executor-v2.mjs tools/run-sabik-i0-development-v2.mjs tools/test-sabik-i0-executor-v2.mjs; then
            echo "Forbidden calibration/validation path in V2 runtime"
            exit 1
          fi
      - name: Result hashes
        run: |
          sha256sum reports/sabik/i0/executor-v2-development/*
          cat reports/sabik/i0/executor-v2-development/metrics.development.v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: sabik-i0-executor-v2-development
          path: reports/sabik/i0/executor-v2-development/
      - name: Commit development evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sabik/i0/executor-v2-development
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "test(sabik): record I0 executor V2 development metrics"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
