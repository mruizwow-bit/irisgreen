name: Tanda · fuera el estado público

on:
  push:
    branches: ['integracion/20260911-estado-publico']

permissions:
  contents: write

jobs:
  retirar:
    if: ${{ !contains(github.event.head_commit.message, '[estado-generado]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Contar la indexación ANTES, con el main actual sin esta tanda
        run: |
          rm -rf /tmp/estado-base /tmp/estado
          mkdir -p /tmp/estado
          git worktree add --detach /tmp/estado-base origin/main
          (
            cd /tmp/estado-base
            python3 scripts/build_site.py
          )
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('/tmp/estado-base/dist')
          cuenta={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}
          paginas=list(root.rglob('*.html'))
          for p in paginas:
              t=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name="robots"[^>]*content="([^"]*)"',t)
                 or re.search(r'<meta[^>]*content="([^"]*)"[^>]*name="robots"',t))
              clave=m.group(1).strip() if m else None
              cuenta[clave if clave in cuenta else 'otro_o_ninguno'] += 1
          if len(paginas) != 998:
              raise SystemExit(f'La línea base ya no tiene 998 páginas HTML: {len(paginas)}')
          Path('/tmp/estado/indexacion-antes.json').write_text(json.dumps(cuenta,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          print('línea base:',json.dumps(cuenta,ensure_ascii=False),'páginas:',len(paginas))
          PY

      - name: Separar el estado editorial de la indexación
        run: |
          # El tercer guion de la tanda se escribe exactamente desde el paquete revisado.
          # Va comprimido aquí para que los cuatro archivos entren en una sola ejecución.
          cat <<'VALIDATE_B64' | base64 -d | gzip -d > scripts/validate_publication_statuses.py
          
          VALIDATE_B64
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, rel):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{rel}: esperaba una aparición y hay {n}: {old[:160]}')
              return text.replace(old,new,1)

          rel='scripts/publish_biblioteca.py'
          p=Path(rel);t=p.read_text(encoding='utf-8')
          t=once(t,
              "    text = text.replace('<meta name=\"robots\" content=\"noindex,follow\"/>', '<meta name=\"robots\" content=\"index,follow\"/>')\n",
              "    # La indexación no se decide aquí. Se conserva exactamente el meta robots\n"
              "    # que ya tenga la ficha; publicar y etiquetar son decisiones distintas.\n",
              rel)
          t=once(t,
              "    forbidden = [\"BORRADOR\", \"Página en borrador\", \"Estado:</strong> borrador\", 'content=\"noindex,follow\"']\n",
              "    forbidden = [\"BORRADOR\", \"Página en borrador\", \"Estado:</strong> borrador\"]\n",
              rel)
          p.write_text(t,encoding='utf-8')

          rel='scripts/build_site.py'
          p=Path(rel);t=p.read_text(encoding='utf-8')
          needle="    files=sorted(p.relative_to(dst).as_posix() for p in dst.rglob('*') if p.is_file())\n"
          replacement=(
              "    # Estado editorial: nunca llega a la salida pública. Esta comprobación\n"
              "    # corre sobre el dist final y falla si reaparece un sello o atributo.\n"
              "    subprocess.run([sys.executable,str(ROOT/'scripts/audit_sin_estados_publicos.py'),'--root',str(dst)],cwd=ROOT,check=True)\n"
              + needle
          )
          t=once(t,needle,replacement,rel)
          p.write_text(t,encoding='utf-8')
          PY
          python3 -m py_compile scripts/publish_biblioteca.py scripts/build_site.py scripts/validate_publication_statuses.py scripts/finalize_validation_labels.py scripts/audit_sin_estados_publicos.py

      - name: Construir con el estado público retirado
        run: python3 scripts/build_site.py

      - name: La indexación tiene que ser EXACTAMENTE la misma
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('dist')
          cuenta={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}
          paginas=list(root.rglob('*.html'))
          for p in paginas:
              t=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name="robots"[^>]*content="([^"]*)"',t)
                 or re.search(r'<meta[^>]*content="([^"]*)"[^>]*name="robots"',t))
              clave=m.group(1).strip() if m else None
              cuenta[clave if clave in cuenta else 'otro_o_ninguno'] += 1
          antes=json.loads(Path('/tmp/estado/indexacion-antes.json').read_text(encoding='utf-8'))
          Path('/tmp/estado/indexacion-despues.json').write_text(json.dumps(cuenta,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          print('antes: ',json.dumps(antes,ensure_ascii=False))
          print('después:',json.dumps(cuenta,ensure_ascii=False))
          if len(paginas) != 998:
              raise SystemExit(f'La salida ya no tiene 998 páginas HTML: {len(paginas)}')
          if antes != cuenta:
              raise SystemExit('La indexación ha cambiado. Esta tanda solo retira estado público.')
          print('Indexación idéntica en las 998 páginas.')
          PY

      - name: Comprobar que no queda ningún sello, estricto
        run: |
          python3 scripts/audit_sin_estados_publicos.py --root dist
          python3 scripts/finalize_validation_labels.py --root dist

      - name: Comprobar lectura sin JavaScript y tamaño de la web
        run: |
          python3 scripts/audit_sin_js.py --root dist
          cd dist
          python3 - <<'PY'
          import pathlib
          n=len(list(pathlib.Path('.').rglob('*.html')))
          print('páginas publicadas:',n)
          if n != 998: raise SystemExit(1)
          PY

      - name: Reunir los informes
        if: always()
        run: |
          mkdir -p /tmp/estado
          for item in publicacion/sin-estados.md publicacion/sin-js.json; do
            [ -f "dist/reports/$item" ] && install -D "dist/reports/$item" "/tmp/estado/$item"
          done
          [ -f reports/validation/labels.json ] && install -D reports/validation/labels.json /tmp/estado/labels.json

      - name: Guardar las fuentes comprobadas
        run: |
          git config user.name 'Iris Green validation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- '*.html' '*.json' scripts editorial
          git --no-pager diff --cached --stat | tail -30
          git commit -m 'Fuera el estado publico; la indexacion no se toca [estado-generado]'
          git push origin HEAD:integracion/20260911-estado-publico

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: estado-publico
          path: /tmp/estado
          retention-days: 14
