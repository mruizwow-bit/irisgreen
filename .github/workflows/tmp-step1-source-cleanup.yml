name: Temporal · Paso 1 limpiar PT en fuentes
on:
  push:
    branches: ['integracion/20260912-sale-portugues']
    paths: ['.github/workflows/tmp-step1-source-cleanup.yml']
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-sale-portugues
      - name: Limpiar PT-BR de las fuentes ES y recursos públicos
        run: |
          before="$(sha256sum _redirects | cut -d' ' -f1)"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import scripts.strip_portuguese_public as s

          roots = [Path('es'), Path('assets')]
          changed=[]
          for root in roots:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel=path.as_posix()
                  if path.suffix.lower()=='.json':
                      try: original=json.loads(path.read_text(encoding='utf-8'))
                      except (UnicodeDecodeError,json.JSONDecodeError): continue
                      drop=rel in s.PT_LANGUAGE_JSON
                      cleaned=s.clean_json_value(original,drop_language_keys=drop)
                      if cleaned!=original:
                          path.write_text(json.dumps(cleaned,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
                          changed.append(rel)
                      continue
                  if path.suffix.lower() not in {'.html','.js','.css','.xml','.txt'}: continue
                  try: old=path.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  new,_=s.clean_text(old,drop_language_objects=rel in s.PT_LANGUAGE_TEXT)
                  if new!=old:
                      path.write_text(new,encoding='utf-8')
                      changed.append(rel)
          print('Fuentes limpiadas:',len(changed))
          for p in changed: print('-',p)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/reparacion-web.yml')
          s=p.read_text(encoding='utf-8')
          old="git add -- index.html es en pt-br assets buscador.json scripts"
          new="git add -- index.html es en assets buscador.json scripts"
          assert old in s, 'No se encontró el git add con pt-br esperado'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          after="$(sha256sum _redirects | cut -d' ' -f1)"
          test "$before" = "$after"
          test ! -d pt-br
          ! grep -RIl --include='*.html' --include='*.js' 'ig-nav-pt' es assets
          ! grep -RIl --include='*.html' 'href=["'"'][^"'"']*/pt-br/' es
          ! grep -RIl --include='*.html' 'hreflang=["'"']pt' es
      - name: Guardar la limpieza en la misma rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- es assets .github/workflows/reparacion-web.yml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Paso 1: retirar PT-BR de las fuentes españolas'
          git push origin HEAD:integracion/20260912-sale-portugues
