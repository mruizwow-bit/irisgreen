name: Idioma global · conservar ES EN
on:
  push:
    branches: ['ajustes/idioma-global-20260907']
    paths:
      - '.github/workflows/idioma-global.yml'
      - 'assets/interfaz-comun.js'
      - 'scripts/test_language_persistence.py'
permissions:
  contents: read
concurrency:
  group: idioma-global-irisgreen
  cancel-in-progress: true
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/idioma-global-20260907
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-language
          /tmp/ig-language/bin/pip -q install playwright==1.55.0
          /tmp/ig-language/bin/python -m playwright install --with-deps chromium >/tmp/ig-language-browser.log 2>&1
      - name: Generar exactamente la salida pública
        run: |
          node --check assets/interfaz-comun.js
          python3 scripts/build_site.py
          python3 scripts/repair_routes.py --check
      - name: Probar recorridos EN entre secciones
        run: /tmp/ig-language/bin/python scripts/test_language_persistence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: idioma-global-resultados
          path: reports/languages/language-persistence.json
          retention-days: 7
