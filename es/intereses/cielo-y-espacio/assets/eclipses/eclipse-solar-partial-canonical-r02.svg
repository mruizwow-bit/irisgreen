<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="solar-partial-r02-title solar-partial-r02-desc">
<title id="solar-partial-r02-title">Partial solar eclipse generic geometry and observed-disk inset</title>
<desc id="solar-partial-r02-desc">Educational representation with two linked views. Side view: the Moon is offset so Earth lies in the penumbra. Inset: only part of the solar disk is covered. No fixed obscuration percentage is implied.</desc>
<defs>
 <radialGradient id="sun" cx="48%" cy="45%" r="55%"><stop offset="0%" stop-color="#fffce5"/><stop offset="64%" stop-color="#ffe27a"/><stop offset="100%" stop-color="#eeb13a"/></radialGradient>
 <radialGradient id="earth" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#75addc"/><stop offset="72%" stop-color="#346d9e"/><stop offset="100%" stop-color="#183e62"/></radialGradient>
 <radialGradient id="moon" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#deded9"/><stop offset="78%" stop-color="#9d9e9b"/><stop offset="100%" stop-color="#70716f"/></radialGradient>
 <radialGradient id="copper" cx="38%" cy="32%" r="68%"><stop offset="0%" stop-color="#df9774"/><stop offset="72%" stop-color="#b25b43"/><stop offset="100%" stop-color="#713128"/></radialGradient>
 <filter id="blur20"><feGaussianBlur stdDeviation="20"/></filter>
 </defs>

<path d="M340 365 L1220 410 L1220 675 L340 625 Z" fill="#8397ad" opacity=".16"/>
<path d="M340 455 L1170 454 L1170 536 L340 545 Z" fill="#030812" opacity=".14"/>
<circle cx="245" cy="500" r="112" fill="url(#sun)"/>
<circle cx="790" cy="425" r="38" fill="url(#moon)"/>
<circle cx="1288" cy="500" r="74" fill="url(#earth)"/><circle cx="1288" cy="500" r="80" fill="none" stroke="#7fc2ee" stroke-width="4" opacity=".6"/>
<path d="M357 414 L790 387 M357 586 L790 463" stroke="#f3d77b" stroke-width="2" opacity=".25"/>
<g transform="translate(1380 175)"><circle r="62" fill="url(#sun)"/><circle cx="39" cy="-9" r="62" fill="#090d16"/></g>

</svg>