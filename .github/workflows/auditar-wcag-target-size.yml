name: Auditar WCAG tamaño de objetivos
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-size:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar Chromium
        run: |
          python3 -m venv /tmp/ig-targets
          /tmp/ig-targets/bin/pip -q install playwright==1.55.0
          /tmp/ig-targets/bin/python -m playwright install --with-deps chromium >/tmp/ig-targets-install.log 2>&1
      - name: Construir salida pública
        run: python3 scripts/build_site.py
      - name: Inventariar objetivos 24x24 y excepciones
        run: |
          cd dist
          /tmp/ig-targets/bin/python ../scripts/audit_target_size.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wcag-target-size
          path: dist/reports/wcag-target-size
          retention-days: 14
