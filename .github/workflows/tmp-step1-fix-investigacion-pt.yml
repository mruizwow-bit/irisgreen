name: Temporal · Paso 1 retirar PT de Investigación
on:
  push:
    branches: ['integracion/20260912-sale-portugues']
    paths: ['.github/workflows/tmp-step1-fix-investigacion-pt.yml']
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-sale-portugues
      - name: Retirar las ramas PT restantes de Investigación
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('es/investigacion/index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('heading: L === "en" ? (s.heading_en || s.titleOrig || s.heading) : (L === "pt" ? (s.heading_pt || s.titleOrig || s.heading) : s.heading),','heading: L === "en" ? (s.heading_en || s.titleOrig || s.heading) : s.heading,'),
            ('titleEs: L === "en" ? (originalTitle ? "Original title: " + originalTitle : "") : (L === "pt" ? T.spanishTitle + s.titleEs : s.titleEs),','titleEs: L === "en" ? (originalTitle ? "Original title: " + originalTitle : "") : s.titleEs,'),
            ('authors: (L === "en" ? s.authors_en : L === "pt" ? s.authors_pt : s.authors) || s.authors,','authors: (L === "en" ? s.authors_en : s.authors) || s.authors,'),
            ('year: s.year, authorLine: ((L === "en" ? s.authors_en : L === "pt" ? s.authors_pt : s.authors) || s.authors) + (s.year ? " · " + s.year : ""),','year: s.year, authorLine: ((L === "en" ? s.authors_en : s.authors) || s.authors) + (s.year ? " · " + s.year : ""),'),
            ('reference: ((L === "en" ? s.authors_en : L === "pt" ? s.authors_pt : s.authors) || s.authors) + (s.year ? " (" + s.year + ")" : "") + ". " + s.titleOrig + ". " + (L === "es" ? s.design : (T.designs[s.designKey] || s.design)) + (nSample ? ", " + nSample : "") + ". " + (s.doi || "")','reference: ((L === "en" ? s.authors_en : s.authors) || s.authors) + (s.year ? " (" + s.year + ")" : "") + ". " + s.titleOrig + ". " + (L === "es" ? s.design : (T.designs[s.designKey] || s.design)) + (nSample ? ", " + nSample : "") + ". " + (s.doi || "")'),
          ]
          for old,new in pairs:
              count=s.count(old)
              assert count==1, f'Patrón esperado una vez; encontrado {count}: {old[:70]}'
              s=s.replace(old,new,1)
          assert 'L === "pt"' not in s
          assert 's.heading_pt' not in s and 's.authors_pt' not in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar el ajuste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- es/investigacion/index.html
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Paso 1: retirar las últimas ramas PT de Investigación'
          git push origin HEAD:integracion/20260912-sale-portugues
