name: Datos · generar inglés v3

on:
  push:
    branches: [feat/en-datos-20260908]
    paths:
      - .github/workflows/datos-generar-en-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/en-datos-20260908
          fetch-depth: 0

      - name: Reejecutar generador v2 aprobado
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          src = pathlib.Path('.github/workflows/datos-generar-en-v2.yml').read_text()
          m = re.search(r"node <<'NODE'\n(.*?)\n\s*NODE", src, re.S)
          if not m:
              raise SystemExit('No encuentro el bloque Node del generador v2')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in m.group(1).splitlines())
          pathlib.Path('/tmp/datos-generar.js').write_text(script)
          subprocess.run(['node','/tmp/datos-generar.js'], check=True)
          PY

      - name: Enriquecer buscador con parejas EN
        shell: bash
        run: python3 scripts/enrich_search_english.py

      - name: Build local
        shell: bash
        run: |
          python3 scripts/build_site.py
          test -f dist/en/data/index.html
          test -f dist/en/data/autism/index.html
          test -f dist/en/data/children-with-disabilities/index.html

      - name: Prueba rápida en navegador
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 -d dist >/tmp/iris-server.log 2>&1 &
          echo $! > /tmp/iris-server.pid
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[]; page.on('pageerror', e=>errors.push(String(e)));
            const urls=['/es/datos/','/en/data/','/es/datos/autismo/','/en/data/autism/','/en/data/children-with-disabilities/','/en/everyday-life/'];
            for(const u of urls){
              const res=await page.goto('http://127.0.0.1:4173'+u,{waitUntil:'domcontentloaded'});
              if(!res||res.status()>=400) throw new Error(`${u} status ${res&&res.status()}`);
              const labels=await page.locator('nav.langs .lang').evaluateAll(els=>els.map(e=>e.textContent.trim()).join(' '));
              if(!labels.includes('ES')||!labels.includes('EN')) throw new Error(`${u} selector incorrecto: ${labels}`);
              if(labels.includes('PT-BR')) throw new Error(`${u} muestra PT-BR`);
            }
            await page.goto('http://127.0.0.1:4173/en/data/',{waitUntil:'domcontentloaded'});
            await page.click('#a11yBtn');
            if(!await page.locator('#a11y:not([hidden])').count()) throw new Error('Lectura no abre');
            await page.click('#plBtn');
            await page.waitForSelector('#ig-music-panel:not([hidden])',{timeout:3000});
            if(errors.length) throw new Error('Errores JS: '+errors.join(' | '));
            await browser.close(); console.log('browser-ok');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill $(cat /tmp/iris-server.pid)

      - name: Limpiar temporales
        shell: bash
        run: |
          rm -f .github/workflows/datos-extraer-cola.yml .github/workflows/datos-extraer-cifras.yml .github/workflows/datos-generar-en.yml .github/workflows/datos-generar-en-v2.yml .github/workflows/datos-generar-en-v3.yml
          rm -f cola-traduccion/datos*.json cola-traduccion/datos*.md
          rmdir cola-traduccion 2>/dev/null || true

      - name: Commit final de Datos EN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m "Añadir Datos en inglés" || true
          git push origin HEAD:feat/en-datos-20260908
