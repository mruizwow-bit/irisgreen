name: Temporal aplicar paquete Claude
on:
  push:
    branches: [integracion/20260912-correcciones-claude]
    paths:
      - 'tmp/claude-bundle/**'
      - 'scripts/tmp_apply_claude_bundle.py'
      - '.github/workflows/tmp-aplicar-paquete-claude.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-correcciones-claude
      - name: Aplicar paquete exacto
        run: |
          python3 scripts/tmp_apply_claude_bundle.py
          python3 -m py_compile scripts/connect_tarjetas_iris.py
      - name: Construir y comprobar
        run: |
          python3 -m pip -q install beautifulsoup4==4.13.4
          python3 scripts/build_site.py
          python3 scripts/audit_accesibilidad.py --root dist
          python3 scripts/audit_sin_js.py --root dist
          python3 scripts/audit_sin_portugues.py --root dist
          python3 scripts/audit_sin_estados_publicos.py --root dist
          ! grep -RIl 'fonts.googleapis.com' dist --include='*.html' --include='*.css' | grep -q .
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('dist')
          pages=list(root.rglob('*.html'))
          c={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}
          for p in pages:
              t=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\']([^"\']*)["\']',t,re.I)
                 or re.search(r'<meta[^>]*content=["\']([^"\']*)["\'][^>]*name=["\']robots["\']',t,re.I))
              v=m.group(1).strip().lower() if m else None
              c[v if v in c else 'otro_o_ninguno']+=1
          sm=Path('dist/sitemap.xml').read_text(encoding='utf-8')
          got=(len(pages),c['index,follow'],c['noindex,follow'],c['otro_o_ninguno'],len(re.findall(r'<url(?:\s|>)',sm)))
          expected=(998,982,2,14,995)
          assert got==expected,(got,expected)
          print('Contrato:',got)
          PY
      - name: Guardar solo la tanda de Claude
        run: |
          git config user.name 'Iris Green validation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/navigation-approved.css assets/site-v23.css scripts/connect_tarjetas_iris.py \
            es/privacidad/index.html es/lectura-accesible/index.html es/metodologia/index.html \
            es/sobre-iris-green/index.html es/libros/index.html en/privacy/index.html
          git rm -r tmp/claude-bundle scripts/tmp_apply_claude_bundle.py
          git commit -m 'Aplicar tanda visual y textos preparados por Claude'
          git push origin HEAD:integracion/20260912-correcciones-claude
