name: Ajuste del mensaje de los libros
on:
  push:
    branches: ['ajustes/visibilidad-mensaje-libros']
    paths: ['.github/workflows/visibilidad-mensaje-libros.yml']
permissions:
  contents: write
jobs:
  mover-mensaje:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ajustes/visibilidad-mensaje-libros
      - name: Mover solo el mensaje existente y comprobar la integridad
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from html.parser import HTMLParser

          path = Path('index.html')
          raw = path.read_text(encoding='utf-8')
          pattern = r'<script\b[^>]*type=[\"\']__bundler/template[\"\'][^>]*>(.*?)</script\s*>'
          match = re.search(pattern, raw, re.S | re.I)
          assert match, 'La home ha cambiado de formato; detener sin modificarla.'
          template = json.loads(match.group(1))

          class Node:
              def __init__(self, tag, attrs, start, opening_end, parent):
                  self.tag, self.attrs = tag, dict(attrs)
                  self.start, self.opening_end, self.end = start, opening_end, opening_end
                  self.parent = parent

          class Tree(HTMLParser):
              void = {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
              def __init__(self, source):
                  super().__init__(convert_charrefs=False)
                  self.source, self.nodes, self.stack = source, [], []
                  self.lines = [0]
                  for line in source.splitlines(keepends=True):
                      self.lines.append(self.lines[-1] + len(line))
                  self.feed(source)
                  self.close()
              def offset(self):
                  line, column = self.getpos()
                  return self.lines[line-1] + column
              def handle_starttag(self, tag, attrs):
                  start = self.offset()
                  node = Node(tag, attrs, start, start+len(self.get_starttag_text()), self.stack[-1] if self.stack else None)
                  self.nodes.append(node)
                  if tag not in self.void:
                      self.stack.append(node)
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  if tag not in self.void:
                      self.stack.pop()
              def handle_endtag(self, tag):
                  for i in range(len(self.stack)-1, -1, -1):
                      if self.stack[i].tag == tag:
                          end = self.source.find('>', self.offset()) + 1
                          for node in self.stack[i:]:
                              node.end = end
                          del self.stack[i:]
                          return

          tree = Tree(template)
          message = 'Todo lo de esta web es gratis. La pagan dos libros.'
          paragraphs = [n for n in tree.nodes if n.tag == 'p' and message in template[n.start:n.end]]
          assert len(paragraphs) == 1, 'Debe existir exactamente un mensaje original.'
          old = paragraphs[0]
          main = old.parent
          while main and main.tag != 'main':
              main = main.parent
          assert main, 'El mensaje debe estar dentro del contenido principal.'
          headings = [n for n in tree.nodes if n.tag == 'h1' and main.start < n.start < old.start]
          assert len(headings) == 1, 'No se puede identificar el titular de la home de forma inequívoca.'
          heading = headings[0]
          inputs = [n for n in tree.nodes if n.tag == 'input' and heading.end < n.start < old.start and n.attrs.get('type','text') not in {'hidden','checkbox','radio','button','submit'} and (n.attrs.get('placeholder') or n.attrs.get('type') == 'search')]
          assert inputs, 'No se encuentra el buscador; no modificar.'
          search = min(inputs, key=lambda n:n.start)
          panel = search
          while panel.parent and not (panel.parent.start <= heading.start < panel.parent.end):
              panel = panel.parent
          assert panel.parent and heading.end < panel.start < old.start, 'La posición del mensaje no es segura.'
          print('Buscador:', search.attrs)
          print('Antes del panel:', template[panel.start:panel.start+400])
          print('Final de la introducción:', template[max(heading.end,panel.start-800):panel.start])
          old_html = template[old.start:old.end]
          assert 'href="/es/libros/"' in old_html and '>Verlos</a>' in old_html
          replacement = '<p id="ig-books-message" style="margin:0 0 24px; font-size:16px; line-height:1.6; color:#17395c;">Todo lo de esta web es gratis. La pagan dos libros. <a href="/es/libros/" style="font-weight:700; text-decoration:underline; text-underline-offset:3px;">Verlos</a></p>'
          without_old = template[:old.start] + template[old.end:]
          changed = without_old[:panel.start] + replacement + '\n' + without_old[panel.start:]
          assert changed.replace(replacement+'\n', '', 1) == without_old, 'Se ha modificado contenido adicional.'
          assert changed.count(message) == 1
          new_tree = Tree(changed)
          new_message = next(n for n in new_tree.nodes if n.attrs.get('id') == 'ig-books-message')
          new_inputs = [n for n in new_tree.nodes if n.tag == 'input' and n.attrs == search.attrs]
          assert new_message.end < min(n.start for n in new_inputs)
          new_main = new_message.parent
          while new_main and new_main.tag != 'main':
              new_main = new_main.parent
          assert new_main
          encoded = json.dumps(changed, ensure_ascii=False).replace('</', '<\\u002F')
          assert json.loads(encoded) == changed
          updated = raw[:match.start(1)] + encoded + raw[match.end(1):]
          reloaded = re.search(pattern, updated, re.S | re.I)
          assert reloaded and json.loads(reloaded.group(1)) == changed
          assert updated[:reloaded.start(1)] == raw[:match.start(1)]
          assert updated[reloaded.end(1):] == raw[match.end(1):]
          path.write_text(updated, encoding='utf-8')
          print('Comprobado: mensaje original una sola vez, tras la introducción y antes del buscador.')
          print('Comprobado: enlace interno conservado; texto, buscador, datos y resto de la página intactos.')
          PY
      - name: Guardar solo el cambio de la home en la rama de revisión
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git rm -- .github/workflows/visibilidad-mensaje-libros.yml
          git diff --cached --stat
          git commit -m 'Dar visibilidad al mensaje de los libros antes del buscador'
          git push origin HEAD:ajustes/visibilidad-mensaje-libros
