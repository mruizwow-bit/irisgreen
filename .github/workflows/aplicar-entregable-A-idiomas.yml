name: Aplicar entregable A de idiomas
on:
  push:
    branches: [recuperacion-estable-20260908]
    paths: ['.github/workflows/aplicar-entregable-A-idiomas.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idiomas-A-20260908
          fetch-depth: 0
      - name: Aplicar solo los seis cambios aprobados
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'No se encontró patrón en {path}: {old!r}')
              s2 = s.replace(old, new, 1)
              p.write_text(s2, encoding='utf-8')

          # 1-2. Portadas de Situaciones: retirar solo PT-BR del selector.
          replace_once('es/situaciones/index.html',
                       '<a class="lang" href="../../pt-br/situacoes/" lang="pt-BR">PT-BR</a>\n', '')
          replace_once('en/situations/index.html',
                       '<a class="lang" href="../../pt-br/situacoes/" lang="pt-BR">PT-BR</a>\n', '')

          # 3-5. Selectores generados: conservar ES+EN y retirar solo PT-BR.
          old='langButtons: [["es", "ES"], ["en", "EN"], ["pt", "PT-BR"]].map(([code, label]) => ({'
          new='langButtons: [["es", "ES"], ["en", "EN"]].map(([code, label]) => ({'
          for path in [
              'es/neurodiversidad/temas/autismo/index.html',
              'es/tramites/index.html',
              'es/tramites/directorio/index.html',
          ]:
              replace_once(path, old, new)

          # 6. Cinturón común: protección adicional, sin sustituir los cambios anteriores.
          p=Path('assets/site-v23.css')
          s=p.read_text(encoding='utf-8')
          rule='\n/* V39 · PT-BR en pausa: tampoco en la cabecera generada. */\n.ig-uh-langs button[data-lang="pt" i],.ig-uh-langs button[lang="pt-BR" i]{display:none}\n'
          if 'PT-BR en pausa: tampoco en la cabecera generada.' not in s:
              p.write_text(s.rstrip()+rule, encoding='utf-8')
          PY
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add es/situaciones/index.html en/situations/index.html es/neurodiversidad/temas/autismo/index.html es/tramites/index.html es/tramites/directorio/index.html assets/site-v23.css
          git commit -m 'Retirar PT-BR de los cinco selectores activos'
          git push origin HEAD:fix/idiomas-A-20260908
