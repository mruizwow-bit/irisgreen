name: Prisma · #369 P13 Count and pay card
on:
  push:
    branches: ['prisma/369-games-p13-count-pay-card-*']
    paths:
      - 'es/recursos/juegos/index.html'
      - 'en/resources/games/index.html'
      - 'scripts/test_prisma_369_games_p13.py'
      - '.github/workflows/prisma-369-games-p13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Build canónico
        run: python scripts/build_site.py
      - name: QA #369 P13
        run: python scripts/test_prisma_369_games_p13.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prisma-369-games-p13
          path: reports/prisma-369-games-p13/
          retention-days: 14
