name: Inventario forense de idioma
on:
  push:
    branches: ['recuperacion-estable-20260908']
    paths: ['.github/workflows/inventario-idioma-forense.yml']
permissions:
  contents: write
jobs:
  inventario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recuperacion-estable-20260908
          fetch-depth: 0
      - name: Inventariar usos de ig_lang en main
        run: |
          git fetch origin main
          mkdir -p reports
          {
            echo '# Inventario de ig_lang en main'
            echo
            echo 'Commit de main:'
            git rev-parse origin/main
            echo
            echo '## Archivos afectados'
            echo '```text'
            git grep -l 'ig_lang' origin/main -- '*.html' '*.js' | sed 's#^origin/main:##' | sort
            echo '```'
            echo
            echo '## Contextos'
            echo '```text'
            git grep -n -C 3 'ig_lang' origin/main -- '*.html' '*.js' || true
            echo '```'
          } > reports/inventario-ig-lang.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/inventario-ig-lang.md
          git diff --cached --quiet || git commit -m 'Actualizar inventario forense de ig_lang'
          git push origin HEAD:recuperacion-estable-20260908
