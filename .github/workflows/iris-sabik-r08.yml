name: Iris Green · Sabik runtime on main
on:
  push:
    branches: [main]
    paths:
      - 'sabik/**'
      - 'netlify/functions/sabik-voice-proxy.mts'
      - 'scripts/apply_home_r42.py'
      - 'assets/home-r42-child-safe.css'
      - 'scripts/test_sabik_*.py'
      - 'scripts/test_sabik_*.mjs'
      - 'scripts/test_home_child_safe_*.py'
      - 'tools/test-sabik-*.js'
      - '.github/workflows/iris-sabik-r08.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sabik:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 pillow playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Syntax
        run: |
          node --check sabik/iris-mount.mjs
          node --check sabik/voice-runtime.mjs
          node --check sabik/dialogue-library.mjs
          node --check sabik/conversation-core-r66.mjs
      - name: Motion R37
        run: node tools/test-sabik-motion-r37.js
      - name: Presence static
        run: python scripts/test_sabik_presence_r52.py
      - name: Presence browser
        run: python scripts/test_sabik_presence_r52_browser.py
      - name: Fixed audio
        run: |
          node scripts/test_sabik_audio_r01.mjs
          python scripts/test_sabik_audio_assets_r01.py
      - name: Copy
        run: python scripts/test_sabik_copy_r02.py
      - name: Authorized retrieval transport
        run: node tools/test-sabik-authorized-transport-r06.mjs
      - name: Canonical build
        run: python scripts/build_site.py
      - name: Home age + Sabik browser gate
        run: |
          python -m http.server 4173 --directory dist >/tmp/iris-home-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python scripts/test_home_child_safe_browser.py
