name: W02 R1 Contrast Freeze
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify QA-only scope
        shell: bash
        run: |
          git diff --check origin/main...HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s
' "$changed"
          if printf '%s
' "$changed" | grep -Ev '^(.github/workflows/w02-r1-contrast-freeze.yml|qa/w02-r1/)'; then
            echo "W02 freeze must contain QA-only files." >&2
            exit 1
          fi
      - name: Prepare browser dependencies
        run: |
          python3 -m venv /tmp/w02-freeze
          /tmp/w02-freeze/bin/pip -q install playwright==1.55.0 pillow==11.3.0
          /tmp/w02-freeze/bin/python -m playwright install --with-deps chromium >/tmp/w02-playwright-install.log 2>&1
          npm install --no-save --ignore-scripts axe-core@4.13.0
      - name: Build Linux baseline candidate tree
        run: python3 scripts/build_site.py
      - name: Reproduce current contrast audit
        run: /tmp/w02-freeze/bin/python scripts/audit_contrast_signatures.py --root dist --axe node_modules/axe-core/axe.min.js
      - name: Print exact failing signatures and instances
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dist/reports/wcag-contrast-signatures/results.json').read_text())
          failed=[]
          for i,row in enumerate(data['signatures']):
              probes=row.get('pixel_probes') or []
              if probes and not all(p.get('p01_pass',False) for p in probes):
                  failed.append({
                      'signature_index':i,
                      'count':row['count'],
                      'style':row['style'],
                      'required_ratio':row['required_ratio'],
                      'conservative_min_ratio':row['conservative_min_ratio'],
                      'examples':row['examples'],
                      'pixel_probes':probes,
                  })
          print(json.dumps({
              'routes':data['routes'],
              'unique_style_signatures':data['unique_style_signatures'],
              'conservative_pass_signatures':data['conservative_pass_signatures'],
              'pixel_probe_signatures':data['pixel_probe_signatures'],
              'pixel_probe_signatures_with_failures':data['pixel_probe_signatures_with_failures'],
              'failed':failed,
          },ensure_ascii=False,indent=2))
          if len(failed)!=4:
              raise SystemExit(f'Expected exactly 4 baseline failures, got {len(failed)}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: w02-r1-baseline-discovery
          path: dist/reports/wcag-contrast-signatures
          retention-days: 14
