name: Motor · R44 Suite5 finish
on:
  push:
    branches: ['motor/r44-suite5-finish-20261002']
    paths:
      - 'assets/ig-suite.css'
      - 'scripts/test_taller_suite5_runtime_browser.py'
      - '.github/workflows/motor-r44-suite5-finish.yml'

permissions:
  contents: write

jobs:
  suite5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_MAIN_SHA: adc067ab61e9532c7b462ce1711c49df53c4c7cf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: motor/r44-suite5-finish-20261002
          fetch-depth: 0

      - name: Verify clean current-main base
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_MAIN_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_MAIN_SHA" HEAD
          test "$(git merge-base "$BASE_MAIN_SHA" HEAD)" = "$BASE_MAIN_SHA"
          echo "base=$BASE_MAIN_SHA"
          echo "head=$(git rev-parse HEAD)"

      - name: Generate exactly Suite5 hosts from current main generator
        run: |
          set -euo pipefail
          HOSTS=(
            es/taller/pixel-art/index.html en/workshop/pixel-art/index.html
            es/taller/escritura-restricciones/index.html en/workshop/constraint-writing/index.html
            es/taller/juegos-de-mesa/index.html en/workshop/board-games/index.html
            es/taller/ritmo/index.html en/workshop/rhythm-sequencer/index.html
            es/taller/videojuegos/index.html en/workshop/video-game-design/index.html
          )
          sha256sum es/taller/estructuras/index.html en/workshop/structures/index.html es/taller/index.html en/workshop/index.html > /tmp/suite5-protected-before.sha256
          python3 scripts/build_taller_suite.py pixelart escritura juegos_mesa ritmo videojuegos | tee /tmp/suite5-written.txt
          python3 - <<'PY'
          import subprocess
          allowed={
            "es/taller/pixel-art/index.html","en/workshop/pixel-art/index.html",
            "es/taller/escritura-restricciones/index.html","en/workshop/constraint-writing/index.html",
            "es/taller/juegos-de-mesa/index.html","en/workshop/board-games/index.html",
            "es/taller/ritmo/index.html","en/workshop/rhythm-sequencer/index.html",
            "es/taller/videojuegos/index.html","en/workshop/video-game-design/index.html",
          }
          written={x.strip() for x in open("/tmp/suite5-written.txt",encoding="utf-8") if x.strip()}
          if written != allowed:
              raise SystemExit(f"stdout routes differ: missing={sorted(allowed-written)} extra={sorted(written-allowed)}")
          raw=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all","--","es","en"],text=True)
          changed=set()
          for line in raw.splitlines():
              if not line: continue
              path=line[3:]
              if " -> " in path:
                  raise SystemExit("rename/copy outside exact guard: "+line)
              changed.add(path)
          extra=changed-allowed
          if extra:
              raise SystemExit("silent extra ES/EN paths: "+", ".join(sorted(extra)))
          print({"written":len(written),"changed_hosts":len(changed),"extra":[]})
          PY
          sha256sum -c /tmp/suite5-protected-before.sha256
          test "$(wc -l < /tmp/suite5-written.txt)" -eq 10

      - name: Canonical build
        run: python3 scripts/build_site.py

      - name: Prepare Playwright
        run: |
          python3 -m venv /tmp/suite5-qa
          /tmp/suite5-qa/bin/pip -q install playwright==1.55.0
          /tmp/suite5-qa/bin/python -m playwright install --with-deps chromium >/tmp/suite5-browser-install.log 2>&1

      - name: Serve dist
        run: |
          cd dist
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/suite5-http.log 2>&1 &
          echo $! >/tmp/suite5-http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/es/taller/pixel-art/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: LIGHT NAVY token consumption QA
        run: |
          set -euo pipefail
          /tmp/suite5-qa/bin/python scripts/test_taller_suite5_runtime_browser.py | tee /tmp/suite5-token-qa.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: motor-r44-suite5-final-qa
          path: |
            reports/r44-suite5-token-qa
            /tmp/suite5-token-qa.log
            /tmp/suite5-written.txt
            /tmp/suite5-http.log
          retention-days: 14

      - name: Freeze only product delta and remove QA harness
        if: success()
        run: |
          set -euo pipefail
          HOSTS=(
            es/taller/pixel-art/index.html en/workshop/pixel-art/index.html
            es/taller/escritura-restricciones/index.html en/workshop/constraint-writing/index.html
            es/taller/juegos-de-mesa/index.html en/workshop/board-games/index.html
            es/taller/ritmo/index.html en/workshop/rhythm-sequencer/index.html
            es/taller/videojuegos/index.html en/workshop/video-game-design/index.html
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ig-suite.css "${HOSTS[@]}"
          git rm .github/workflows/motor-r44-suite5-finish.yml scripts/test_taller_suite5_runtime_browser.py
          git commit -m 'R44 SUITE5: freeze tokenized hosts on current main'
          git push origin HEAD:motor/r44-suite5-finish-20261002
