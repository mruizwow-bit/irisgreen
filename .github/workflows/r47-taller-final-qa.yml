name: R47 Taller final QA
on:
  push:
    branches: [agent2/sabik-iris-r08-20260924]
    paths:
      - 'es/taller/**'
      - 'en/workshop/**'
      - 'assets/ig-suite*'
      - 'assets/ig-childsafe.js'
      - 'assets/ig-taller-r54-six-art.js'
      - 'assets/vendor/taller/**'
      - 'scripts/test_r47_taller_final.py'
      - '.github/workflows/r47-taller-final-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install beautifulsoup4 pillow playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py
      - run: python scripts/test_r47_taller_final.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r47-taller-final-qa
          path: reports/r47-taller-final.json
          if-no-files-found: ignore
