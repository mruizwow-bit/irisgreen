name: A03 candidate 218 independent gate
on:
  pull_request:
    branches: [sabik/a03-decouple-cognition-safety-20260921]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact A03 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4c67e276d4fd0a0d4d407d3504a7416d7ed39cfb
          path: runtime
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout A03 frozen QA support
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 59cda12c6a21cd0b4de94ae7c113cd20ced3548b
          path: qa-a03
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout A01 frozen QA support
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2cdfc8c2da682ea5e9916b299664b5e4129b4e8
          path: qa-a01
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact environment history and scope
        working-directory: runtime
        run: |
          BASE=0a1d4339bae2628dc963501a30f326553605821b
          CAND=4c67e276d4fd0a0d4d407d3504a7416d7ed39cfb
          test "$(git rev-parse HEAD)" = "$CAND"
          git merge-base --is-ancestor "$BASE" "$CAND"
          test "$(git rev-list --count "$BASE..$CAND")" = "1"
          git diff --check "$BASE..$CAND"
          printf '%s\n'             sabik/W1_A03_COGNITION_SAFETY.md             sabik/nea-core/retrieval.js             tools/test-sabik-a03.js > /tmp/a03-expected-files
          git diff --name-only "$BASE..$CAND" | sort > /tmp/a03-actual-files
          sort /tmp/a03-expected-files -o /tmp/a03-expected-files
          diff -u /tmp/a03-expected-files /tmp/a03-actual-files
          git rev-parse HEAD
          uname -a
          cat /etc/os-release
          node --version
          python3 --version

      - name: Verify A03 freeze blobs and adapter unchanged
        run: |
          test "$(git -C qa-a03 hash-object tests/fixtures/sabik/a03-cognition-adaptation-v1.json)" = "6c7fb8d9c9f9d1f5ebe90163d08fcc7644a9204a"
          test "$(git -C qa-a03 hash-object tests/specs/sabik/a03-gate-v1.json)" = "44684db672c4d06521832ab77b334aeeb41a6c65"
          test "$(git -C qa-a03 hash-object tests/specs/sabik/run-a03-gate-v1.mjs)" = "cfbb01bee6feb116341b7b1ce81bf2941a527ada"
          test "$(git -C qa-a03 hash-object tests/specs/sabik/validate-a03-gate-v1.mjs)" = "78b46efab44392f97bcd0506a1b47590e4b8e5c0"
          test "$(git -C qa-a03 hash-object tools/a03-baseline-adapter.mjs)" = "61a839cf8e2456cedc7e456f9ad4141fb026393a"

      - name: Inject exact A03 freeze temporarily
        working-directory: runtime
        run: |
          mkdir -p tests/fixtures/sabik tests/specs/sabik
          cp ../qa-a03/tests/fixtures/sabik/a03-cognition-adaptation-v1.json tests/fixtures/sabik/
          cp ../qa-a03/tests/specs/sabik/a03-gate-v1.json tests/specs/sabik/
          cp ../qa-a03/tests/specs/sabik/run-a03-gate-v1.mjs tests/specs/sabik/
          cp ../qa-a03/tests/specs/sabik/validate-a03-gate-v1.mjs tests/specs/sabik/
          cp ../qa-a03/tools/a03-baseline-adapter.mjs tools/

      - name: Validate frozen A03 contract
        working-directory: runtime
        run: node tests/specs/sabik/validate-a03-gate-v1.mjs

      - name: Run exact frozen A03 gate
        working-directory: runtime
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          node tests/specs/sabik/run-a03-gate-v1.mjs --adapter tools/a03-baseline-adapter.mjs | tee /tmp/a03-candidate-218.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/a03-candidate-218.exit
          exit "$code"

      - name: Supplemental equivalent SEM-23 observables
        working-directory: runtime
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          const fixtures=JSON.parse(fs.readFileSync('tests/fixtures/sabik/a03-cognition-adaptation-v1.json','utf8'));
          const scenario=fixtures.scenarios.find(x=>x.id==='A03-01-CONFIRMED-SAFETY-ONLY');
          const adapter=await import(pathToFileURL(path.resolve('tools/a03-baseline-adapter.mjs')).href);
          const o=await adapter.runA03Scenario(structuredClone(scenario));
          const inferred_state_changed=o.cognitive_state_before!==o.cognitive_state_after;
          if(inferred_state_changed!==false||o.adaptation_changed!==false) process.exit(1);
          console.log(JSON.stringify({label:'SUPPLEMENTAL_NOT_GATE',sem23_equivalent:{inferred_state_changed,adaptation_changed:o.adaptation_changed,protection_after:o.protection_after,ordinary_retrieval:o.ordinary_retrieval}}));
          JS

      - name: Remove A03 QA harness and prove candidate clean
        working-directory: runtime
        run: |
          rm tests/fixtures/sabik/a03-cognition-adaptation-v1.json
          rm tests/specs/sabik/a03-gate-v1.json
          rm tests/specs/sabik/run-a03-gate-v1.mjs
          rm tests/specs/sabik/validate-a03-gate-v1.mjs
          rm tools/a03-baseline-adapter.mjs
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = 4c67e276d4fd0a0d4d407d3504a7416d7ed39cfb

      - name: Verify A01 freeze blobs and adapter
        run: |
          test "$(git -C qa-a01 hash-object tests/fixtures/sabik/a01-safety-independent-v1.json)" = "8e3e82bbb7ea2dc985eb822d6bccfa9659346707"
          test "$(git -C qa-a01 hash-object tests/specs/sabik/a01-safety-gate-v1.json)" = "b5f86772d58ed1ec4aaa1f22fda2775ea27280d3"
          test "$(git -C qa-a01 hash-object tests/specs/sabik/run-a01-safety-gate-v1.mjs)" = "4fb7fcadb08bfb719870b62cb5ab3328b3158625"
          test "$(git -C qa-a01 hash-object tests/specs/sabik/validate-a01-safety-gate-v1.mjs)" = "a4a0729a4f21b7094425bd38bd21aefb6fc21656"
          test "$(git -C qa-a01 hash-object tools/a01-candidate-212-independent-adapter.mjs)" = "ffbfd2b390ae8f45b9cb95e4512007c81a058875"

      - name: Inject and run exact frozen A01 gate
        working-directory: runtime
        continue-on-error: true
        run: |
          mkdir -p tests/fixtures/sabik tests/specs/sabik
          cp ../qa-a01/tests/fixtures/sabik/a01-safety-independent-v1.json tests/fixtures/sabik/
          cp ../qa-a01/tests/specs/sabik/a01-safety-gate-v1.json tests/specs/sabik/
          cp ../qa-a01/tests/specs/sabik/run-a01-safety-gate-v1.mjs tests/specs/sabik/
          cp ../qa-a01/tests/specs/sabik/validate-a01-safety-gate-v1.mjs tests/specs/sabik/
          cp ../qa-a01/tools/a01-candidate-212-independent-adapter.mjs tools/
          node tests/specs/sabik/validate-a01-safety-gate-v1.mjs
          set +e
          set -o pipefail
          node tests/specs/sabik/run-a01-safety-gate-v1.mjs --adapter tools/a01-candidate-212-independent-adapter.mjs | tee /tmp/a01-on-a03.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/a01-on-a03.exit
          exit "$code"

      - name: Remove A01 QA harness and prove candidate clean
        working-directory: runtime
        run: |
          rm tests/fixtures/sabik/a01-safety-independent-v1.json
          rm tests/specs/sabik/a01-safety-gate-v1.json
          rm tests/specs/sabik/run-a01-safety-gate-v1.mjs
          rm tests/specs/sabik/validate-a01-safety-gate-v1.mjs
          rm tools/a01-candidate-212-independent-adapter.mjs
          test -z "$(git status --porcelain)"

      - name: Pure and product regressions
        working-directory: runtime
        run: |
          node tools/test-sabik-machine-s0.js
          node tools/test-sabik-a03.js
          node tools/test-sabik-a01.js
          node tools/test-sabik-s4.js
          node tools/test-sabik-page-v7.js
          node tools/test-sabik-a11y-closure.js

      - name: Browser tooling
        working-directory: runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/a03-218-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/a03-218-browser/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/a03-218-browser/node_modules" >> "$GITHUB_ENV"
          node -p 'require(process.env.RUNNER_TEMP+"/a03-218-browser/node_modules/playwright/package.json").version'
          google-chrome --version

      - name: Browser source regressions
        working-directory: runtime
        run: |
          node tools/test-sabik-a01-browser.js
          node tools/test-sabik-s1.js
          node tools/test-sabik-s4-browser.js

      - name: Linux build and dist regressions
        working-directory: runtime
        run: |
          python3 scripts/build_site.py
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = 4c67e276d4fd0a0d4d407d3504a7416d7ed39cfb
          export A01_WEB_ROOT="$PWD/dist"
          export S1_WEB_ROOT="$PWD/dist"
          export S4_WEB_ROOT="$PWD/dist"
          node tools/test-sabik-a01-browser.js
          node tools/test-sabik-s1.js
          node tools/test-sabik-s4-browser.js
          node -e 'const fs=require("fs"),p=require("path");const w=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const x=p.join(d,e.name);return e.isDirectory()?w(x):[{x,b:fs.statSync(x).size}]});const f=w("dist");console.log(JSON.stringify({files:f.length,total_bytes:f.reduce((n,x)=>n+x.b,0),max_file_bytes:Math.max(...f.map(x=>x.b))},null,2));'

      - name: Bind final independent verdict
        run: |
          a03="$(cat /tmp/a03-candidate-218.exit)"
          a01="$(cat /tmp/a01-on-a03.exit)"
          if [ "$a03" = "0" ] && [ "$a01" = "0" ]; then
            echo A03_QA_PASS_CANDIDATE
            exit 0
          fi
          echo A03_QA_BLOCKED_CANDIDATE
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: a03-candidate-218-independent
          path: |
            /tmp/a03-candidate-218.log
            /tmp/a01-on-a03.log
          retention-days: 14
