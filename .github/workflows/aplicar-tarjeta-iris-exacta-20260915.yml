name: Aplicar Tarjeta Iris exacta 20260915

on:
  push:
    branches:
      - hotfix/tarjeta-iris-exacta-final-20260915

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload
        uses: actions/checkout@v4
        with:
          ref: hotfix/tarjeta-iris-exacta-final-20260915
          path: payload

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Rebuild exact final files
        shell: bash
        run: |
          set -euo pipefail
          cat payload/release-sync/final-*.b64 | base64 -d > /tmp/final-sync.tar.xz
          echo "9af511b9ea61c22af672bd78a30d6451242a4bb360b632848a01870afc55bc97  /tmp/final-sync.tar.xz" | sha256sum -c -
          tar -xJf /tmp/final-sync.tar.xz -C repo

      - name: Validate exact files
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          test "$(git hash-object assets/tarjeta-iris.js)" = "e573fe61101711449849274c509d7304475ee615"
          test "$(git hash-object assets/tarjeta-iris.css)" = "e9ef3b5592897324a2e1a24a3122a8f568037645"
          test "$(git hash-object assets/recursos-idioma.js)" = "406ca33e4b25aa47d7057d91f2f6d1cf6ea3ff56"
          test "$(git hash-object es/tarjetas-iris/index.html)" = "20f0edff57a1c2a21ebdf953e1477b25779b3bf0"
          test "$(git hash-object es/recursos/index.html)" = "63156a104d2a8fa1d6e8fcd07e4f9394b669ff57"
          node --check assets/tarjeta-iris.js
          node --check assets/recursos-idioma.js
          grep -q "params.has('dificultad')" assets/tarjeta-iris.js
          grep -q "window.location.replace(target)" es/tarjetas-iris/index.html
          grep -q "rg-strip" es/recursos/index.html
          ! grep -q '^\[context\.production\]' netlify.toml

      - name: Commit exact candidate branch
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git config user.name "Iris Green release"
          git config user.email "actions@users.noreply.github.com"
          git add assets/tarjeta-iris.js assets/tarjeta-iris.css assets/recursos-idioma.js es/tarjetas-iris/index.html es/recursos/index.html
          git commit -m "Alinear Tarjeta Iris y Recursos con el ZIP final"
          git push origin HEAD:refs/heads/hotfix/tarjeta-iris-exact-candidate-20260915
