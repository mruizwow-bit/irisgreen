name: R50 Data incremental QA
on:
  push:
    branches: ['agent2/sabik-iris-r08-20260924']
    paths: ['scripts/apply_r50_data_ui.py','scripts/test_r50_data_ui.py','scripts/test_r50_data_browser.py','scripts/build_site.py','assets/ig-r49-transversal.js','assets/ig-r49-transversal.css']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m py_compile scripts/apply_r50_data_ui.py scripts/test_r50_data_ui.py scripts/test_r50_data_browser.py
      - run: |
          python -m venv /tmp/ig-r50-data
          /tmp/ig-r50-data/bin/pip -q install playwright==1.55.0
          /tmp/ig-r50-data/bin/python -m playwright install --with-deps chromium >/tmp/ig-r50-data-install.log 2>&1
      - run: python scripts/build_site.py
      - run: python scripts/test_r50_data_ui.py --root dist
      - run: |
          python -m http.server 4173 --directory dist >/tmp/ig-r50-data-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT; sleep 1
          /tmp/ig-r50-data/bin/python scripts/test_r50_data_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: r50-data-qa, path: reports/r50-data, retention-days: 14}
