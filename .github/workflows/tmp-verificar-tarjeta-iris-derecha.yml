name: Temporal · verificar Tarjeta Iris derecha
on:
  push:
    branches: ['integracion/20260912-correcciones-claude']
    paths:
      - 'scripts/connect_tarjetas_iris.py'
      - 'assets/tarjetas-iris-cta.css'
      - '.github/workflows/tmp-verificar-tarjeta-iris-derecha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Construir
        run: |
          python3 -m pip -q install beautifulsoup4==4.13.4
          python3 scripts/build_site.py
      - name: Comprobar 420 tarjetas editables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          special='es/situaciones/necesito-que-me-repitan-las-instrucciones/index.html'
          groups=[('situaciones','es/situaciones/*/index.html',187),('vida','es/biblioteca/*/index.html',48),('condiciones','es/neurodiversidad/condiciones/*/index.html',185)]
          total=0
          for section,pattern,expected in groups:
              pages=sorted(Path('dist').glob(pattern)); assert len(pages)==expected,(section,len(pages))
              for p in pages:
                  rel=p.relative_to('dist').as_posix()
                  soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
                  cards=soup.select('aside.iris-inline-card[data-iris-card-cta="true"]')
                  assert len(cards)==1,(p,len(cards))
                  card=cards[0]
                  assert card.get('data-iris-section')==section,(p,card.get('data-iris-section'))
                  if rel==special:
                      assert card.parent and 'detail-grid' in (card.parent.get('class') or []),(p,'tarjeta especial fuera de detail-grid')
                      assert soup.select_one('.detail-grid>.request-panel') is not None,(p,'panel especial perdido')
                  else:
                      main=card.find_parent('main'); article=soup.select_one('article.ficha')
                      assert main is not None and article is not None,(p,'estructura')
                      assert card.parent is main,(p,'tarjeta no es hija directa de main')
                      assert article.parent is main,(p,'article no es hijo directo de main')
                  assert card.find('form',action='/es/tarjetas-iris/',method='get'),(p,'sin formulario')
                  for name in ('title','dificultad','ayuda','necesito'):
                      assert card.find(attrs={'name':name}),(p,name)
                  assert not card.find('a',class_='iris-cta-button'),(p,'queda banda/enlace antiguo')
                  total+=1
          assert total==420,total
          css=Path('dist/assets/tarjetas-iris-cta.css').read_text(encoding='utf-8')
          for token in ('#6554A8','#855B87','#626A82','grid-column:2','top:6.5rem','.detail-grid>.iris-inline-card'):
              assert token in css,token
          print('Tarjetas editables comprobadas:',total)
          PY
      - name: Auditorías y contrato
        run: |
          python3 scripts/audit_accesibilidad.py --root dist
          python3 scripts/audit_sin_js.py --root dist
          python3 scripts/audit_sin_portugues.py --root dist
          python3 scripts/audit_sin_estados_publicos.py --root dist
          ! grep -RIl 'fonts.googleapis.com' dist --include='*.html' --include='*.css' | grep -q .
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('dist'); pages=list(root.rglob('*.html'))
          c={'index,follow':0,'noindex,follow':0,'otro_o_ninguno':0}
          for p in pages:
              t=p.read_text(encoding='utf-8',errors='ignore')
              m=(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\']([^"\']*)["\']',t,re.I) or re.search(r'<meta[^>]*content=["\']([^"\']*)["\'][^>]*name=["\']robots["\']',t,re.I))
              v=m.group(1).strip().lower() if m else None
              c[v if v in c else 'otro_o_ninguno']+=1
          got=(len(pages),c['index,follow'],c['noindex,follow'],c['otro_o_ninguno'],len(re.findall(r'<url(?:\s|>)',Path('dist/sitemap.xml').read_text(encoding='utf-8'))))
          assert got==(998,982,2,14,995),got
          print('Contrato:',got)
          PY
