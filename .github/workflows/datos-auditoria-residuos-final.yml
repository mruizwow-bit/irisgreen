name: Datos · auditoría final residuos

on:
  push:
    branches: [feat/en-datos-20260908]
    paths:
      - .github/workflows/datos-auditoria-residuos-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/en-datos-20260908
          fetch-depth: 0
      - name: Buscar restos españoles en EN data
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):[p]})}
          const badWords = /\b(datos|citados|citado|seg[uú]n|fuente comprobada|decisi[oó]n editorial|m[uú]ltiples|a[nñ]os|actualizaci[oó]n|publicaci[oó]n|poblaci[oó]n|personas|ni[nñ]os|mujeres|varones|diagn[oó]sticos|prevalencia|trastorno|discapacidad|autistas|estimaci[oó]n mundial|estructura demogr[aá]fica|sin a[nñ]o|muestra de ni[nñ]os|an[aá]lisis internacional|s[ií]ntesis de estudios|promedio no ponderado|Reino Unido|Estados Unidos|Comisi[oó]n Europea)\b/i;
          const issues = [];
          for (const fp of walk('en/data').filter(f=>f.endsWith('.html'))) {
            const html = fs.readFileSync(fp,'utf8');
            const main = (html.match(/<main[\s\S]*?<\/main>/)||[''])[0]
              .replace(/<a\b[^>]*href="[^"]*"[^>]*>[\s\S]*?<\/a>/g, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>')
              .replace(/\s+/g,' ');
            const m = main.match(badWords);
            if (m) issues.push({file:fp, match:m[0], context:main.slice(Math.max(0,m.index-100), m.index+160)});
          }
          console.log(JSON.stringify(issues,null,2));
          console.log('issues='+issues.length);
          if (issues.length) process.exit(2);
          fs.rmSync('.github/workflows/datos-auditoria-residuos-final.yml', {force:true});
          NODE
      - name: Limpiar workflow temporal
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Retirar auditoría temporal de Datos" || true
          git push origin HEAD:feat/en-datos-20260908
