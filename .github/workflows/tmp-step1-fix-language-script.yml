name: Temporal · Paso 1 ajustar guion de idiomas
on:
  push:
    branches: ['integracion/20260912-sale-portugues']
    paths: ['.github/workflows/tmp-step1-fix-language-script.yml']
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integracion/20260912-sale-portugues
      - name: Ajustar apply_language_updates.py a ES EN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_language_updates.py')
          s=p.read_text(encoding='utf-8')
          old='document.documentElement.lang = l === "pt" ? "pt-BR" : l;'
          new='document.documentElement.lang = l === "en" ? "en" : "es";'
          count=s.count(old)
          assert count==2, f'Esperadas 2 ocurrencias PT en el guion; encontradas {count}'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/apply_language_updates.py
      - name: Guardar el ajuste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/apply_language_updates.py
          git diff --cached --stat
          git diff --cached --quiet || git commit -m 'Paso 1: ajustar el guion de idiomas a ES y EN'
          git push origin HEAD:integracion/20260912-sale-portugues
